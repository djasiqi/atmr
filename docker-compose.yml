# Profils Compose (docker compose v2) — RAM : par défaut seul le socle dev minimal démarre.
#   Base (aucun --profile) : postgres, pgbouncer, redis, osrm, atmr_api
#   --profile celery     : + celery-worker, celery-beat, flower
#   --profile monitoring : + prometheus, grafana
#   --profile loadtest   : + locust
# Exemples : docker compose up -d
#            docker compose --profile celery up -d
#            docker compose -f docker-compose.yml -f docker-compose.kafka.dev.yml up -d  # Kafka 1 broker (voir ce fichier)
#
# Tests DB : pour éviter l’avertissement « orphan » sur postgres_test, lancer aussi
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d postgres_test
# (voir docker-compose.test.yml).
services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atmr}
      POSTGRES_USER: ${POSTGRES_USER:-atmr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atmr}
      TZ: Europe/Zurich
    ports: ["5432:5432"] # pratique en dev
    volumes:
      - pg_data:/var/lib/postgresql/data
      # ✅ P1: Configuration PostgreSQL pour monitoring des performances
      - ./backend/config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./backend/config/postgres/init-postgres-monitoring.sql:/docker-entrypoint-initdb.d/01-monitoring.sql:ro
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # ✅ 3.6: Limits CPU/mémoire
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-atmr}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-atmr}
      DB_NAME: ${POSTGRES_DB:-atmr}
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-100}
      RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-20}
      SERVER_RESET_QUERY: DISCARD ALL
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ✅ 3.5: Reverse proxy nginx (optionnel, décommenter pour activer)
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - atmr_api
  #   restart: unless-stopped
  #   networks:
  #     - default

  atmr_api:
    # Nom stable : un seul conteneur API en dev — évite les replicas numérotés (-1/-2) et le scale accidentel.
    container_name: atmr-atmr_api
    image: atmr-api
    build:
      context: ./backend
      dockerfile: Dockerfile.production
      target: development # Utiliser le stage development de Dockerfile.production
    # ✅ 3.5: Si nginx est activé, l'API n'a pas besoin d'exposer le port 5000 publiquement
    # expose:
    #   - "5000"
    # Healthcheck: vérifie que l'API répond correctement
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    # En développement, on peut surcharger la commande par défaut
    # Commande shell : $${VAR} laisse l’expansion à sh dans le conteneur (évite l’interp. Compose côté hôte).
    command:
      - /bin/sh
      - -c
      - |
        exec gunicorn wsgi:app \
          --bind 0.0.0.0:5000 \
          --worker-class $${GUNICORN_WORKER_CLASS:-eventlet} \
          --workers $${GUNICORN_WORKERS:-2} \
          --timeout 120 \
          --access-logfile - \
          --error-logfile - \
          --log-level debug \
          --no-sendfile
    # Un seul replica en dev : le bind 5000:5000 est unique ; --scale atmr_api>1 peut laisser
    # un conteneur sans endpoint réseau / sans DNS vers pgbouncer (cf. replica « api-1 » cassé).
    ports:
      - "5000:5000"
    env_file:
      - backend/.env
    environment:
      - PYTHONPATH=/app
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-2}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-atmr}:${POSTGRES_PASSWORD:-atmr}@pgbouncer:6432/${POSTGRES_DB:-atmr}
      # GOOGLE_MAPS_API_KEY : défini dans backend/.env (env_file ci-dessus). Ne pas réinjecter ${GOOGLE_MAPS_API_KEY}
      # depuis l’hôte ici : une variable vide écraserait la valeur du fichier.
      - SOCKETIO_ASYNC_MODE=${SOCKETIO_ASYNC_MODE:-eventlet}
      - GUNICORN_WORKER_CLASS=${GUNICORN_WORKER_CLASS:-eventlet}
      - SIO_DISABLE_UPGRADES=false
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - CELERY_TIMEZONE=${CELERY_TIMEZONE:-Europe/Zurich}
      - DISPATCH_AUTORUN_INTERVAL_SEC=${DISPATCH_AUTORUN_INTERVAL_SEC:-300}
      - DISPATCH_AUTORUN_ENABLED=${DISPATCH_AUTORUN_ENABLED:-true}
      - UD_OSRM_URL=${UD_OSRM_URL:-http://osrm:5000}
      - SOCKETIO_CORS_ORIGINS=${SOCKETIO_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8081,http://127.0.0.1:8081}
      - FLASK_CONFIG=${FLASK_CONFIG:-development}
      - DEBUG_LOG_PATH=/app/.cursor/debug.log
      - FLASK_ENV=${FLASK_ENV:-development}
      - FLASK_APP=app.py
      - TZ=Europe/Zurich
      - PDF_BASE_URL=${PDF_BASE_URL:-http://127.0.0.1:5000}
      - UPLOADS_PUBLIC_BASE=${UPLOADS_PUBLIC_BASE:-/uploads}
      - API_DOCS=${API_DOCS:-off}
      - API_LEGACY_ENABLED=${API_LEGACY_ENABLED:-false}
      # Sécurité - Clés de chiffrement (doit être dans backend/.env)
      - APP_ENCRYPTION_KEY_B64=${APP_ENCRYPTION_KEY_B64}
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY}
      # Configuration Brevo pour envoi d'emails transactionnels
      - EMAIL_NOTIFICATIONS_ENABLED=${EMAIL_NOTIFICATIONS_ENABLED:-true}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-brevo}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-noreply@lirie.ch}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-LIRIE}
      # Optimisations PyTorch (même que production)
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - NUMEXPR_NUM_THREADS=2
      # ML/RL Models paths (même que production)
      - ML_MODELS_PATH=/app/data/ml
      - RL_MODELS_PATH=/app/data/rl
      # Worker RL Configuration (pour communication avec docker-compose.rl.yml)
      - RL_WORKER_URL=${RL_WORKER_URL:-http://atmr-rl-worker:5000}
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      # Firebase Cloud Messaging (FCM)
      - FIREBASE_SERVICE_ACCOUNT_PATH=/app/firebase-service-account.json
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON}
      # ✅ D3: Variables de chaos (NE JAMAIS activer en production)
      - CHAOS_ENABLED=${CHAOS_ENABLED:-false}
      - CHAOS_OSRM_DOWN=${CHAOS_OSRM_DOWN:-false}
      - CHAOS_DB_READ_ONLY=${CHAOS_DB_READ_ONLY:-false}
    volumes:
      - ./backend:/app
      # Volume explicite pour uploads (PDFs, logos) — évite ERR_CONNECTION_RESET
      - ./backend/uploads:/app/uploads
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_started
      osrm:
        condition: service_started
    networks:
      default:
        aliases:
          - api
    restart: unless-stopped
    # ✅ 3.6: Limits CPU/mémoire pour API (augmentées pour tests B2)
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "2.0"
          memory: 4G

  celery-worker:
    profiles: ["celery"]
    build:
      context: ./backend
      dockerfile: Dockerfile.production
      target: development
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A celery_app.celery status -t 10 | grep -q 'node online' || exit 1",
        ]
      interval: 30s
      timeout: 60s
      retries: 3
      start_period: 90s
    command:
      - /bin/sh
      - -c
      - |
        exec celery -A celery_app:celery worker -l info \
          --concurrency $${CELERY_CONCURRENCY:-2} \
          --max-tasks-per-child 100 \
          -Q default,dispatch,realtime,notifications,billing,rl,geocoding,dlq
    env_file:
      - backend/.env
    environment:
      - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-2}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-atmr}:${POSTGRES_PASSWORD:-atmr}@pgbouncer:6432/${POSTGRES_DB:-atmr}
      - PYTHONPATH=/app
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - CELERY_TIMEZONE=${CELERY_TIMEZONE:-Europe/Zurich}
      - DISPATCH_AUTORUN_INTERVAL_SEC=${DISPATCH_AUTORUN_INTERVAL_SEC:-300}
      - DISPATCH_AUTORUN_ENABLED=${DISPATCH_AUTORUN_ENABLED:-true}
      - UD_OSRM_URL=${UD_OSRM_URL:-http://osrm:5000}
      - FLASK_CONFIG=${FLASK_CONFIG:-development}
      - FLASK_ENV=${FLASK_ENV:-development}
      - FLASK_APP=app.py
      - PDF_BASE_URL=${PDF_BASE_URL:-http://127.0.0.1:5000}
      - TZ=Europe/Zurich
      # Sécurité - Clés de chiffrement (doit être dans backend/.env)
      - APP_ENCRYPTION_KEY_B64=${APP_ENCRYPTION_KEY_B64}
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY}
      # Configuration Brevo pour envoi d'emails transactionnels
      # Firebase Cloud Messaging (FCM) — pour push notifications Celery worker
      - FIREBASE_SERVICE_ACCOUNT_PATH=/app/firebase-service-account.json
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON}
      # Optimisations PyTorch (même que production)
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
      # ML/RL Models paths (même que production)
      - ML_MODELS_PATH=/app/data/ml
      - RL_MODELS_PATH=/app/data/rl
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
    volumes:
      - ./backend:/app
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_started
      atmr_api:
        condition: service_healthy
    restart: unless-stopped
    # ✅ 3.6: Limits CPU/mémoire pour Celery Worker
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  celery-beat:
    profiles: ["celery"]
    build:
      context: ./backend
      dockerfile: Dockerfile.production
      target: development
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /app/celerybeat-schedule || test -f /app/celerybeat-schedule.db || exit 1",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    command:
      [
        "celery",
        "-A",
        "celery_app:celery",
        "beat",
        "-l",
        "info",
        "-S",
        "celery.beat.PersistentScheduler",
        "-s",
        "/app/celerybeat-schedule",
      ]
    env_file:
      - backend/.env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-atmr}:${POSTGRES_PASSWORD:-atmr}@pgbouncer:6432/${POSTGRES_DB:-atmr}
      - PYTHONPATH=/app
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - CELERY_TIMEZONE=${CELERY_TIMEZONE:-Europe/Zurich}
      - DISPATCH_AUTORUN_INTERVAL_SEC=${DISPATCH_AUTORUN_INTERVAL_SEC:-300}
      - DISPATCH_AUTORUN_ENABLED=${DISPATCH_AUTORUN_ENABLED:-true}
      - FLASK_CONFIG=${FLASK_CONFIG:-development}
      - FLASK_ENV=${FLASK_ENV:-development}
      - PDF_BASE_URL=${PDF_BASE_URL:-http://127.0.0.1:5000}
      - TZ=Europe/Zurich
      # Sécurité - Clés de chiffrement (doit être dans backend/.env)
      - APP_ENCRYPTION_KEY_B64=${APP_ENCRYPTION_KEY_B64}
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY}
      # Configuration Brevo pour envoi d'emails transactionnels
      # Optimisations PyTorch (même que production)
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
      # ML/RL Models paths (même que production)
      - ML_MODELS_PATH=/app/data/ml
      - RL_MODELS_PATH=/app/data/rl
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
    volumes:
      - ./backend:/app
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_started
      atmr_api:
        condition: service_healthy
    restart: unless-stopped
    # ✅ 3.6: Limits CPU/mémoire pour Celery Beat
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M

  flower:
    profiles: ["celery"]
    build:
      context: ./backend
      dockerfile: Dockerfile.production
      target: development
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:5555'', timeout=3)" || exit 1',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: ["celery", "-A", "celery_app:celery", "flower", "--port=5555"]

    ports:
      - "5555:5555"
    env_file:
      - backend/.env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-atmr}:${POSTGRES_PASSWORD:-atmr}@pgbouncer:6432/${POSTGRES_DB:-atmr}
      - PYTHONPATH=/app
      - FLASK_CONFIG=${FLASK_CONFIG:-development}
      - FLASK_ENV=${FLASK_ENV:-development}
      - FLASK_APP=app.py
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      # Sécurité - Clés de chiffrement (doit être dans backend/.env)
      - APP_ENCRYPTION_KEY_B64=${APP_ENCRYPTION_KEY_B64}
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY}
      # Configuration Brevo pour envoi d'emails transactionnels
      # Optimisations PyTorch (même que production)
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
      # ML/RL Models paths (même que production)
      - ML_MODELS_PATH=/app/data/ml
      - RL_MODELS_PATH=/app/data/rl
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
    volumes:
      - ./backend:/app
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_started
      celery-worker:
        condition: service_started
    restart: unless-stopped
    # ✅ 3.6: Limits CPU/mémoire pour Flower
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    command: >-
      redis-server
      --appendonly yes
      --maxmemory 400mb
      --maxmemory-policy volatile-lru
    restart: unless-stopped
    # ✅ 3.6: Limits CPU/mémoire pour Redis
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  osrm:
    image: osrm/osrm-backend:latest
    volumes:
      - ./osrm/data:/data
    # Note: Pas de healthcheck natif (image minimale sans wget/curl)
    # OSRM est testé via fallback haversine côté backend si indisponible
    command: osrm-routed --algorithm mld /data/switzerland-latest.osrm
    restart: unless-stopped
    # ✅ 3.6: Limits CPU/mémoire pour OSRM
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:latest
    container_name: atmr-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9090/-/healthy",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      atmr_api:
        condition: service_healthy
    restart: unless-stopped
    # ✅ 3.6: Limits CPU/mémoire pour Prometheus
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:10.2.0
    container_name: atmr-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      # 127.0.0.1 (pas localhost) : évite les échecs sporadiques si localhost résout en IPv6.
      # curl -f : échoue si le code HTTP est ≥ 400.
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      # Premiers boots / migrations SQLite sur disque lent (p.ex. Windows) : marge généreuse
      start_period: 90s
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    # ✅ 3.6: Limits CPU/mémoire pour Grafana (1G évite OOM au chargement des plugins)
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M

  # ✅ C2: Service Locust pour tests de charge
  locust:
    profiles: ["loadtest"]
    image: locustio/locust:2.24.0
    ports:
      - "8089:8089" # Interface web Locust
    volumes:
      - ./backend:/app
    working_dir: /app
    command: -f tests/load_testing/dispatch_load_test.py --host=http://api:5000
    environment:
      - LOCUST_HOST=http://api:5000
    depends_on:
      - atmr_api
    restart: "no" # Lancer manuellement quand nécessaire
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

volumes:
  pg_data:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  default:
    # Même nom que docker-compose.kafka.yml (réseau partagé sans external quand on merge les deux fichiers).
    name: atmr-stack
