http:
  middlewares:
    cors-www-lirie:
      headers:
        accessControlAllowOriginList:
          - "https://www.lirie.ch"
          - "https://lirie.ch"
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "PATCH"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "Authorization"
          - "Content-Type"
          - "X-Company-ID"
          - "X-Session-ID"
          - "Cache-Control"
          - "Pragma"
        accessControlAllowCredentials: true
        addVaryHeader: true
    # IP allowlist monitoring (Prometheus / Alertmanager).
    # Les CIDR d'accès ops ne doivent PAS être versionnés (voir docs/deployment-ssh.md
    # et deploy/traefik/dynamic.monitoring-ipallow.example.yml). En prod, remplacer
    # le placeholder ci-dessous uniquement sur le serveur.
    monitoring-ipallow:
      ipAllowList:
        sourceRange:
          - "127.0.0.1/32"

  routers:
    atmr_api:
      # F-01 : exclure /api/internal (ingestion GPS réservée au réseau Docker)
      rule: Host(`api.lirie.ch`) && !PathPrefix(`/api/internal`)
      entryPoints: [ websecure ]
      tls:
        certResolver: letsencrypt
      service: atmr_api
      middlewares:
        - cors-www-lirie

    atmr_api_ws:
      rule: Host(`api.lirie.ch`) && PathPrefix(`/socket.io`)
      entryPoints: [ websecure ]
      tls:
        certResolver: letsencrypt
      service: atmr_api
      middlewares:
        - cors-www-lirie

  services:
    atmr_api:
      loadBalancer:
        servers:
          - url: "http://backend:5000"
