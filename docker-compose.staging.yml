# Staging GPS isolé — projet Compose « atmrstg ».
# INTERDIT : merger avec le compose/env de prod, réseaux prod/Traefik,
#            container_name du socle prod.
#
#   bash scripts/staging/preflight.sh
#   bash scripts/staging/init-env.sh
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up -d
#
# Ne pas démarrer tant que le preflight n'est pas PASS.

name: atmrstg

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atmrstg}
      POSTGRES_USER: ${POSTGRES_USER:-atmrstg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD staging requis}
      TZ: Europe/Zurich
      APP_ENV: staging
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - atmrstg

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p0
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-atmrstg}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD staging requis}
      DB_NAME: ${POSTGRES_DB:-atmrstg}
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 40
      RESERVE_POOL_SIZE: 10
      SERVER_RESET_QUERY: DISCARD ALL
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
      AUTH_TYPE: scram-sha-256
      APP_ENV: staging
    ports:
      - "127.0.0.1:16432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - atmrstg

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - atmrstg

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:19092:9092"
    environment:
      CLUSTER_ID: "QVRNUlN0YWdpbmdLMTcyOA"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CONFLUENT_METRICS_ENABLE: "false"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 8s
      retries: 18
    networks:
      - atmrstg

  kafka-topics-init:
    image: confluentinc/cp-kafka:7.6.0
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_PARTITIONS: 3
      KAFKA_DLQ_PARTITIONS: 1
      KAFKA_CREATE_INACTIVE_TOPICS: "false"
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./scripts:/kafka-scripts:ro
    entrypoint: ["/bin/bash", "/kafka-scripts/kafka-init-topics.sh"]
    restart: "no"
    networks:
      - atmrstg

  backend:
    image: ${STAGING_BACKEND_IMAGE:?STAGING_BACKEND_IMAGE requis — jamais latest}
    restart: unless-stopped
    env_file:
      - path: .env.staging
        required: true
    environment:
      APP_ENV: staging
      FLASK_CONFIG: production
      FLASK_ENV: production
      FLASK_APP: app.py
      PYTHONPATH: /app
      POSTGRES_USER: ${POSTGRES_USER:-atmrstg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD staging requis}
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: "6432"
      POSTGRES_DB: ${POSTGRES_DB:-atmrstg}
      POSTGRES_SSLMODE: disable
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-atmrstg}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-atmrstg}
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER:-atmrstg}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-atmrstg}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      API_DOCS: "off"
      API_LEGACY_ENABLED: "false"
      KAFKA_ENABLED: "true"
      TRACKING_INGEST_ASYNC_ENABLED: "true"
      TRACKING_INGEST_PERSIST_ENABLED: "true"
      TRACKING_SOCKET_KAFKA_MIRROR_ENABLED: "false"
      TRACKING_PROCESSED_FANOUT_ENABLED: "false"
      TRACKING_PG_FIRST_CANONICAL_ENABLED: ${TRACKING_PG_FIRST_CANONICAL_ENABLED:-false}
      TRACKING_MISSION_FIREWALL_MODE: ${TRACKING_MISSION_FIREWALL_MODE:-off}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TRACKING_CONSUMER_GROUP: ${KAFKA_TRACKING_CONSUMER_GROUP:-atmrstg-tracking-ingest}
      DRIVER_LOCATION_METRICS_ENABLED: "true"
      HIBP_ENABLED: "false"
      INTERNAL_TRACKING_INGEST_ENABLED: "false"
      PDF_BASE_URL: ${PDF_BASE_URL:-http://127.0.0.1:15000}
      SOCKETIO_CORS_ORIGINS: ${SOCKETIO_CORS_ORIGINS:-http://127.0.0.1:15000}
      GIT_SHA: ${GIT_SHA:-26338ec0e0f124bac7b253b067970e08530aec3f}
      API_GIT_SHA: ${API_GIT_SHA:-26338ec0e0f124bac7b253b067970e08530aec3f}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
      GUNICORN_WORKER_CLASS: gevent
    ports:
      - "127.0.0.1:15000:5000"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s
    networks:
      - atmrstg

  tracking-kafka-consumer:
    image: ${STAGING_BACKEND_IMAGE:?STAGING_BACKEND_IMAGE requis — jamais latest}
    restart: unless-stopped
    command: python -m services.tracking.ingest_consumer
    env_file:
      - path: .env.staging
        required: true
    environment:
      APP_ENV: staging
      FLASK_CONFIG: production
      FLASK_ENV: production
      PYTHONPATH: /app
      POSTGRES_USER: ${POSTGRES_USER:-atmrstg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD staging requis}
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: "6432"
      POSTGRES_DB: ${POSTGRES_DB:-atmrstg}
      POSTGRES_SSLMODE: disable
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-atmrstg}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-atmrstg}
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER:-atmrstg}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-atmrstg}
      REDIS_URL: redis://redis:6379/0
      KAFKA_ENABLED: "true"
      TRACKING_INGEST_ASYNC_ENABLED: "true"
      TRACKING_INGEST_PERSIST_ENABLED: "true"
      TRACKING_PG_FIRST_CANONICAL_ENABLED: ${TRACKING_PG_FIRST_CANONICAL_ENABLED:-false}
      TRACKING_MISSION_FIREWALL_MODE: ${TRACKING_MISSION_FIREWALL_MODE:-off}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TRACKING_CONSUMER_GROUP: ${KAFKA_TRACKING_CONSUMER_GROUP:-atmrstg-tracking-ingest}
      DRIVER_LOCATION_METRICS_ENABLED: "true"
      STANDALONE_PROMETHEUS_ENABLED: "true"
      STANDALONE_PROMETHEUS_PORT: "9115"
      HIBP_ENABLED: "false"
      GIT_SHA: ${GIT_SHA:-26338ec0e0f124bac7b253b067970e08530aec3f}
    depends_on:
      backend:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
    expose:
      - "9115"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import pathlib,sys; cmd=pathlib.Path('/proc/1/cmdline').read_text(); sys.exit(0 if 'ingest_consumer' in cmd else 1)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - atmrstg

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-atmrstg}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD staging requis}@postgres:5432/${POSTGRES_DB:-atmrstg}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - atmrstg

  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - atmrstg

  prometheus:
    image: prom/prometheus:v2.48.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./monitoring/staging/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
      - tracking-kafka-consumer
      - postgres-exporter
      - redis-exporter
    networks:
      - atmrstg

  gps-generator:
    profiles: ["generator"]
    image: ${STAGING_BACKEND_IMAGE:?STAGING_BACKEND_IMAGE requis — jamais latest}
    env_file:
      - path: .env.staging
        required: true
    environment:
      APP_ENV: staging
      FLASK_CONFIG: production
      FLASK_ENV: production
      STAGING_API_URL: http://backend:5000
      PYTHONPATH: /app
      REDIS_URL: redis://redis:6379/0
      POSTGRES_USER: ${POSTGRES_USER:-atmrstg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD staging requis}
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: "6432"
      POSTGRES_DB: ${POSTGRES_DB:-atmrstg}
      POSTGRES_SSLMODE: disable
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-atmrstg}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-atmrstg}
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER:-atmrstg}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-atmrstg}
      API_DOCS: "off"
      API_LEGACY_ENABLED: "false"
      HIBP_ENABLED: "false"
    volumes:
      - ./scripts/staging:/opt/staging:ro
      - staging_output:/output
    working_dir: /opt/staging
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - atmrstg

networks:
  atmrstg:
    name: atmrstg_internal
    driver: bridge

volumes:
  pg_data:
    name: atmrstg_pg_data
  redis_data:
    name: atmrstg_redis_data
  kafka_data:
    name: atmrstg_kafka_data
  prometheus_data:
    name: atmrstg_prometheus_data
  staging_output:
    name: atmrstg_output
