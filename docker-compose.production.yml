# docker-compose.yml
# Configuration Docker Compose optimisée pour la production ATMR
#
# Kafka en prod sans broker inclus : défaut KAFKA_ENABLED=false. Les services
# tracking-kafka-consumer, tracking-processed-fanout et kafka-dlq-consumer
# utilisent le profile Compose « kafka » et ne sont pas démarrés avec un simple
# `docker compose up`. Pour broker(s) joignables : --profile kafka, cluster sur
# atmr-network ou KAFKA_BOOTSTRAP_SERVERS vers un Kafka managé, et surcharge
# KAFKA_ENABLED=true / TRACKING_INGEST_ASYNC_ENABLED=true dans .env.
#
# Stack Kafka (docker-compose.kafka.yml) utilise le réseau default atmr-stack ;
# la prod utilise atmr-network (externe). Pour joindre kafka-broker-* depuis le
# backend / ws-service, merger aussi docker-compose.kafka.atmr-network.yml :
#   docker compose -f docker-compose.production.yml -f docker-compose.kafka.yml \
#     -f docker-compose.kafka.atmr-network.yml --profile kafka up -d
# Automatisation + init topics (broker-1) : scripts/deploy-kafka-production.sh,
# scripts/kafka-init-topics-compose.sh ; variables .env : env.kafka.production.example

services:
  # Base de données PostgreSQL (PostGIS requis pour geo_unit.geom)
  postgres:
    image: postgis/postgis:15-3.5
    container_name: atmr-postgres
    shm_size: "256mb"
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atmr} # ✅ Aligné sur valeur réelle (atmr, pas atmr_db)
      POSTGRES_USER: ${POSTGRES_USER:-atmr} # ✅ Aligné sur valeur réelle (atmr, pas atmr_user)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # ✅ P1: Configuration PostgreSQL pour monitoring des performances
      # Note: Les fichiers de config sont optionnels - si absents, PostgreSQL utilisera les valeurs par défaut
      # Temporairement désactivé pour diagnostiquer le problème de healthcheck
      # - ./backend/config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      # - ./backend/config/postgres/init-postgres-monitoring.sql:/docker-entrypoint-initdb.d/01-monitoring.sql:ro
    # command:
    #   - postgres
    #   - -c
    #   - config_file=/etc/postgresql/postgresql.conf
    # ⚠️ SÉCURITÉ: Port NON exposé publiquement - uniquement accessible via le réseau Docker
    # Si vous devez accéder à PostgreSQL depuis l'extérieur, utilisez un tunnel SSH ou un VPN
    expose:
      - "5432"
    networks:
      - atmr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atmr}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.5"

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: atmr-pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-atmr}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_NAME: ${POSTGRES_DB:-atmr}
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 2000
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-200}
      RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-40}
      SERVER_RESET_QUERY: DISCARD ALL
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
      AUTH_TYPE: scram-sha-256
    expose:
      - "6432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - atmr-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Redis pour Celery
  redis:
    image: redis:7-alpine
    container_name: atmr-redis
    restart: unless-stopped
    # ✅ SÉCURITÉ: Redis avec authentification et non exposé publiquement
    # Le port n'est PAS exposé publiquement (pas de mapping host:container)
    # Redis est uniquement accessible depuis le réseau Docker interne
    command:
      - sh
      - -c
      - |
        REDIS_REQUIREPASS_ARG=""
        if [ -n "$${REDIS_PASSWORD}" ]; then
          REDIS_REQUIREPASS_ARG="--requirepass $${REDIS_PASSWORD}"
        fi
        redis-server \
          $${REDIS_REQUIREPASS_ARG} \
          --appendonly yes \
          --maxmemory 2gb \
          --maxmemory-policy allkeys-lru \
          --save "" \
          --tcp-backlog 511 \
          --tcp-keepalive 60 \
          --bind 0.0.0.0 \
          --protected-mode yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    # ⚠️ SÉCURITÉ: Port NON exposé publiquement - uniquement accessible via le réseau Docker
    # Si vous devez accéder à Redis depuis l'extérieur, utilisez un tunnel SSH ou un VPN
    expose:
      - "6379"
    networks:
      - atmr-network
    # PING échoue pendant LOADING (restauration RDB/AOF) → pas « healthy » tant que Redis n'est pas prêt.
    # start_period généreux : évite de marquer unhealthy trop tôt si la persistance met >15s.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ -n "$${REDIS_PASSWORD}" ]; then redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 3G # Redis reserve pour cache+presence+queue
          cpus: "0.5"
        reservations:
          memory: 512M # ✅ AUDIT 100 USERS: Augmenté de 256M à 512M
          cpus: "0.25"

  # Service OSRM pour le routage
  osrm:
    image: osrm/osrm-backend:latest
    container_name: atmr-osrm
    restart: unless-stopped
    volumes:
      - ./osrm/data:/data
    # Note: Pas de healthcheck natif (image minimale sans wget/curl)
    # OSRM est testé via fallback haversine côté backend si indisponible
    command: osrm-routed --algorithm mld /data/map.osrm
    expose:
      - "5000"
    networks:
      - atmr-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G

  # Backend API (Production)
  backend:
    # BACKEND_IMAGE_REF = repo@sha256:… (préféré) ou repli tag mutable
    image: ${BACKEND_IMAGE_REF:-${DOCKER_IMAGE:-docker.io/djasiqi/atmr-backend}:${DOCKER_TAG:-latest}}
    restart: unless-stopped
    # Charger les variables depuis .env.production (créé par le workflow GitHub Actions)
    env_file:
      - path: .env.production
        required: false
    # Variables d'environnement chargées depuis GitHub Secrets via workflow
    environment:
      # Configuration Flask
      FLASK_ENV: production
      FLASK_CONFIG: production # ⚠️ IMPORTANT: Nécessaire pour charger ProductionConfig
      FLASK_APP: app.py

      # Base de données (variables individuelles pour échappement URL automatique)
      POSTGRES_USER: ${POSTGRES_USER:-atmr} # ✅ Aligné sur valeur réelle (atmr, pas atmr_user)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: 6432
      POSTGRES_DB: ${POSTGRES_DB:-atmr} # ✅ Aligné sur valeur réelle (atmr, pas atmr_db)
      # ⚠️ IMPORTANT: DATABASE_URL doit être construit avec échappement du mot de passe
      # Pour générer l'URL correctement échappée, utilisez:
      # python3 -c "from urllib.parse import quote_plus; print(f'postgresql+psycopg2://{user}:{quote_plus(password)}@{host}:{port}/{db}')"
      # Ou utilisez le script: python scripts/generate_database_url.py USER PASSWORD HOST PORT DB
      # Si DATABASE_URL n'est pas défini, Flask config.py construira automatiquement l'URL
      # via _build_database_url_safe() qui utilise urllib.parse.quote_plus()
      DATABASE_URL: ${DATABASE_URL:-}
      SQLALCHEMY_DATABASE_URI: ${SQLALCHEMY_DATABASE_URI:-${DATABASE_URL:-}}
      PRIMARY_DATABASE_URL: ${PRIMARY_DATABASE_URL:-${SQLALCHEMY_DATABASE_URI:-${DATABASE_URL:-}}}
      REPLICA_DATABASE_URL: ${REPLICA_DATABASE_URL:-}
      REPLICA_DATABASE_URLS: ${REPLICA_DATABASE_URLS:-}

      # Redis/Celery avec authentification
      # ⚠️ IMPORTANT: REDIS_URL est chargée depuis .env.production (créé par le workflow GitHub Actions)
      # avec le mot de passe correctement échappé
      # Le code Python (celery_app.py) peut aussi construire les URLs depuis REDIS_PASSWORD si nécessaire
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: "0"
      # ✅ Forcer explicitement CELERY_BROKER_URL et CELERY_RESULT_BACKEND pour éviter AMQP par défaut
      # Utiliser REDIS_URL si disponible, sinon laisser vide pour que celery_app.py construise depuis REDIS_PASSWORD
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-${REDIS_URL}}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-${REDIS_URL}}
      CELERY_TIMEZONE: ${CELERY_TIMEZONE:-Europe/Zurich}

      # Optimisations PyTorch
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 2
      NUMEXPR_NUM_THREADS: 2

      # Sécurité
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      APP_ENCRYPTION_KEY_B64: ${APP_ENCRYPTION_KEY_B64:?APP_ENCRYPTION_KEY_B64 is required}
      INSTITUTION_MULTI_STOP_ENABLED: ${INSTITUTION_MULTI_STOP_ENABLED:-true}
      # ✅ D2: Clé d'encryption maître pour chiffrement IBAN et données sensibles (AES-256)
      # Format: hexadécimal (64 caractères pour 32 bytes)
      # Générer avec: python -m scripts.generate_encryption_key
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY}

      # ✅ Configuration des cookies (sécurité)
      # En production, les cookies doivent être sécurisés (HTTPS uniquement)
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Strict}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-Lax}
      REMEMBER_COOKIE_SECURE: ${REMEMBER_COOKIE_SECURE:-true}
      REMEMBER_COOKIE_SAMESITE: ${REMEMBER_COOKIE_SAMESITE:-Lax}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # API Configuration
      API_LEGACY_ENABLED: "false" # Désactiver API legacy pour éviter conflit endpoint specs
      API_DOCS: "off" # Désactiver Swagger UI en production

      # Sécurité — feature flags
      SECURITY_2FA_ENABLED: "false"
      IP_MASK_MODE: "first_octet"
      AUDIT_LOG_RETENTION_DAYS: "730"

      # ML Models
      ML_MODELS_PATH: /app/data/ml
      RL_MODELS_PATH: /app/data/rl

      # PDF Base URL (optionnel mais recommandé)
      PDF_BASE_URL: ${PDF_BASE_URL:-}

      # Worker RL Configuration
      # URL du worker RL pour les requêtes d'optimisation Optuna
      RL_WORKER_URL: ${RL_WORKER_URL:-http://atmr-rl-worker:5000}

      # Configuration Gunicorn orientée stabilité (override possible via .env.production)
      # Défaut 2 : gevent + Socket.IO sur le même pool (pas de --preload, voir docker-entrypoint.sh)
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-180}
      GUNICORN_GRACEFUL_TIMEOUT: ${GUNICORN_GRACEFUL_TIMEOUT:-30}
      GUNICORN_KEEPALIVE: ${GUNICORN_KEEPALIVE:-5}
      # Gunicorn 26+ : le worker eventlet n'existe plus. Forcer gevent (override .env.production).
      GUNICORN_WORKER_CLASS: gevent
      SOCKETIO_ASYNC_MODE: gevent
      SKIP_SOCKETIO: ${SKIP_SOCKETIO:-false}
      WS_RELAY_PUBLISH_ENABLED: ${WS_RELAY_PUBLISH_ENABLED:-false}
      IOS_STARTUP_FATAL_RECOVERY_DISABLED: ${IOS_STARTUP_FATAL_RECOVERY_DISABLED:-false}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      TRACKING_INGEST_ASYNC_ENABLED: ${TRACKING_INGEST_ASYNC_ENABLED:-false}
      # Option A — miroir fire-and-forget du chemin socket vers driver.location.raw
      # (voie durable secondaire, non bloquant). OFF par défaut ; n'activer qu'avec
      # le reste des flags Kafka (cf. env.kafka.production.example).
      TRACKING_SOCKET_KAFKA_MIRROR_ENABLED: ${TRACKING_SOCKET_KAFKA_MIRROR_ENABLED:-false}
      # Rate limit socket GPS (aligné cadence mobile ~8s FG). Défaut code = 2/10s.
      WS_DRIVER_LOCATION_BATCH_LIMIT: ${WS_DRIVER_LOCATION_BATCH_LIMIT:-2}
      WS_DRIVER_LOCATION_BATCH_WINDOW_SEC: ${WS_DRIVER_LOCATION_BATCH_WINDOW_SEC:-10}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-broker-1:29092,kafka-broker-2:29092,kafka-broker-3:29092}
      REALTIME_GATEWAY_CANARY_ENABLED: ${REALTIME_GATEWAY_CANARY_ENABLED:-false}
      # F-01 : ingestion GPS interne fail-closed (même secret que ws-service)
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN requis}
      INTERNAL_SERVICE_TOKEN_NEXT: ${INTERNAL_SERVICE_TOKEN_NEXT:-}
      INTERNAL_SERVICE_AUDIENCE: ${INTERNAL_SERVICE_AUDIENCE:-ws-service}
      INTERNAL_TRACKING_INGEST_ENABLED: ${INTERNAL_TRACKING_INGEST_ENABLED:-true}
      INTERNAL_TRACKING_DURABILITY_MODE: ${INTERNAL_TRACKING_DURABILITY_MODE:-sync_db}
      INTERNAL_TRACKING_IDEMPOTENCY_PENDING_TTL_SEC: ${INTERNAL_TRACKING_IDEMPOTENCY_PENDING_TTL_SEC:-60}
      INTERNAL_TRACKING_IDEMPOTENCY_DONE_TTL_SEC: ${INTERNAL_TRACKING_IDEMPOTENCY_DONE_TTL_SEC:-86400}
      INTERNAL_TRACKING_INGEST_RATE_LIMIT: ${INTERNAL_TRACKING_INGEST_RATE_LIMIT:-6000 per minute}
      TRACKING_LEDGER_RETENTION_DAYS: ${TRACKING_LEDGER_RETENTION_DAYS:-45}
      TRACKING_DERIVED_REPAIR_INTERVAL_SEC: ${TRACKING_DERIVED_REPAIR_INTERVAL_SEC:-60}

      # Firebase Cloud Messaging (FCM)
      FIREBASE_SERVICE_ACCOUNT_PATH: /app/firebase-service-account.json

      # ===== Notifications push — Remédiation P0/P1/P2 =====
      # Voir docs/notifications/remediation-flags.md / scripts/env.production.defaults.fragment
      # P0 — Lifecycle DeviceToken (déjà actif en prod)
      PUSH_DEVICE_TOKEN_LIFECYCLE_ENABLED: ${PUSH_DEVICE_TOKEN_LIFECYCLE_ENABLED:-1}
      PUSH_DEVICE_TOKEN_STALE_DAYS: ${PUSH_DEVICE_TOKEN_STALE_DAYS:-30}
      PUSH_DEVICE_TOKEN_MIN_FAILURES: ${PUSH_DEVICE_TOKEN_MIN_FAILURES:-5}
      # P0 — Night mode fuseau explicite
      NIGHT_MODE_TZ: ${NIGHT_MODE_TZ:-Europe/Paris}
      # P0 — Circuit breaker FCM Redis partagé
      FCM_CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${FCM_CIRCUIT_BREAKER_FAILURE_THRESHOLD:-5}
      FCM_CIRCUIT_BREAKER_OPEN_SECONDS: ${FCM_CIRCUIT_BREAKER_OPEN_SECONDS:-60}
      FCM_CIRCUIT_BREAKER_WINDOW_SECONDS: ${FCM_CIRCUIT_BREAKER_WINDOW_SECONDS:-60}
      FCM_RETRY_MAX_ATTEMPTS: ${FCM_RETRY_MAX_ATTEMPTS:-3}
      FCM_RETRY_BASE_DELAY_MS: ${FCM_RETRY_BASE_DELAY_MS:-2000}
      # P2 — Push pipeline Kafka-first (off par défaut tant que broker non bascule)
      NOTIFICATIONS_KAFKA_PUBLISH_ENABLED: ${NOTIFICATIONS_KAFKA_PUBLISH_ENABLED:-false}
      PUSH_KAFKA_FIRST_ENABLED: ${PUSH_KAFKA_FIRST_ENABLED:-false}

      # Migrations Alembic : désactivées au démarrage du conteneur (voir migration_exec /
      # DATABASE_URL_DIRECT dans scripts/deploy-production.sh). DATABASE_URL passe par PgBouncer.
      RUN_ENTRYPOINT_MIGRATIONS: "0"

    volumes:
      - backend_logs:/app/logs
      - backend_data:/app/data
      - backend_cache:/app/cache
      - backend_uploads:/app/uploads # Volume pour les logos de compagnie et autres uploads
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
      # Les modèles ML/RL sont inclus dans l'image Docker
    # F-01 : pas de publication hôte 5000 — accès uniquement via réseau Docker
    # (backend:5000) et Traefik (api.lirie.ch hors /api/internal).
    networks:
      - atmr-network
      - traefik-network
      - atmr-rl-network # Pour communiquer avec le worker RL
    # Labels Traefik pour le routage automatique + autoheal (restart si unhealthy)
    labels:
      - "autoheal=true"
      # Activer Traefik pour ce conteneur
      - "traefik.enable=true"
      # Router les requêtes vers le backend sur api.lirie.ch
      # F-01 : exclure /api/internal (ingestion GPS réservée au réseau Docker)
      # Router HTTP (port 80) - redirige vers HTTPS
      - "traefik.http.routers.backend.rule=Host(`api.lirie.ch`) && !PathPrefix(`/api/internal`)"
      - "traefik.http.routers.backend.entrypoints=web"
      # Router HTTPS (port 443) avec certificat SSL automatique
      - "traefik.http.routers.backend-secure.rule=Host(`api.lirie.ch`) && !PathPrefix(`/api/internal`)"
      - "traefik.http.routers.backend-secure.entrypoints=websecure"
      - "traefik.http.routers.backend-secure.tls.certresolver=letsencrypt"
      # Redirection HTTP vers HTTPS
      - "traefik.http.middlewares.backend-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.backend-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.backend.middlewares=backend-redirect"
      # Service backend (port interne du conteneur)
      - "traefik.http.services.backend.loadbalancer.server.port=5000"
      # ✅ Sticky sessions pour Socket.IO (cookie-based)
      # Garantit que les connexions Socket.IO restent sur le même worker
      - "traefik.http.services.backend.loadbalancer.sticky.cookie=true"
      - "traefik.http.services.backend.loadbalancer.sticky.cookie.name=ATMR_SOCKET_SESSION"
      - "traefik.http.services.backend.loadbalancer.sticky.cookie.secure=true"
      - "traefik.http.services.backend.loadbalancer.sticky.cookie.httpOnly=true"
      # Headers pour proxy
      - "traefik.http.middlewares.backend-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.backend-secure.middlewares=backend-headers"
      # ✅ WebSocket: Route spécifique pour /socket.io avec sticky sessions
      # Les timeouts WebSocket sont gérés au niveau de l'entrypoint Traefik (voir traefik.yml)
      - "traefik.http.routers.backend-secure-ws.rule=Host(`api.lirie.ch`) && PathPrefix(`/socket.io`)"
      - "traefik.http.routers.backend-secure-ws.entrypoints=websecure"
      - "traefik.http.routers.backend-secure-ws.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend-secure-ws.service=backend"
      - "traefik.http.routers.backend-secure-ws.middlewares=backend-headers"
      - "traefik.http.routers.backend-secure-ws.priority=50"
      # ✅ Healthcheck pour le service backend (évite 502 si backend down)
      - "traefik.http.services.backend.loadbalancer.healthcheck.path=/api/v1/ready"
      - "traefik.http.services.backend.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.services.backend.loadbalancer.healthcheck.timeout=10s"
      - "traefik.http.services.backend.loadbalancer.healthcheck.scheme=http"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      osrm:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; r=urllib.request.urlopen('http://localhost:5000/api/v1/ready', timeout=5); exit(0 if r.status==200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 3G # ✅ AUDIT 100 USERS: Augmenté de 2G à 3G (6 workers × ~500 MB chacun)
          cpus: "6.0" # ✅ AUDIT 100 USERS: Augmenté de 2.0 à 6.0 (6 workers, laisser 2 CPU pour système/overhead)
        reservations:
          memory: 2G # ✅ AUDIT 100 USERS: Augmenté de 1G à 2G
          cpus: "5.0" # ✅ AUDIT 100 USERS: Augmenté de 1.0 à 5.0

  # Image construite et poussée par CI (services/ws-service) — pas de contexte local sur /srv/atmr
  ws-service:
    image: ${WS_SERVICE_IMAGE_REF:-${WS_SERVICE_IMAGE:-docker.io/djasiqi/atmr-ws-service}:${DOCKER_TAG:-latest}}
    container_name: atmr-ws-service
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      WS_VERSION: ${WS_VERSION:-v1}
      WS_AUTHORITY_SOURCE: ws-service
      WS_PRESENCE_TTL_SECONDS: ${WS_PRESENCE_TTL_SECONDS:-90}
      WS_AUTH_CACHE_TTL_SECONDS: ${WS_AUTH_CACHE_TTL_SECONDS:-60}
      WS_ALLOW_IF_REDIS_PRESENCE_DOWN: ${WS_ALLOW_IF_REDIS_PRESENCE_DOWN:-true}
      WS_ALLOW_IF_REDIS_AUTH_DOWN: ${WS_ALLOW_IF_REDIS_AUTH_DOWN:-false}
      REDIS_CLUSTER_URL: ${REDIS_CLUSTER_URL:-redis://redis:6379/0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      WS_CANARY_ENABLED: ${WS_CANARY_ENABLED:-false}
      WS_CANARY_PERCENT: ${WS_CANARY_PERCENT:-1}
      WS_CANARY_HEADER_VALUE: ${WS_CANARY_HEADER_VALUE:-1}
      WS_CANARY_COOKIE_VALUE: ${WS_CANARY_COOKIE_VALUE:-1}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-broker-1:29092,kafka-broker-2:29092,kafka-broker-3:29092}
      WS_KAFKA_CONSUMER_ENABLED: ${WS_KAFKA_CONSUMER_ENABLED:-false}
      WS_KAFKA_GROUP_ID: ${WS_KAFKA_GROUP_ID:-ws-service-shared}
      WS_KAFKA_AUTO_OFFSET_RESET: ${WS_KAFKA_AUTO_OFFSET_RESET:-latest}
      WS_KAFKA_SESSION_TIMEOUT_MS: ${WS_KAFKA_SESSION_TIMEOUT_MS:-30000}
      WS_KAFKA_HEARTBEAT_INTERVAL_MS: ${WS_KAFKA_HEARTBEAT_INTERVAL_MS:-10000}
      WS_KAFKA_REBALANCE_TIMEOUT_MS: ${WS_KAFKA_REBALANCE_TIMEOUT_MS:-60000}
      WS_KAFKA_SEEK_TO_END_ON_START: ${WS_KAFKA_SEEK_TO_END_ON_START:-true}
      WS_KAFKA_ENABLE_MISSION_EVENTS: ${WS_KAFKA_ENABLE_MISSION_EVENTS:-false}
      WS_KAFKA_SECURITY_PROTOCOL: ${WS_KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      WS_KAFKA_SASL_MECHANISM: ${WS_KAFKA_SASL_MECHANISM:-}
      WS_KAFKA_SASL_USERNAME: ${WS_KAFKA_SASL_USERNAME:-}
      WS_KAFKA_SASL_PASSWORD: ${WS_KAFKA_SASL_PASSWORD:-}
      WS_KAFKA_SSL_CAFILE: ${WS_KAFKA_SSL_CAFILE:-}
      WS_KAFKA_SSL_CERTFILE: ${WS_KAFKA_SSL_CERTFILE:-}
      WS_KAFKA_SSL_KEYFILE: ${WS_KAFKA_SSL_KEYFILE:-}
      KAFKA_TOPIC_DRIVER_LOCATION_PROCESSED: ${KAFKA_TOPIC_DRIVER_LOCATION_PROCESSED:-driver.location.processed}
      KAFKA_TOPIC_MISSION_EVENTS: ${KAFKA_TOPIC_MISSION_EVENTS:-mission.events}
      # P1-1c : métrique lag consumer ws-service-shared (exposée sur /metrics:8001)
      TRACKING_KAFKA_LAG_METRIC_ENABLED: ${TRACKING_KAFKA_LAG_METRIC_ENABLED:-true}
      WS_SERVICE_ACCEPT_CONNECTIONS: ${WS_SERVICE_ACCEPT_CONNECTIONS:-true}
      WS_KILL_SWITCH_DRAIN_SEC: ${WS_KILL_SWITCH_DRAIN_SEC:-30}
      BACKEND_INTERNAL_TRACKING_INGEST_URL: ${BACKEND_INTERNAL_TRACKING_INGEST_URL:-http://backend:5000/api/internal/tracking/ingest}
      # F-01 : pas de défaut vide — à fournir via .env.production / secrets
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN requis}
      INTERNAL_SERVICE_AUDIENCE: ${INTERNAL_SERVICE_AUDIENCE:-ws-service}
      # F-02 spool Redis Streams (flush off au premier déploiement, puis true)
      WS_GPS_SPOOL_BACKEND: ${WS_GPS_SPOOL_BACKEND:-redis_stream}
      WS_GPS_FLUSH_ENABLED: ${WS_GPS_FLUSH_ENABLED:-false}
      WS_GPS_MAX_EVENT_AGE_SEC: ${WS_GPS_MAX_EVENT_AGE_SEC:-85800}
      WS_GPS_PEL_MIN_IDLE_MS: ${WS_GPS_PEL_MIN_IDLE_MS:-30000}
      WS_GPS_SPOOL_MAX_EVENTS: ${WS_GPS_SPOOL_MAX_EVENTS:-500000}
      WS_GPS_SPOOL_MAX_BYTES: ${WS_GPS_SPOOL_MAX_BYTES:-268435456}
      WS_GPS_DLQ_MAX_EVENTS: ${WS_GPS_DLQ_MAX_EVENTS:-100000}
      WS_GPS_DLQ_MAX_BYTES: ${WS_GPS_DLQ_MAX_BYTES:-67108864}
      WS_GPS_DLQ_RETENTION_DAYS: ${WS_GPS_DLQ_RETENTION_DAYS:-30}
      WS_GPS_INGEST_CONNECT_TIMEOUT_SEC: ${WS_GPS_INGEST_CONNECT_TIMEOUT_SEC:-2}
      WS_GPS_INGEST_READ_TIMEOUT_SEC: ${WS_GPS_INGEST_READ_TIMEOUT_SEC:-10}
    expose:
      - "8001"
    networks:
      - atmr-network
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.ws-service.loadbalancer.server.port=8001"
      - "traefik.http.services.ws-service.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.ws-service.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.services.ws-service.loadbalancer.healthcheck.timeout=10s"
      # ⚠️ Traefik v3 : matchers Header / HeaderRegexp (singulier).
      # En v2 c'était Headers / HeadersRegexp (pluriel) — ne PAS revenir au pluriel
      # tant que la prod tourne Traefik v3, sinon la règle est rejetée comme fonction non supportée.
      - "traefik.http.routers.ws-canary-secure.rule=Host(`api.lirie.ch`) && PathPrefix(`/socket.io`) && (Header(`X-WS-Canary`, `${WS_CANARY_HEADER_VALUE:-1}`) || HeaderRegexp(`Cookie`, `(?i).*ws_canary=${WS_CANARY_COOKIE_VALUE:-1}.*`))"
      - "traefik.http.routers.ws-canary-secure.entrypoints=websecure"
      - "traefik.http.routers.ws-canary-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ws-canary-secure.priority=200"
      - "traefik.http.routers.ws-canary-secure.service=ws-service"
      - "traefik.http.routers.ws-canary-secure.middlewares=backend-headers"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 25s

  # Worker Celery
  celery-worker:
    # BACKEND_IMAGE_REF = repo@sha256:… (préféré) ou repli tag mutable
    image: ${BACKEND_IMAGE_REF:-${DOCKER_IMAGE:-docker.io/djasiqi/atmr-backend}:${DOCKER_TAG:-latest}}
    container_name: atmr-celery-worker
    restart: unless-stopped
    # Charger les variables depuis .env.production (créé par le workflow GitHub Actions)
    env_file:
      - path: .env.production
        required: false
    command: celery -A celery_app.celery worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-4} -Q default,dispatch,realtime,notifications,billing,rl,geocoding,dlq
    healthcheck:
      test: ["CMD", "celery", "-A", "celery_app.celery", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      # Même configuration que le backend
      FLASK_ENV: production
      FLASK_CONFIG: production # ⚠️ IMPORTANT: Nécessaire pour charger ProductionConfig
      # Base de données (variables individuelles pour échappement URL automatique)
      POSTGRES_USER: ${POSTGRES_USER:-atmr} # ✅ Aligné sur valeur réelle (atmr, pas atmr_user)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: 6432
      POSTGRES_DB: ${POSTGRES_DB:-atmr} # ✅ Aligné sur valeur réelle (atmr, pas atmr_db)
      # SQLALCHEMY_DATABASE_URI explicite pour les migrations Flask
      SQLALCHEMY_DATABASE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}
      # DATABASE_URL sera construit par config.py avec échappement URL automatique
      # Redis/Celery avec authentification
      # ⚠️ IMPORTANT: Ne pas construire les URLs Redis ici car Docker Compose
      # n'échappe pas les caractères spéciaux dans REDIS_PASSWORD
      # Le code Python (celery_app.py) construira automatiquement les URLs
      # avec échappement correct depuis REDIS_PASSWORD
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: "0"
      REDIS_URL: ${REDIS_URL:-}
      # ✅ Forcer explicitement CELERY_BROKER_URL et CELERY_RESULT_BACKEND pour éviter AMQP par défaut
      # Utiliser REDIS_URL si disponible, sinon laisser vide pour que celery_app.py construise depuis REDIS_PASSWORD
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-${REDIS_URL}}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-${REDIS_URL}}
      CELERY_TIMEZONE: ${CELERY_TIMEZONE:-Europe/Zurich}
      CELERY_TASK_TIME_LIMIT: ${CELERY_TASK_TIME_LIMIT:-900}
      CELERY_TASK_SOFT_TIME_LIMIT: ${CELERY_TASK_SOFT_TIME_LIMIT:-840}
      DISPATCH_TASK_TIME_LIMIT_SEC: ${DISPATCH_TASK_TIME_LIMIT_SEC:-900}
      DISPATCH_TASK_SOFT_TIME_LIMIT_SEC: ${DISPATCH_TASK_SOFT_TIME_LIMIT_SEC:-840}
      # Optimisations PyTorch pour le worker
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1

      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ML_MODELS_PATH: /app/data/ml
      RL_MODELS_PATH: /app/data/rl
      APP_ENCRYPTION_KEY_B64: ${APP_ENCRYPTION_KEY_B64:?APP_ENCRYPTION_KEY_B64 is required}
      INSTITUTION_MULTI_STOP_ENABLED: ${INSTITUTION_MULTI_STOP_ENABLED:-true}

      # Firebase Cloud Messaging (FCM)
      FIREBASE_SERVICE_ACCOUNT_PATH: /app/firebase-service-account.json

      # ===== Notifications push — Remédiation P0/P1/P2 (worker Celery) =====
      PUSH_DEVICE_TOKEN_LIFECYCLE_ENABLED: ${PUSH_DEVICE_TOKEN_LIFECYCLE_ENABLED:-1}
      PUSH_DEVICE_TOKEN_STALE_DAYS: ${PUSH_DEVICE_TOKEN_STALE_DAYS:-30}
      PUSH_DEVICE_TOKEN_MIN_FAILURES: ${PUSH_DEVICE_TOKEN_MIN_FAILURES:-5}
      NIGHT_MODE_TZ: ${NIGHT_MODE_TZ:-Europe/Paris}
      FCM_CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${FCM_CIRCUIT_BREAKER_FAILURE_THRESHOLD:-5}
      FCM_CIRCUIT_BREAKER_OPEN_SECONDS: ${FCM_CIRCUIT_BREAKER_OPEN_SECONDS:-60}
      FCM_CIRCUIT_BREAKER_WINDOW_SECONDS: ${FCM_CIRCUIT_BREAKER_WINDOW_SECONDS:-60}
      FCM_RETRY_MAX_ATTEMPTS: ${FCM_RETRY_MAX_ATTEMPTS:-3}
      FCM_RETRY_BASE_DELAY_MS: ${FCM_RETRY_BASE_DELAY_MS:-2000}
      NOTIFICATIONS_KAFKA_PUBLISH_ENABLED: ${NOTIFICATIONS_KAFKA_PUBLISH_ENABLED:-false}
      PUSH_KAFKA_FIRST_ENABLED: ${PUSH_KAFKA_FIRST_ENABLED:-false}

    volumes:
      - backend_logs:/app/logs
      - backend_data:/app/data
      - backend_cache:/app/cache
      # Même volume uploads que l'API : PDF factures / rappels générés via Celery
      - backend_uploads:/app/uploads
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
      # Les modèles ML/RL sont inclus dans l'image Docker
    networks:
      - atmr-network
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G # Option A : marge pour concurrency=4 + calibration worker_max_memory_per_child (D2)
          cpus: "1.0"
        reservations:
          memory: 1G
          cpus: "0.5"

  tracking-kafka-consumer:
    profiles:
      - kafka
    # BACKEND_IMAGE_REF = repo@sha256:… (préféré) ou repli tag mutable
    image: ${BACKEND_IMAGE_REF:-${DOCKER_IMAGE:-docker.io/djasiqi/atmr-backend}:${DOCKER_TAG:-latest}}
    # Pas de container_name : requis pour `docker compose up --scale tracking-kafka-consumer=3` (Compose classique, 3 processus / partitions).
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    command: python -m services.tracking.ingest_consumer
    environment:
      FLASK_ENV: production
      FLASK_CONFIG: production
      # DSN construit côté Python (quote_plus) — neutralise les URL héritées de .env.production
      POSTGRES_USER: ${POSTGRES_USER:-atmr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: "6432"
      POSTGRES_DB: ${POSTGRES_DB:-atmr}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      DATABASE_URL: ""
      SQLALCHEMY_DATABASE_URI: ""
      PRIMARY_DATABASE_URL: ""
      REPLICA_DATABASE_URL: ""
      REPLICA_DATABASE_URLS: ""
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      TRACKING_INGEST_ASYNC_ENABLED: ${TRACKING_INGEST_ASYNC_ENABLED:-false}
      TRACKING_INGEST_PERSIST_ENABLED: ${TRACKING_INGEST_PERSIST_ENABLED:-false}
      TRACKING_INGEST_SEEK_TO_END_ON_START: ${TRACKING_INGEST_SEEK_TO_END_ON_START:-false}
      KAFKA_PUBLISH_ACK_TIMEOUT_S: ${KAFKA_PUBLISH_ACK_TIMEOUT_S:-2}
      # P0-3 : timeout snap OSRM (doit rester < KAFKA_PUBLISH_ACK_TIMEOUT_S) + kill-switch granulaire
      OSRM_SNAP_TIMEOUT_S: ${OSRM_SNAP_TIMEOUT_S:-1.5}
      OSRM_SNAP_TIMEOUT_ENABLED: ${OSRM_SNAP_TIMEOUT_ENABLED:-true}
      # P1-1a : métrique de lag consumer (garde-fou avant persistance), désactivable à chaud
      TRACKING_KAFKA_LAG_METRIC_ENABLED: ${TRACKING_KAFKA_LAG_METRIC_ENABLED:-true}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-broker-1:29092,kafka-broker-2:29092,kafka-broker-3:29092}
      KAFKA_TRACKING_CONSUMER_GROUP: ${KAFKA_TRACKING_CONSUMER_GROUP:-tracking-ingest-consumer-group}
      KAFKA_TOPIC_DRIVER_LOCATION_RAW: ${KAFKA_TOPIC_DRIVER_LOCATION_RAW:-driver.location.raw}
      KAFKA_TOPIC_DRIVER_LOCATION_PROCESSED: ${KAFKA_TOPIC_DRIVER_LOCATION_PROCESSED:-driver.location.processed}
      KAFKA_TOPIC_DRIVER_LOCATION_VALIDATED: ${KAFKA_TOPIC_DRIVER_LOCATION_VALIDATED:-driver.location.processed}
      KAFKA_TOPIC_DRIVER_LOCATION_DLQ: ${KAFKA_TOPIC_DRIVER_LOCATION_DLQ:-driver.location.dlq}
      KAFKA_TOPIC_MISSION_EVENTS: ${KAFKA_TOPIC_MISSION_EVENTS:-mission.events}
      KAFKA_TOPIC_NOTIFICATION_EVENTS: ${KAFKA_TOPIC_NOTIFICATION_EVENTS:-notification.events}
      KAFKA_TOPIC_DISPATCH_EVENTS: ${KAFKA_TOPIC_DISPATCH_EVENTS:-dispatch.events}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      KAFKA_SSL_CAFILE: ${KAFKA_SSL_CAFILE:-}
      KAFKA_SSL_CERTFILE: ${KAFKA_SSL_CERTFILE:-}
      KAFKA_SSL_KEYFILE: ${KAFKA_SSL_KEYFILE:-}
      STANDALONE_PROMETHEUS_PORT: ${TRACKING_CONSUMER_METRICS_PORT:-9115}
      STANDALONE_PROMETHEUS_ENABLED: ${STANDALONE_PROMETHEUS_ENABLED:-true}
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    networks:
      - atmr-network
    # `deploy.replicas` ne s’applique qu’en mode Swarm. En Compose classique : --profile kafka + --scale, ex. :
    #   docker compose -f docker-compose.production.yml --profile kafka up -d --scale tracking-kafka-consumer=3 tracking-kafka-consumer
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    expose:
      - "${TRACKING_CONSUMER_METRICS_PORT:-9115}"
    # Consumer Kafka pur : remplace le HEALTHCHECK HTTP Flask de l'image (faux unhealthy → restart loop).
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import pathlib,sys; cmd=pathlib.Path('/proc/1/cmdline').read_text(); sys.exit(0 if 'ingest_consumer' in cmd else 1)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

