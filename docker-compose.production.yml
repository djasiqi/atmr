      SQLALCHEMY_DATABASE_URI: ""
      PRIMARY_DATABASE_URL: ""
      REPLICA_DATABASE_URL: ""
      REPLICA_DATABASE_URLS: ""
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-broker-1:29092,kafka-broker-2:29092,kafka-broker-3:29092}
      KAFKA_DLQ_CONSUMER_GROUP: ${KAFKA_DLQ_CONSUMER_GROUP:-kafka-dlq-consumer-group}
      KAFKA_TOPIC_NOTIFICATIONS_DLQ: ${KAFKA_TOPIC_NOTIFICATIONS_DLQ:-notifications.dlq}
      KAFKA_TOPIC_DRIVER_LOCATION_DLQ: ${KAFKA_TOPIC_DRIVER_LOCATION_DLQ:-driver.location.dlq}
      KAFKA_DLQ_STORAGE_PATH: ${KAFKA_DLQ_STORAGE_PATH:-/app/data/kafka_dlq_events.jsonl}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      KAFKA_SSL_CAFILE: ${KAFKA_SSL_CAFILE:-}
      KAFKA_SSL_CERTFILE: ${KAFKA_SSL_CERTFILE:-}
      KAFKA_SSL_KEYFILE: ${KAFKA_SSL_KEYFILE:-}
    volumes:
      - kafka_dlq_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    networks:
      - atmr-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import pathlib,sys; cmd=pathlib.Path('/proc/1/cmdline').read_text(); sys.exit(0 if 'dlq_consumer' in cmd else 1)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"

  # Beat Celery (planificateur)
  celery-beat:
    # BACKEND_IMAGE_REF = repo@sha256:… (préféré) ou repli tag mutable
    image: ${BACKEND_IMAGE_REF:-${DOCKER_IMAGE:-docker.io/djasiqi/atmr-backend}:${DOCKER_TAG:-latest}}
    container_name: atmr-celery-beat
    restart: unless-stopped
    # Charger les variables depuis .env.production (créé par le workflow GitHub Actions)
    env_file:
      - path: .env.production
        required: false
    command:
      [
        "celery",
        "-A",
        "celery_app.celery",
        "beat",
        "-l",
        "info",
        "-S",
        "celery.beat.PersistentScheduler",
        "-s",
        "/app/celerybeat/celerybeat-schedule",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /app/celerybeat/celerybeat-schedule && echo 'ok' || exit 1",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      FLASK_ENV: production
      FLASK_CONFIG: production # ⚠️ IMPORTANT: Nécessaire pour charger ProductionConfig
      # Base de données (variables individuelles pour échappement URL automatique)
      POSTGRES_USER: ${POSTGRES_USER:-atmr} # ✅ Aligné sur valeur réelle (atmr, pas atmr_user)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: 6432
      POSTGRES_DB: ${POSTGRES_DB:-atmr} # ✅ Aligné sur valeur réelle (atmr, pas atmr_db)
      # SQLALCHEMY_DATABASE_URI explicite pour les migrations Flask
      SQLALCHEMY_DATABASE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}
      # DATABASE_URL sera construit par config.py avec échappement URL automatique
      # Redis/Celery avec authentification
      # ⚠️ IMPORTANT: Ne pas construire les URLs Redis ici car Docker Compose
      # n'échappe pas les caractères spéciaux dans REDIS_PASSWORD
      # Le code Python (celery_app.py) construira automatiquement les URLs
      # avec échappement correct depuis REDIS_PASSWORD
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: "0"
      REDIS_URL: ${REDIS_URL:-}
      # ✅ Forcer explicitement CELERY_BROKER_URL et CELERY_RESULT_BACKEND pour éviter AMQP par défaut
      # Utiliser REDIS_URL si disponible, sinon laisser vide pour que celery_app.py construise depuis REDIS_PASSWORD
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-${REDIS_URL}}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-${REDIS_URL}}
      CELERY_TIMEZONE: ${CELERY_TIMEZONE:-Europe/Zurich}
      CELERY_TASK_TIME_LIMIT: ${CELERY_TASK_TIME_LIMIT:-900}
      CELERY_TASK_SOFT_TIME_LIMIT: ${CELERY_TASK_SOFT_TIME_LIMIT:-840}
      DISPATCH_TASK_TIME_LIMIT_SEC: ${DISPATCH_TASK_TIME_LIMIT_SEC:-900}
      DISPATCH_TASK_SOFT_TIME_LIMIT_SEC: ${DISPATCH_TASK_SOFT_TIME_LIMIT_SEC:-840}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_ENCRYPTION_KEY_B64: ${APP_ENCRYPTION_KEY_B64:?APP_ENCRYPTION_KEY_B64 is required}
    volumes:
      - backend_logs:/app/logs
      - celery_beat_data:/app/celerybeat
    networks:
      - atmr-network
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.25"
        reservations:
          memory: 192M
          cpus: "0.1"

  # Flower (monitoring Celery) - Optionnel
  flower:
    # BACKEND_IMAGE_REF = repo@sha256:… (préféré) ou repli tag mutable
    image: ${BACKEND_IMAGE_REF:-${DOCKER_IMAGE:-docker.io/djasiqi/atmr-backend}:${DOCKER_TAG:-latest}}
    container_name: atmr-flower
    restart: unless-stopped
    # Charger les variables depuis .env.production (créé par le workflow GitHub Actions)
    env_file:
      - path: .env.production
        required: false
    command:
      [
        "celery",
        "-A",
        "celery_app.celery",
        "flower",
        "--port=5555",
        "--max_tasks=10000",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5555', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      FLASK_ENV: production
      FLASK_CONFIG: production
      # ⚠️ IMPORTANT: Ne pas construire les URLs Redis ici car Docker Compose
      # n'échappe pas les caractères spéciaux dans REDIS_PASSWORD
      # Le code Python (celery_app.py) construira automatiquement les URLs
      # avec échappement correct depuis REDIS_PASSWORD
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: "0"
      # Variables requises pour l'initialisation de l'application
      APP_ENCRYPTION_KEY_B64: ${APP_ENCRYPTION_KEY_B64:?APP_ENCRYPTION_KEY_B64 is required}
      # CELERY_BROKER_URL et CELERY_RESULT_BACKEND seront construits par celery_app.py
    ports:
      - "5555:5555"
    networks:
      - atmr-network
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.25"
        reservations:
          memory: 256M
          cpus: "0.1"

  # Redémarre les conteneurs marqués autoheal=true lorsqu'ils restent unhealthy
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: atmr-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 120
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - atmr-network

  # Nginx (reverse proxy) - Optionnel
  # DÉSACTIVÉ : nécessite nginx/nginx.conf sur le serveur
  # Pour activer : décommentez et assurez-vous que nginx/nginx.conf existe
  # nginx:
  #   image: nginx:alpine
  #   container_name: atmr-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #     - nginx_logs:/var/log/nginx
  #   networks:
  #     - atmr-network
  #   depends_on:
  #     - backend
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 128M
  #         cpus: "0.25"

# Volumes persistants
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  backend_data:
    driver: local
  backend_cache:
    driver: local
  backend_uploads:
    driver: local
  celery_beat_data:
    driver: local
  kafka_dlq_data:
    driver: local
  nginx_logs:
    driver: local

# Réseau privé
networks:
  atmr-network:
    external: true
    name: atmr-network # Réseau externe créé manuellement
  # Réseau externe Traefik (doit exister sur le serveur)
  traefik-network:
    external: true
    name: traefik_proxy # Nom du réseau Traefik sur le serveur
  # Réseau externe RL (défini dans docker-compose.rl.yml)
  atmr-rl-network:
    external: true
    name: atmr-rl-network
