# docker-compose.yml
# Configuration Docker Compose optimisée pour la production ATMR

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: atmr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atmr_db}
      POSTGRES_USER: ${POSTGRES_USER:-atmr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atmr_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # ✅ P1: Configuration PostgreSQL pour monitoring des performances
      # Note: Les fichiers de config sont optionnels - si absents, PostgreSQL utilisera les valeurs par défaut
      # Temporairement désactivé pour diagnostiquer le problème de healthcheck
      # - ./backend/config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      # - ./backend/config/postgres/init-postgres-monitoring.sql:/docker-entrypoint-initdb.d/01-monitoring.sql:ro
    # command:
    #   - postgres
    #   - -c
    #   - config_file=/etc/postgresql/postgresql.conf
    # ⚠️ SÉCURITÉ: Port NON exposé publiquement - uniquement accessible via le réseau Docker
    # Si vous devez accéder à PostgreSQL depuis l'extérieur, utilisez un tunnel SSH ou un VPN
    expose:
      - "5432"
    networks:
      - atmr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.5"

  # Redis pour Celery
  redis:
    image: redis:7-alpine
    container_name: atmr-redis
    restart: unless-stopped
    # ✅ SÉCURITÉ: Redis avec authentification et non exposé publiquement
    # Le port n'est PAS exposé publiquement (pas de mapping host:container)
    # Redis est uniquement accessible depuis le réseau Docker interne
    command:
      - sh
      - -c
      - |
        redis-server \
          --requirepass "${REDIS_PASSWORD}" \
          --appendonly yes \
          --maxmemory 256mb \
          --maxmemory-policy allkeys-lru \
          --bind 0.0.0.0 \
          --protected-mode yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    # ⚠️ SÉCURITÉ: Port NON exposé publiquement - uniquement accessible via le réseau Docker
    # Si vous devez accéder à Redis depuis l'extérieur, utilisez un tunnel SSH ou un VPN
    expose:
      - "6379"
    networks:
      - atmr-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "${REDIS_PASSWORD}" ping | grep -q PONG || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"

  # Backend API (Production)
  backend:
    image: ${DOCKER_IMAGE:-docker.io/djasiqi/atmr-backend}:${DOCKER_TAG:-latest}
    container_name: atmr-backend
    restart: unless-stopped
    # Charger les variables depuis .env.production (créé par le workflow GitHub Actions)
    env_file:
      - .env.production
    # Variables d'environnement chargées depuis GitHub Secrets via workflow
    environment:
      # Configuration Flask
      FLASK_ENV: production
      FLASK_CONFIG: production # ⚠️ IMPORTANT: Nécessaire pour charger ProductionConfig
      FLASK_APP: app.py

      # Base de données (variables individuelles pour échappement URL automatique)
      POSTGRES_USER: ${POSTGRES_USER:-atmr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atmr_password}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-atmr_db}
      # ⚠️ IMPORTANT: DATABASE_URL doit être construit avec échappement du mot de passe
      # Pour générer l'URL correctement échappée, utilisez:
      # python3 -c "from urllib.parse import quote_plus; print(f'postgresql+psycopg2://{user}:{quote_plus(password)}@{host}:{port}/{db}')"
      # Ou utilisez le script: python scripts/generate_database_url.py USER PASSWORD HOST PORT DB
      # Si DATABASE_URL n'est pas défini, Flask config.py construira automatiquement l'URL
      # via _build_database_url_safe() qui utilise urllib.parse.quote_plus()
      DATABASE_URL: ${DATABASE_URL:-}
      SQLALCHEMY_DATABASE_URI: ${SQLALCHEMY_DATABASE_URI:-${DATABASE_URL:-}}

      # Redis/Celery avec authentification
      # ⚠️ IMPORTANT: REDIS_URL est chargée depuis .env.production (créé par le workflow GitHub Actions)
      # avec le mot de passe correctement échappé
      # Le code Python (celery_app.py) peut aussi construire les URLs depuis REDIS_PASSWORD si nécessaire
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: "0"
      # ✅ Forcer explicitement CELERY_BROKER_URL et CELERY_RESULT_BACKEND pour éviter AMQP par défaut
      # Utiliser REDIS_URL si disponible, sinon laisser vide pour que celery_app.py construise depuis REDIS_PASSWORD
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-${REDIS_URL}}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-${REDIS_URL}}
      CELERY_TIMEZONE: ${CELERY_TIMEZONE:-Europe/Zurich}

      # Optimisations PyTorch
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 2
      NUMEXPR_NUM_THREADS: 2

      # Sécurité
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-jwt-secret-key-change-in-production}
      APP_ENCRYPTION_KEY_B64: ${APP_ENCRYPTION_KEY_B64}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # API Configuration
      API_LEGACY_ENABLED: "false" # Désactiver API legacy pour éviter conflit endpoint specs
      API_DOCS: "off" # Désactiver Swagger UI en production

      # ML Models
      ML_MODELS_PATH: /app/data/ml
      RL_MODELS_PATH: /app/data/rl

      # PDF Base URL (optionnel mais recommandé)
      PDF_BASE_URL: ${PDF_BASE_URL:-}

      # Worker RL Configuration
      # URL du worker RL pour les requêtes d'optimisation Optuna
      RL_WORKER_URL: ${RL_WORKER_URL:-http://atmr-rl-worker:5000}

    volumes:
      - backend_logs:/app/logs
      - backend_data:/app/data
      - backend_cache:/app/cache
      - backend_uploads:/app/uploads # Volume pour les logos de compagnie et autres uploads
      # Les modèles ML/RL sont inclus dans l'image Docker
    ports:
      - "5000:5000"
    networks:
      - atmr-network
      - traefik-network
      - atmr-rl-network # Pour communiquer avec le worker RL
    # Labels Traefik pour le routage automatique
    labels:
      # Activer Traefik pour ce conteneur
      - "traefik.enable=true"
      # Router les requêtes vers le backend sur www.lirie.ch
      # Router HTTP (port 80) - redirige vers HTTPS
      - "traefik.http.routers.backend.rule=Host(`www.lirie.ch`) || Host(`lirie.ch`)"
      - "traefik.http.routers.backend.entrypoints=web"
      # Router HTTPS (port 443) avec certificat SSL automatique
      - "traefik.http.routers.backend-secure.rule=Host(`www.lirie.ch`) || Host(`lirie.ch`)"
      - "traefik.http.routers.backend-secure.entrypoints=websecure"
      - "traefik.http.routers.backend-secure.tls.certresolver=letsencrypt"
      # Redirection HTTP vers HTTPS
      - "traefik.http.middlewares.backend-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.backend-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.backend.middlewares=backend-redirect"
      # Service backend (port interne du conteneur)
      - "traefik.http.services.backend.loadbalancer.server.port=5000"
      # ✅ Sticky sessions pour Socket.IO (cookie-based)
      # Garantit que les connexions Socket.IO restent sur le même worker
      - "traefik.http.services.backend.loadbalancer.sticky.cookie=true"
      - "traefik.http.services.backend.loadbalancer.sticky.cookie.name=ATMR_SOCKET_SESSION"
      - "traefik.http.services.backend.loadbalancer.sticky.cookie.secure=true"
      - "traefik.http.services.backend.loadbalancer.sticky.cookie.httpOnly=true"
      # Headers pour proxy
      - "traefik.http.middlewares.backend-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.backend-secure.middlewares=backend-headers"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 1G
          cpus: "1.0"

  # Worker Celery
  celery-worker:
    image: ${DOCKER_IMAGE:-docker.io/djasiqi/atmr-backend}:${DOCKER_TAG:-latest}
    container_name: atmr-celery-worker
    restart: unless-stopped
    # Charger les variables depuis .env.production (créé par le workflow GitHub Actions)
    env_file:
      - .env.production
    command: celery -A celery_app.celery worker --loglevel=info --concurrency=2
    healthcheck:
      test: ["CMD", "celery", "-A", "celery_app.celery", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      # Même configuration que le backend
      FLASK_ENV: production
      FLASK_CONFIG: production # ⚠️ IMPORTANT: Nécessaire pour charger ProductionConfig
      # Base de données (variables individuelles pour échappement URL automatique)
      POSTGRES_USER: ${POSTGRES_USER:-atmr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atmr_password}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-atmr_db}
      # SQLALCHEMY_DATABASE_URI explicite pour les migrations Flask
      SQLALCHEMY_DATABASE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # DATABASE_URL sera construit par config.py avec échappement URL automatique
      # Redis/Celery avec authentification
      # ⚠️ IMPORTANT: Ne pas construire les URLs Redis ici car Docker Compose
      # n'échappe pas les caractères spéciaux dans REDIS_PASSWORD
      # Le code Python (celery_app.py) construira automatiquement les URLs
      # avec échappement correct depuis REDIS_PASSWORD
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: "0"
      REDIS_URL: ${REDIS_URL:-}
      # ✅ Forcer explicitement CELERY_BROKER_URL et CELERY_RESULT_BACKEND pour éviter AMQP par défaut
      # Utiliser REDIS_URL si disponible, sinon laisser vide pour que celery_app.py construise depuis REDIS_PASSWORD
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-${REDIS_URL}}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-${REDIS_URL}}
      CELERY_TIMEZONE: ${CELERY_TIMEZONE:-Europe/Zurich}

      # Optimisations PyTorch pour le worker
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1

      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ML_MODELS_PATH: /app/data/ml
      RL_MODELS_PATH: /app/data/rl
      APP_ENCRYPTION_KEY_B64: ${APP_ENCRYPTION_KEY_B64}
    volumes:
      - backend_logs:/app/logs
      - backend_data:/app/data
      - backend_cache:/app/cache
      # Les modèles ML/RL sont inclus dans l'image Docker
    networks:
      - atmr-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.5"

  # Beat Celery (planificateur)
  celery-beat:
    image: ${DOCKER_IMAGE:-docker.io/djasiqi/atmr-backend}:${DOCKER_TAG:-latest}
    container_name: atmr-celery-beat
    restart: unless-stopped
    # Charger les variables depuis .env.production (créé par le workflow GitHub Actions)
    env_file:
      - .env.production
    command:
      [
        "celery",
        "-A",
        "celery_app.celery",
        "beat",
        "-l",
        "info",
        "-S",
        "celery.beat.PersistentScheduler",
        "-s",
        "/app/celerybeat/celerybeat-schedule",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /app/celerybeat/celerybeat-schedule && echo 'ok' || exit 1",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      FLASK_ENV: production
      FLASK_CONFIG: production # ⚠️ IMPORTANT: Nécessaire pour charger ProductionConfig
      # Base de données (variables individuelles pour échappement URL automatique)
      POSTGRES_USER: ${POSTGRES_USER:-atmr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atmr_password}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-atmr_db}
      # SQLALCHEMY_DATABASE_URI explicite pour les migrations Flask
      SQLALCHEMY_DATABASE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # DATABASE_URL sera construit par config.py avec échappement URL automatique
      # Redis/Celery avec authentification
      # ⚠️ IMPORTANT: Ne pas construire les URLs Redis ici car Docker Compose
      # n'échappe pas les caractères spéciaux dans REDIS_PASSWORD
      # Le code Python (celery_app.py) construira automatiquement les URLs
      # avec échappement correct depuis REDIS_PASSWORD
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: "0"
      REDIS_URL: ${REDIS_URL:-}
      # ✅ Forcer explicitement CELERY_BROKER_URL et CELERY_RESULT_BACKEND pour éviter AMQP par défaut
      # Utiliser REDIS_URL si disponible, sinon laisser vide pour que celery_app.py construise depuis REDIS_PASSWORD
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-${REDIS_URL}}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-${REDIS_URL}}
      CELERY_TIMEZONE: ${CELERY_TIMEZONE:-Europe/Zurich}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_ENCRYPTION_KEY_B64: ${APP_ENCRYPTION_KEY_B64}
    volumes:
      - backend_logs:/app/logs
      - celery_beat_data:/app/celerybeat
    networks:
      - atmr-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
        reservations:
          memory: 128M
          cpus: "0.1"

  # Flower (monitoring Celery) - Optionnel
  flower:
    image: ${DOCKER_IMAGE:-docker.io/djasiqi/atmr-backend}:${DOCKER_TAG:-latest}
    container_name: atmr-flower
    restart: unless-stopped
    # Charger les variables depuis .env.production (créé par le workflow GitHub Actions)
    env_file:
      - .env.production
    command: celery -A celery_app.celery flower --port=5555
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5555', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      FLASK_ENV: production
      FLASK_CONFIG: production
      # ⚠️ IMPORTANT: Ne pas construire les URLs Redis ici car Docker Compose
      # n'échappe pas les caractères spéciaux dans REDIS_PASSWORD
      # Le code Python (celery_app.py) construira automatiquement les URLs
      # avec échappement correct depuis REDIS_PASSWORD
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: "0"
      # Variables requises pour l'initialisation de l'application
      APP_ENCRYPTION_KEY_B64: ${APP_ENCRYPTION_KEY_B64}
      # CELERY_BROKER_URL et CELERY_RESULT_BACKEND seront construits par celery_app.py
    ports:
      - "5555:5555"
    networks:
      - atmr-network
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  # Nginx (reverse proxy) - Optionnel
  # DÉSACTIVÉ : nécessite nginx/nginx.conf sur le serveur
  # Pour activer : décommentez et assurez-vous que nginx/nginx.conf existe
  # nginx:
  #   image: nginx:alpine
  #   container_name: atmr-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #     - nginx_logs:/var/log/nginx
  #   networks:
  #     - atmr-network
  #   depends_on:
  #     - backend
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 128M
  #         cpus: "0.25"

# Volumes persistants
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  backend_data:
    driver: local
  backend_cache:
    driver: local
  backend_uploads:
    driver: local
  celery_beat_data:
    driver: local
  nginx_logs:
    driver: local

# Réseau privé
networks:
  atmr-network:
    external: true
    name: atmr-network # Réseau externe créé manuellement
  # Réseau externe Traefik (doit exister sur le serveur)
  traefik-network:
    external: true
    name: traefik_proxy # Nom du réseau Traefik sur le serveur
  # Réseau externe RL (défini dans docker-compose.rl.yml)
  atmr-rl-network:
    external: true
    name: atmr-rl-network
