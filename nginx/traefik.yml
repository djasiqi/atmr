# ✅ 3.5: Configuration Traefik pour reverse proxy ATMR (alternative à nginx)

api:
  dashboard: true
  insecure: false  # ✅ 3.5: Désactiver dashboard en production (utiliser authentification)
  debug: false

# ✅ 3.5: Entrypoints (ports d'écoute)
entryPoints:
  web:
    address: ":80"
    # ✅ 3.5: Timeouts
    transport:
      respondingTimeouts:
        readTimeout: 60s
        writeTimeout: 60s
        idleTimeout: 180s

  websecure:
    address: ":443"
    # ✅ WebSocket: Timeouts longs pour Socket.IO (ping_interval=25s, ping_timeout=60s)
    # idleTimeout doit être > ping_timeout * 3 pour éviter fermetures prématurées
    transport:
      respondingTimeouts:
        readTimeout: 180s  # ✅ 3x ping_timeout Socket.IO (60s * 3)
        writeTimeout: 180s  # ✅ 3x ping_timeout Socket.IO
        idleTimeout: 300s  # ✅ 5x ping_timeout pour connexions WebSocket longues
    # ✅ 3.5: HTTPS/TLS (à configurer avec certificats)
    # http:
    #   tls:
    #     certResolver: letsencrypt

# ✅ 3.5: Providers Docker
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: "atmr_default"  # Nom du réseau Docker Compose
    # ✅ 3.5: Watch pour auto-découverte des services
    watch: true

# ✅ 3.5: Logs — garder INFO en prod ; passer à DEBUG seulement pour enquêtes ponctuelles (volume de logs).
log:
  level: INFO

accessLog: {}
  # filePath: "/var/log/traefik/access.log"

# ✅ 3.5: Métriques (Prometheus)
metrics:
  prometheus:
    entryPoint: web
    buckets:
      - 0.1
      - 0.3
      - 1.2
      - 5.0

