# Configuration nginx pour dev local : sert /uploads/ directement (évite ERR_CONNECTION_RESET)
# et proxy le reste vers l'API.
# Utiliser avec : docker compose -f docker-compose.yml -f docker-compose.nginx-dev.yml up

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    upstream backend_api {
        server atmr_api:5000;
        keepalive 32;
    }

    server {
        listen 5000;
        server_name _;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # /uploads/ : servir directement depuis le filesystem (évite Gunicorn+eventlet ERR_CONNECTION_RESET)
        location /uploads/ {
            alias /usr/share/nginx/uploads/;
            add_header Cache-Control "public, max-age=3600";
        }

        # WebSocket Socket.IO
        location /socket.io {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
            proxy_buffering off;
        }

        # Tout le reste vers l'API
        location / {
            proxy_pass http://backend_api;
        }
    }
}
