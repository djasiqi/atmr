# yaml-language-server: disable
name: E2E Demo
on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose.demo.yml"
      - ".github/workflows/e2e-demo.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose.demo.yml"
      - ".github/workflows/e2e-demo.yml"

permissions:
  contents: read

jobs:
  e2e-demo:
    name: Demo Commercial E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEMO_DEFAULT_PASSWORD: ${{ secrets.DEMO_DEFAULT_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Préparer backend/.env minimal pour stack demo
        run: |
          cat > backend/.env <<EOF
          SECRET_KEY=ci-demo-secret-key
          JWT_SECRET_KEY=ci-demo-jwt-secret-key
          COOKIE_SECURE=true
          COOKIE_HTTP_ONLY=true
          COOKIE_SAME_SITE=Strict
          FRONTEND_URL=http://localhost:3000
          MASTER_ENCRYPTION_KEY=ci-demo-master-key
          APP_ENCRYPTION_KEY_B64=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY
          POSTGRES_SSLMODE=disable
          API_LEGACY_ENABLED=false
          DEMO_DEFAULT_PASSWORD=${DEMO_DEFAULT_PASSWORD}
          EOF

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Démarrer la stack demo
        run: |
          docker compose -p atmr_demo_ci -f docker-compose.demo.yml up -d --build \
            postgres-demo redis-demo api-demo celery-worker-demo celery-beat-demo
          docker compose -p atmr_demo_ci -f docker-compose.demo.yml ps

      - name: Attendre la santé des services demo
        run: |
          docker compose -p atmr_demo_ci -f docker-compose.demo.yml up -d --wait \
            postgres-demo redis-demo api-demo celery-worker-demo celery-beat-demo
          docker compose -p atmr_demo_ci -f docker-compose.demo.yml ps

      - name: Migrations demo
        run: |
          docker compose -p atmr_demo_ci -f docker-compose.demo.yml exec -T api-demo \
            python manage.py db upgrade

      - name: Seed demo sales
        run: |
          docker compose -p atmr_demo_ci -f docker-compose.demo.yml exec -T api-demo \
            python manage.py seed demo --reset --profile sales

      - name: Sanity check dataset demo
        run: |
          docker compose -p atmr_demo_ci -f docker-compose.demo.yml exec -T api-demo \
            python scripts/demo_sanity_check.py

      - name: Exécuter Playwright e2e-demo
        working-directory: frontend
        env:
          CI: "true"
          DEMO_PASSWORD: ${{ secrets.DEMO_DEFAULT_PASSWORD }}
        run: npm run e2e:demo

      - name: Dump logs stack demo (si échec)
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose -p atmr_demo_ci -f docker-compose.demo.yml logs --no-color > artifacts/docker-compose-demo.log || true
          docker compose -p atmr_demo_ci -f docker-compose.demo.yml ps > artifacts/docker-compose-demo-ps.log || true

      - name: Upload Playwright artifacts (si échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-demo-playwright-artifacts
          path: |
            frontend/test-results/
            frontend/playwright-report/
            artifacts/
          retention-days: 7

      - name: Stop stack demo
        if: always()
        run: |
          docker compose -p atmr_demo_ci -f docker-compose.demo.yml down -v --remove-orphans
