name: Phase 1 Gates

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:

jobs:
  booking-critical:
    name: booking-critical
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/atmr_test
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: test
      PGPASSWORD: test
      PGDATABASE: atmr_test
      REDIS_URL: redis://localhost:6379/0
      FLASK_CONFIG: testing
      SECRET_KEY: test-secret-key
      JWT_SECRET_KEY: test-jwt-secret
      APP_ENCRYPTION_KEY_B64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY
      API_LEGACY_ENABLED: "false"
      PYTHONPATH: ${{ github.workspace }}
      SOCKETIO_ASYNC_MODE: threading
      SKIP_SOCKETIO: "true"
      SKIP_ROUTES_INIT: "false"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: atmr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d atmr_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements.base.txt
            backend/requirements.prod.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2-dev libffi-dev pkg-config postgresql-client
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            PGPASSWORD=test psql -h localhost -U test -d atmr_test -c 'SELECT 1' >/dev/null 2>&1 && break
            sleep 1
          done
          PGPASSWORD=test psql -h localhost -U test -d atmr_test -c 'SELECT 1'
      - name: Run database migrations
        env:
          FLASK_APP: backend.wsgi
          DISABLE_EVENTLET: "1"
        run: |
          cd backend
          flask db upgrade heads
      - name: AST booking authority
        run: python scripts/architecture/check_booking_create_authority.py
      - name: Booking characterization + HTTP contrat
        working-directory: backend
        run: |
          pytest tests/services/test_booking_create_use_case.py \
            tests/routes/test_client_booking_creation.py -q --tb=short

  mobile-auth-critical:
    name: mobile-auth-critical
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/unified-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/unified-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck:session-lifecycle
      - run: npx jest src/core/auth/sessionStateMachine.pr2.test.ts --no-coverage

  mobile-tracking-critical:
    name: mobile-tracking-critical
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/unified-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/unified-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck:tracking
      - run: npm run test:gps-critical

  deployment-critical:
    name: deployment-critical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck release scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -x scripts/release/build_release_manifest.sh
          shellcheck -x scripts/release/verify_image_digest.sh
      - name: Compose config dry-run
        env:
          DOCKER_IMAGE: docker.io/example/atmr-backend
          DOCKER_TAG: sha-test
          POSTGRES_USER: atmr
          POSTGRES_DB: atmr
        run: |
          set -euo pipefail
          # Placeholders générés à la volée (jamais versionnés) — dry-run interpolation only
          _ph() { openssl rand -hex 24; }
          export POSTGRES_PASSWORD="$(_ph)"
          export REDIS_PASSWORD="$(_ph)"
          export REDIS_URL="redis://:${REDIS_PASSWORD}@redis:6379/0"
          export SECRET_KEY="$(_ph)"
          export JWT_SECRET_KEY="$(_ph)"
          export MASTER_ENCRYPTION_KEY="$(_ph)"
          export INTERNAL_SERVICE_TOKEN="$(_ph)"
          export APP_ENCRYPTION_KEY_B64="$(openssl rand -base64 32 | tr -d '\n')"
          export BACKEND_IMAGE_REF="docker.io/example/atmr-backend@sha256:$(printf '0%.0s' {1..64})"
          export WS_SERVICE_IMAGE_REF="docker.io/example/atmr-ws-service@sha256:$(printf '0%.0s' {1..64})"
          docker compose -f docker-compose.production.yml config >/dev/null
      - name: Gitleaks (surfaces déploiement)
        run: |
          set -euo pipefail
          # Scoper le scan aux artefacts de déploiement (évite 100+ FP lockfiles/docs/tests)
          STAGE="$(mktemp -d)"
          mkdir -p "${STAGE}/.github" "${STAGE}/scripts"
          cp -a .github/workflows "${STAGE}/.github/"
          cp -a .gitleaks.toml "${STAGE}/"
          cp -a docker-compose.production.yml docker-compose.monitoring.yml \
            docker-compose.kafka.yml docker-compose.kafka.atmr-network.yml \
            docker-compose.kafka.p0-hold.yml "${STAGE}/" 2>/dev/null || true
          cp -a scripts/deploy-production.sh scripts/smoke_tests.sh \
            scripts/env.production.defaults.fragment scripts/release \
            "${STAGE}/scripts/" 2>/dev/null || true
          docker run --rm -v "${STAGE}:/repo" zricethezav/gitleaks:v8.21.2 detect \
            --source=/repo --config=/repo/.gitleaks.toml \
            --no-git --no-banner --redact --exit-code 1

  phase1-gates:
    name: phase1-gates
    if: always()
    needs:
      - booking-critical
      - mobile-auth-critical
      - mobile-tracking-critical
      - deployment-critical
    runs-on: ubuntu-latest
    steps:
      - name: Verify all gates
        run: |
          test "${{ needs.booking-critical.result }}" = "success"
          test "${{ needs.mobile-auth-critical.result }}" = "success"
          test "${{ needs.mobile-tracking-critical.result }}" = "success"
          test "${{ needs.deployment-critical.result }}" = "success"
          echo "✅ Phase 1 gates OK"
