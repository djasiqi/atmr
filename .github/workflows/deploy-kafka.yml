# yaml-language-server: disable
# Déploiement Kafka production — manuel uniquement, séparé de Build & Deploy.
# Ne modifie pas .github/workflows/deploy.yml.
# Runbook : docs/ops/kafka-optimization-lirie.md (section CI deploy-kafka)
name: Deploy Kafka (production)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Tapez exactement kafka-on-production pour confirmer"
        required: true
        type: string
        default: ""
      dry_run:
        description: "Si true : copie fichiers + preflight uniquement (pas de redeploy)"
        type: boolean
        required: false
        default: true
      apply_topics_v2_env:
        description: "Ajouter le bloc topics v2 dans /srv/atmr/.env.production.local (idempotent)"
        type: boolean
        required: false
        default: false
      init_topics:
        description: "INIT_TOPICS=1 — créer topics (nécessite apply_topics_v2_env ou vars déjà dans .env.local)"
        type: boolean
        required: false
        default: false
      restart_app_after_topics_v2:
        description: "Après init topics v2 : restart backend + ws-service"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy-kafka:
    name: Kafka production
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_KEY: ${{ secrets.SSH_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate confirmation phrase
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "kafka-on-production" ]; then
            echo "Refus : la valeur confirm doit être exactement kafka-on-production"
            exit 1
          fi
          echo "Confirmation OK"

      - name: Validate SSH secrets
        run: |
          MISSING=()
          [ -z "${{ secrets.SSH_HOST }}" ] && MISSING+=("SSH_HOST")
          [ -z "${{ secrets.SSH_USER }}" ] && MISSING+=("SSH_USER")
          [ -z "${{ secrets.SSH_KEY }}" ] && MISSING+=("SSH_KEY")
          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "Secrets manquants : ${MISSING[*]}"
            exit 1
          fi
          echo "Secrets SSH présents"

      - name: Ensure scripts directories on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            mkdir -p /srv/atmr/scripts/lib

      - name: Copy Kafka compose files
        uses: appleboy/scp-action@master
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          source: "docker-compose.production.yml,docker-compose.kafka.yml,docker-compose.kafka.atmr-network.yml"
          target: "/srv/atmr"

      - name: Copy Kafka scripts
        uses: appleboy/scp-action@master
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          source: "scripts/deploy-kafka-production.sh,scripts/check-kafka-production.sh,scripts/check-kafka-tracking-pipeline.sh,scripts/kafka-init-topics.sh,scripts/kafka-init-topics-compose.sh,scripts/kafka-env-effective.sh,scripts/apply-kafka-topics-v2-local.sh,scripts/kafka-topics.contract.json,scripts/env.production.local.kafka-v2.example"
          target: "/srv/atmr/"

      - name: Copy Kafka lib scripts
        uses: appleboy/scp-action@master
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          source: "scripts/lib/kafka_checks.sh,scripts/lib/kafka_topics_init.sh"
          target: "/srv/atmr/"

      - name: Verify Kafka files on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            set -euo pipefail
            test -f /srv/atmr/docker-compose.kafka.yml
            test -f /srv/atmr/scripts/deploy-kafka-production.sh
            test -f /srv/atmr/scripts/check-kafka-production.sh
            test -f /srv/atmr/scripts/check-kafka-tracking-pipeline.sh
            test -f /srv/atmr/scripts/kafka-init-topics.sh
            test -f /srv/atmr/scripts/kafka-init-topics-compose.sh
            test -f /srv/atmr/scripts/kafka-env-effective.sh
            test -f /srv/atmr/scripts/apply-kafka-topics-v2-local.sh
            test -f /srv/atmr/scripts/kafka-topics.contract.json
            test -f /srv/atmr/scripts/lib/kafka_checks.sh
            test -f /srv/atmr/scripts/lib/kafka_topics_init.sh
            test -f /srv/atmr/scripts/env.production.local.kafka-v2.example
            echo "Tous les fichiers Kafka requis sont présents"

      - name: chmod +x Kafka scripts
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            set -euo pipefail
            cd /srv/atmr
            for s in \
              scripts/deploy-kafka-production.sh \
              scripts/check-kafka-production.sh \
              scripts/check-kafka-tracking-pipeline.sh \
              scripts/kafka-init-topics.sh \
              scripts/kafka-init-topics-compose.sh \
              scripts/kafka-env-effective.sh \
              scripts/apply-kafka-topics-v2-local.sh; do
              chmod +x "${s}"
              sed -i 's/\r$//' "${s}" 2>/dev/null || true
            done

      - name: Apply topics v2 env (optional)
        if: ${{ github.event.inputs.apply_topics_v2_env == 'true' }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            set -euo pipefail
            cd /srv/atmr
            export ATMR_DEPLOY_ROOT=/srv/atmr
            ./scripts/apply-kafka-topics-v2-local.sh

      - name: Dry run (preflight-on only)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            set -euo pipefail
            cd /srv/atmr
            export ATMR_DEPLOY_ROOT=/srv/atmr
            eval "$(./scripts/kafka-env-effective.sh)"
            ./scripts/check-kafka-production.sh preflight-on

      - name: Deploy Kafka + validate (no FORCE)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            set -euo pipefail
            cd /srv/atmr
            export ATMR_DEPLOY_ROOT=/srv/atmr
            eval "$(./scripts/kafka-env-effective.sh)"
            if [ "${{ github.event.inputs.init_topics }}" = "true" ]; then
              test -f /srv/atmr/scripts/lib/kafka_topics_init.sh
              export INIT_TOPICS=1
            fi
            ./scripts/deploy-kafka-production.sh
            ./scripts/check-kafka-production.sh on
            if [ "${{ github.event.inputs.init_topics }}" = "true" ] && [ "${{ github.event.inputs.restart_app_after_topics_v2 }}" = "true" ]; then
              docker compose -f docker-compose.production.yml restart backend ws-service
            fi
            ./scripts/check-kafka-tracking-pipeline.sh || true
