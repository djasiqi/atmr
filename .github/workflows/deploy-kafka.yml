# yaml-language-server: disable
# Déploiement Kafka INFRA production — manuel uniquement, séparé de Build & Deploy.
# Pendant le HOLD GPS : ne recrée pas les consumers (voir deploy-kafka-p0.yml).
# Runbook : docs/ops/kafka-optimization-lirie.md (section CI deploy-kafka)
name: Deploy Kafka (production)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Tapez exactement kafka-on-production pour confirmer"
        required: true
        type: string
        default: ""
      dry_run:
        description: "Si true : SCP artefacts versionnés + preflight-infra uniquement (pas de mutation runtime / config non versionnée)"
        type: boolean
        required: false
        default: true
      apply_topics_v2_env:
        description: "Ajouter le bloc topics v2 dans /srv/atmr/.env.production.local (interdit si dry_run)"
        type: boolean
        required: false
        default: false
      init_topics:
        description: "INIT_TOPICS=1 — créer topics (interdit si dry_run)"
        type: boolean
        required: false
        default: false

concurrency:
  group: atmr-production-deployment
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy-kafka:
    name: Kafka production infra
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_KEY: ${{ secrets.SSH_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate confirmation phrase
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "kafka-on-production" ]; then
            echo "Refus : la valeur confirm doit être exactement kafka-on-production"
            exit 1
          fi
          echo "Confirmation OK"

      - name: Refuse dry_run + mutations
        run: |
          set -euo pipefail
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          APPLY="${{ github.event.inputs.apply_topics_v2_env }}"
          INIT="${{ github.event.inputs.init_topics }}"
          if [ "${DRY_RUN}" = "true" ]; then
            if [ "${APPLY}" = "true" ] || [ "${INIT}" = "true" ]; then
              echo "dry_run=true interdit toute mutation de configuration ou runtime"
              echo "(apply_topics_v2_env / init_topics doivent rester false)"
              exit 1
            fi
            echo "## Deploy Kafka — DRY RUN" >> "${GITHUB_STEP_SUMMARY}"
            echo "Succès = SCP artefacts versionnés + preflight-infra uniquement. Aucune mutation runtime." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Validate SSH secrets
        run: |
          MISSING=()
          [ -z "${{ secrets.SSH_HOST }}" ] && MISSING+=("SSH_HOST")
          [ -z "${{ secrets.SSH_USER }}" ] && MISSING+=("SSH_USER")
          [ -z "${{ secrets.SSH_KEY }}" ] && MISSING+=("SSH_KEY")
          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "Secrets manquants : ${MISSING[*]}"
            exit 1
          fi
          echo "Secrets SSH présents"

      - name: Ensure scripts directories on server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            mkdir -p /srv/atmr/scripts/lib

      - name: Copy Kafka compose files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          source: "docker-compose.production.yml,docker-compose.kafka.yml,docker-compose.kafka.atmr-network.yml"
          target: "/srv/atmr"

      - name: Copy Kafka scripts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          source: "scripts/deploy-kafka-production.sh,scripts/check-kafka-production.sh,scripts/kafka-init-topics.sh,scripts/kafka-init-topics-compose.sh,scripts/kafka-env-effective.sh,scripts/apply-kafka-topics-v2-local.sh,scripts/kafka-topics.contract.json,scripts/env.production.local.kafka-v2.example"
          target: "/srv/atmr/"

      - name: Copy Kafka lib scripts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          source: "scripts/lib/kafka_checks.sh,scripts/lib/kafka_topics_init.sh"
          target: "/srv/atmr/"

      - name: Verify Kafka files on server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            set -euo pipefail
            test -f /srv/atmr/docker-compose.kafka.yml
            test -f /srv/atmr/scripts/deploy-kafka-production.sh
            test -f /srv/atmr/scripts/check-kafka-production.sh
            test -f /srv/atmr/scripts/kafka-init-topics.sh
            test -f /srv/atmr/scripts/kafka-init-topics-compose.sh
            test -f /srv/atmr/scripts/kafka-env-effective.sh
            test -f /srv/atmr/scripts/apply-kafka-topics-v2-local.sh
            test -f /srv/atmr/scripts/kafka-topics.contract.json
            test -f /srv/atmr/scripts/lib/kafka_checks.sh
            test -f /srv/atmr/scripts/lib/kafka_topics_init.sh
            test -f /srv/atmr/scripts/env.production.local.kafka-v2.example
            echo "Tous les fichiers Kafka infra requis sont présents"

      - name: chmod +x Kafka scripts
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            set -euo pipefail
            cd /srv/atmr
            for s in \
              scripts/deploy-kafka-production.sh \
              scripts/check-kafka-production.sh \
              scripts/kafka-init-topics.sh \
              scripts/kafka-init-topics-compose.sh \
              scripts/kafka-env-effective.sh \
              scripts/apply-kafka-topics-v2-local.sh; do
              chmod +x "${s}"
              sed -i 's/\r$//' "${s}" 2>/dev/null || true
            done

      - name: Apply topics v2 env (optional, dry_run=false only)
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.apply_topics_v2_env == 'true' }}
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            set -euo pipefail
            cd /srv/atmr
            export ATMR_DEPLOY_ROOT=/srv/atmr
            ./scripts/apply-kafka-topics-v2-local.sh

      - name: Dry run (preflight-infra only)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            set -euo pipefail
            cd /srv/atmr
            export ATMR_DEPLOY_ROOT=/srv/atmr
            eval "$(./scripts/kafka-env-effective.sh)"
            ./scripts/check-kafka-production.sh preflight-infra

      - name: Deploy Kafka infra + validate
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            set -euo pipefail
            cd /srv/atmr
            export ATMR_DEPLOY_ROOT=/srv/atmr
            eval "$(./scripts/kafka-env-effective.sh)"
            if [ "${{ github.event.inputs.init_topics }}" = "true" ]; then
              test -f /srv/atmr/scripts/lib/kafka_topics_init.sh
              export INIT_TOPICS=1
            fi
            ./scripts/check-kafka-production.sh preflight-infra
            ./scripts/deploy-kafka-production.sh
            ./scripts/check-kafka-production.sh infra
