name: API Validation

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "mobile/**"
      - "scripts/**"
      - "package.json"
  push:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - "scripts/**"
      - "package.json"

jobs:
  validate-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies for native extensions
        run: |
          sudo apt-get update
          # build-essential: compiler/tools; pkg-config: found by meson/pkg-config
          # libcairo2-dev: cairo headers for pycairo; libffi-dev & python3-dev are common build deps
          sudo apt-get install -y build-essential pkg-config libcairo2-dev libffi-dev python3-dev
          # optional: ensure cmake/meson/ninja if you rely on them (pip may install meson/ninja as build deps)
          sudo apt-get install -y cmake ninja-build || true

      - name: Install Python dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Generate OpenAPI spec
        run: |
          cd backend
          python scripts/generate_openapi.py --output docs/openapi.json || echo "{}" > docs/openapi.json
        env:
          FLASK_ENV: testing
          DATABASE_URL: sqlite:///test.db

      - name: Validate OpenAPI format
        run: node scripts/validate-openapi-format.js

      - name: Validate Swagger
        run: node scripts/validate-swagger.js

      - name: Generate API clients
        run: npm run api:generate

      - name: Check API clients (fail if outdated)
        run: npm run api:check
        # ✅ C6: Échoue si les clients générés ne sont pas à jour

      - name: Detect breaking changes
        run: node scripts/detect-breaking-changes.js
        continue-on-error: true

      - name: Generate coverage matrix
        run: node scripts/api-coverage-matrix.js
        continue-on-error: true

      - name: Upload coverage matrix
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage-matrix
          path: docs/API_COVERAGE_MATRIX.md
