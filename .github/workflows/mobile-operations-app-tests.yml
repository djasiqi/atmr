name: Mobile operations-app (Jest)

on:
  pull_request:
    paths:
      - "mobile/operations-app/**"
      - ".github/workflows/mobile-operations-app-tests.yml"
  push:
    branches:
      - main
    paths:
      - "mobile/operations-app/**"
      - ".github/workflows/mobile-operations-app-tests.yml"

permissions:
  contents: read

jobs:
  jest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/operations-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/operations-app/package-lock.json
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test -- --watchAll=false
