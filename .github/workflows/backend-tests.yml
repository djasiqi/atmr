name: Backend Tests

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch: # Déclenchement manuel
  push:
    branches: [main, develop, audit/**]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
      - "scripts/detect_broad_exceptions.py"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
      - "scripts/detect_broad_exceptions.py"

jobs:
  lint:
    name: Lint (Ruff + MyPy + Flake8 + Vulture)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libffi-dev pkg-config

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install "ruff==0.14.10" mypy vulture flake8
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f requirements-otel.txt ]; then
            pip install -r requirements-otel.txt
          fi

      - name: Ruff format check
        id: ruff_format
        continue-on-error: true
        run: |
          cd backend
          # Vérifier que le code est bien formaté (fail si des changements sont nécessaires)
          # Note: On vérifie seulement en CI, le formatage doit être fait localement via pre-commit hooks
          ruff format --check . || {
            echo "❌ Le code n'est pas formaté correctement."
            echo "💡 Exécutez 'ruff format .' localement ou installez les pre-commit hooks."
            exit 1
          }

      - name: Ruff lint
        id: ruff_lint
        continue-on-error: true
        run: |
          cd backend
          ruff check . --output-format=github

      - name: Flake8 check
        id: flake8
        continue-on-error: true
        run: |
          cd backend
          flake8 .

      - name: MyPy type check
        id: mypy
        continue-on-error: true
        run: |
          cd backend
          mypy --install-types --non-interactive --ignore-missing-imports \
            --explicit-package-bases \
            models/ routes/ services/ tasks/ shared/

      - name: Check dead code (vulture)
        id: vulture
        continue-on-error: true
        run: |
          cd backend
          vulture . \
            --min-confidence 80 \
            --sort-by-size \
            --ignore-names error_out,expires_delta,instance \
            --exclude venv,__pycache__,migrations,htmlcov,.pytest_cache,temp_*,instance,uploads,static/qrcodes,scripts/profiling,data/ml,data/rl,tests,test_b2_imports.py,.local,.cursor-server

      - name: Detect broad exceptions
        id: broad_exceptions
        working-directory: .
        run: |
          # Rapport progressif (hors tests/scripts) — ne bloque pas la CI tant que la dette n'est pas soldée
          python scripts/detect_broad_exceptions.py --path backend || true
        continue-on-error: true

      - name: Final lint gate
        if: ${{ always() }}
        run: |
          echo "========================================"
          echo "Résultat des contrôles qualité"
          echo "========================================"
          echo "Ruff format      : ${{ steps.ruff_format.outcome }}"
          echo "Ruff lint        : ${{ steps.ruff_lint.outcome }}"
          echo "Flake8           : ${{ steps.flake8.outcome }}"
          echo "MyPy             : ${{ steps.mypy.outcome }}"
          echo "Vulture          : ${{ steps.vulture.outcome }}"
          echo "Broad exceptions : ${{ steps.broad_exceptions.outcome }}"
          echo "========================================"

          FAILED=0

          [[ "${{ steps.ruff_format.outcome }}" == "success" ]] || FAILED=1
          [[ "${{ steps.ruff_lint.outcome }}" == "success" ]] || FAILED=1
          [[ "${{ steps.flake8.outcome }}" == "success" ]] || FAILED=1
          [[ "${{ steps.mypy.outcome }}" == "success" ]] || FAILED=1
          [[ "${{ steps.vulture.outcome }}" == "success" ]] || FAILED=1

          if [[ "$FAILED" -ne 0 ]]; then
            echo "❌ Un ou plusieurs contrôles qualité bloquants ont échoué."
            exit 1
          fi

          echo "✅ Tous les contrôles qualité bloquants sont passés."

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest

    # ✅ Variables d'environnement au niveau du job pour éviter les connexions "root"
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/atmr_test
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: test
      PGPASSWORD: test
      PGDATABASE: atmr_test
      REDIS_URL: redis://localhost:6379/0
      FLASK_CONFIG: testing
      SECRET_KEY: test-secret-key
      JWT_SECRET_KEY: test-jwt-secret
      APP_ENCRYPTION_KEY_B64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY
      API_LEGACY_ENABLED: "false"
      PYTHONPATH: ${{ github.workspace }}
      SOCKETIO_ASYNC_MODE: threading
      SKIP_SOCKETIO: "true"
      # Les tests (unitaires + intégration) partagent une app Flask session-scoped :
      # les routes doivent être enregistrées pour les tests HTTP (factures, auth, etc.).
      SKIP_ROUTES_INIT: "false"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: atmr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d atmr_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libffi-dev pkg-config redis-tools

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov coverage pytest-timeout
          # Dépendances de test
          pip install factory-boy freezegun
          # Dépendances base de données
          pip install psycopg2-binary flask-migrate
          # Dépendances ML/RL
          pip install torch gymnasium optuna
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi
          if [ -f backend/requirements-dev.txt ]; then
            pip install -r backend/requirements-dev.txt
          fi
          if [ -f backend/requirements-otel.txt ]; then
            pip install -r backend/requirements-otel.txt
          fi

      - name: Wait for PostgreSQL to be ready
        run: |
          echo "⏳ Attente que PostgreSQL soit prêt..."
          for i in $(seq 1 30); do
            PGPASSWORD=test psql -h localhost -U test -d atmr_test -c 'SELECT 1' > /dev/null 2>&1 && break
            echo "  Tentative $i/30..."
            sleep 1
          done
          PGPASSWORD=test psql -h localhost -U test -d atmr_test -c 'SELECT 1' || exit 1
          echo "✅ PostgreSQL est prêt"

      - name: Show Alembic heads (diagnostic)
        env:
          FLASK_APP: backend.wsgi
        run: |
          cd backend
          echo "📋 Liste des heads Alembic:"
          flask db heads || true
          echo ""

      - name: Run database migrations
        env:
          FLASK_APP: backend.wsgi
          # ✅ FIX: DISABLE_EVENTLET=1 est OBLIGATOIRE pour que les migrations fonctionnent
          # eventlet.monkey_patch() interfère avec les transactions Alembic/psycopg
          DISABLE_EVENTLET: "1"
        shell: bash
        run: |
          cd backend
          set -o errexit -o nounset -o pipefail -x
          echo "🔄 Exécution des migrations de base de données (DISABLE_EVENTLET=1)..."
          echo "📋 Alembic heads before upgrade:"
          flask db heads || true
          # Run the upgrade (use 'heads' to handle multiple heads until merge migration is created)
          if ! flask db upgrade heads 2>&1 | tee /tmp/alembic_upgrade.log; then
            echo "❌ Erreur lors de l'exécution des migrations"
            echo "💡 Vérifiez que DISABLE_EVENTLET=1 est défini"
            echo "---- Diagnostics (upgrade failed) - Log d'erreur ----"
            sed -n '1,200p' /tmp/alembic_upgrade.log || true
            echo "---- Diagnostics (upgrade failed) - État actuel ----"
            flask db current || true
            flask db heads || true
            flask db history | sed -n '1,200p' || true
            echo "Listing migrations/versions:"
            ls -la migrations/versions || true
            echo "---- Contenu des fichiers de migration ----"
            shopt -s nullglob
            for f in migrations/versions/*.py; do
              [ -e "$f" ] || continue
              echo "---- $f ----"
              sed -n '1,200p' "$f"
            done
            exit 1
          fi
          echo "✅ Migrations exécutées avec succès"

      - name: Run pytest with coverage
        timeout-minutes: 30
        run: |
          # Lancer pytest depuis la racine pour que les imports 'backend' fonctionnent
          # Politique de mesure : backend/.coveragerc uniquement (--cov-config)
          pytest backend/tests -v \
            --cov=backend \
            --cov-config=backend/.coveragerc \
            --cov-report=xml:backend/coverage.xml \
            --cov-report=html:backend/htmlcov \
            --cov-report=term-missing \
            --timeout=120 \
            --timeout-method=thread

      # Plancher anti-régression.
      # Objectif global: 70% (voir politique de couverture).
      # Ne pas abaisser ce baseline sans mise à jour explicite de la politique.
      - name: Check global coverage >= baseline (50%)
        run: |
          cd backend
          echo "📊 Vérification couverture globale >= baseline 50%..."
          python scripts/check_coverage.py \
            --coverage-xml coverage.xml \
            --fail-under 50.0 \
            --json coverage_report.json
          echo "✅ Couverture globale >= baseline 50%"

      # Rapport dispatch / modules critiques. Non bloquant :
      # le plancher CI reste le step « baseline 50% ». Ne PAS relancer pytest
      # ici (2e session après 5k+ tests → hang / sortie bufferisée ~1h).
      - name: Report critical module coverage
        timeout-minutes: 3
        continue-on-error: true
        run: |
          echo "📋 Rapport couverture modules critiques (non bloquant)..."
          cd backend
          # Rapport seul sur le XML déjà produit par « Run pytest with coverage ».
          python scripts/check_coverage.py \
            --coverage-xml coverage.xml \
            --quiet \
            --json coverage_report.json

          python -c "
          import json
          with open('coverage_report.json') as f:
              report = json.load(f)
          critical_low = report.get('critical_low_coverage') or {}
          if critical_low:
              print('⚠️ Modules critiques sous leur seuil (rapport):')
              for path, stats in list(critical_low.items())[:15]:
                  req = stats.get('required_threshold', 80)
                  print(f'  {path}: {stats[\"percentage\"]:.2f}% (requis {req:.0f}%)')
          else:
              print('✅ Tous les modules critiques mesurés respectent leur seuil')
          missing = report.get('critical_missing_from_xml') or []
          if missing:
              print('ℹ️ Critiques absents du XML (omis / hors mesure):')
              for path in missing[:10]:
                  print(f'  {path}')
          "

          echo "✅ Rapport modules critiques terminé"
          echo "ℹ️ Promotion bloquante: check_coverage.py --require-critical (voir docs/backend/coverage-policy.md)"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: |
            backend/htmlcov/
            backend/coverage.xml
            backend/coverage_report.json
          retention-days: 7

  integration-invoices:
    name: Integration (factures S2 / exclusions)
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
      (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'develop')) ||
      github.event_name == 'workflow_dispatch'

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/atmr_test
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: test
      PGPASSWORD: test
      PGDATABASE: atmr_test
      REDIS_URL: redis://localhost:6379/0
      FLASK_CONFIG: testing
      SECRET_KEY: test-secret-key
      JWT_SECRET_KEY: test-jwt-secret
      APP_ENCRYPTION_KEY_B64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY
      API_LEGACY_ENABLED: "false"
      PYTHONPATH: ${{ github.workspace }}
      SOCKETIO_ASYNC_MODE: threading
      SKIP_SOCKETIO: "true"
      SKIP_ROUTES_INIT: "false"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: atmr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d atmr_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libffi-dev pkg-config postgresql-client redis-tools

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-timeout
          pip install factory-boy freezegun psycopg2-binary flask-migrate
          pip install sentry-sdk
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi
          if [ -f backend/requirements-dev.txt ]; then
            pip install -r backend/requirements-dev.txt
          fi
          if [ -f backend/requirements-otel.txt ]; then
            pip install -r backend/requirements-otel.txt
          fi

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            PGPASSWORD=test psql -h localhost -U test -d atmr_test -c 'SELECT 1' > /dev/null 2>&1 && break
            sleep 1
