name: Mobile client-app quality

on:
  pull_request:
    paths:
      - "mobile/client-app/**"
      - ".github/workflows/mobile-client-app.yml"
  push:
    branches:
      - main
    paths:
      - "mobile/client-app/**"
      - ".github/workflows/mobile-client-app.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/client-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/client-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Expo doctor (warning only)
        run: npx expo-doctor || true
