name: Architecture Review

permissions:
  contents: read

# AST booking + contrats architecture : systématiques (pas de path-filter).
# Coût faible ; empêche de contourner l'autorité de création client.
on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  architecture-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Architecture contract tests (booking create authority)
        run: python scripts/architecture/check_booking_create_authority.py
      - name: Architecture contract tests (tracking)
        run: python scripts/architecture/check_tracking_contract.py
      - name: Backend contract tests
        working-directory: backend
        run: |
          pip install pytest -q
          pytest tests/architecture/ tests/contracts/ tests/integration/test_tracking_pipeline_e2e.py tests/services/test_stale_fix_watchdog.py tests/services/test_booking_create_use_case.py -q --tb=short
