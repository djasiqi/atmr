name: Architecture Review

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "mobile/unified-app/src/features/driver/**"
      - "backend/services/tracking/**"
      - "backend/services/geolocation/**"
      - "backend/routes/internal_tracking.py"
      - "frontend/src/utils/mergeDriverLiveUpdate.js"
      - "backend/application/bookings/**"
      - "backend/bookings/application/use_cases/**"
      - "backend/bookings/infrastructure/adapters/booking_service_adapter.py"
      - "backend/infrastructure/persistence/bookings/**"
      - "backend/routes/bookings.py"
      - "backend/routes/clients.py"
      - "backend/routes/companies.py"
      - "backend/routes_api.py"
      - "backend/tests/services/test_booking_create_use_case.py"
      - "backend/tests/architecture/**"
      - "scripts/architecture/**"
      - ".github/workflows/architecture-review.yml"

jobs:
  architecture-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Architecture contract tests (tracking)
        run: python scripts/architecture/check_tracking_contract.py
      - name: Architecture contract tests (booking create authority)
        run: python scripts/architecture/check_booking_create_authority.py
      - name: Backend contract tests
        working-directory: backend
        run: |
          pip install pytest -q
          pytest tests/architecture/ tests/contracts/ tests/integration/test_tracking_pipeline_e2e.py tests/services/test_stale_fix_watchdog.py -q --tb=short
