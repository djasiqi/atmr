name: Secret Pattern Scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  google-api-key-pattern:
    name: Block Google API keys in tracked files
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fail on committed Google API keys
        run: |
          set -euo pipefail
          echo "Scanning commit $(git rev-parse --short HEAD) for Google API key patterns…"
          # Texte uniquement : exclure binaires (APK/AAB) et artefacts temporaires.
          matches="$(git grep -nE 'AIzaSy[A-Za-z0-9_-]{33}' -- . \
            ':!tmp-preview-apk/**' \
            ':!*.apk' ':!*.apks' ':!*.aab' \
            || true)"
          if [ -n "$matches" ]; then
            echo "::error::Google API key-looking values must not be committed. Use EAS Environment Variables or platform secret stores."
            echo "$matches"
            exit 1
          fi
          echo "No committed Google API key patterns found."
