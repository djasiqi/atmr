# Workflow pour construire et déployer l'image Docker RL/ML
#
# ⚠️ IMPORTANT: Cette image est lourde (torch, gymnasium, optuna) et ne doit PAS
# être construite sur les runners GitHub standards (risque de "No space left on device").
#
# ⚠️ PROBLÈMES CONNUS:
# - Erreur 400 Bad Request lors du push: Docker Hub peut avoir des problèmes avec de très grandes images (~2GB)
# - Solutions:
#   1. Utiliser un registry alternatif (GitHub Container Registry, AWS ECR, etc.)
#   2. Build local puis push manuel: docker build -f Dockerfile.rl -t djasiqi/atmr-backend:rl-latest . && docker push djasiqi/atmr-backend:rl-latest
#   3. Utiliser un self-hosted runner avec plus de ressources
#   4. Diviser l'image en plusieurs layers plus petits
#
# Ce workflow combine la construction et le déploiement de l'image RL en un seul processus.
#
# Options de déploiement:
# 1. Self-hosted runner (recommandé) : sur votre serveur 8vCPU/16GB
# 2. Déclenchement manuel uniquement (workflow_dispatch)
# 3. Build local puis push manuel vers Docker Hub

name: Build & Deploy RL Environment

on:
    workflow_dispatch: # Déclenchement manuel uniquement
        inputs:
            tag:
                description: "Tag de l'image (ex: rl-latest, rl-v1.0.0)"
                required: false
                default: "rl-latest"
            push:
                description: "Push vers Docker Hub (recommandé: true pour déploiement)"
                type: boolean
                required: false
                default: true
            deploy:
                description: "Déployer l'image après construction (recommandé: true)"
                type: boolean
                required: false
                default: true

permissions:
    contents: read

jobs:
    build-rl-image:
        name: Build & Push RL Image
        # ⚠️ Utiliser un self-hosted runner si disponible (plus de ressources)
        # Sinon, ubuntu-latest mais risque de "No space left on device"
        # Pour utiliser self-hosted, modifiez cette ligne en: runs-on: self-hosted
        runs-on: ubuntu-latest

        env:
            DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE || 'djasiqi/atmr-backend' }}
            DOCKER_TAG: ${{ github.event.inputs.tag || 'rl-latest' }}
            DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
            DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

        outputs:
            image_tag: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
            image_pushed: ${{ steps.push_flag.outputs.push }}
            push_success: ${{ steps.verify_push.outputs.success }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3
              continue-on-error: true

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Clean up disk space
              run: |
                  echo "🧹 Nettoyage de l'espace disque avant le build RL..."
                  docker system prune -af --volumes || true
                  rm -rf ~/.cache/pip || true
                  df -h

            - name: Set push flag
              id: push_flag
              run: |
                  # Convertir l'input push en booléen cohérent
                  # Si push n'est pas défini ou est 'true' ou true, alors push=true
                  PUSH_INPUT="${{ github.event.inputs.push }}"
                  if [ -z "${PUSH_INPUT}" ] || [ "${PUSH_INPUT}" = "true" ] || [ "${PUSH_INPUT}" = "True" ]; then
                      echo "push=true" >> $GITHUB_OUTPUT
                      echo "✅ Push activé (push=${PUSH_INPUT})"
                  else
                      echo "push=false" >> $GITHUB_OUTPUT
                      echo "ℹ️  Push désactivé (push=${PUSH_INPUT})"
                  fi

            - name: Login to Docker Hub
              if: steps.push_flag.outputs.push == 'true'
              uses: docker/login-action@v3
              with:
                  username: ${{ env.DOCKERHUB_USERNAME }}
                  password: ${{ env.DOCKERHUB_TOKEN }}
                  logout: false

            - name: Verify Docker Hub authentication
              if: steps.push_flag.outputs.push == 'true'
              run: |
                  echo "🔍 Vérification de l'authentification Docker Hub..."
                  if docker info | grep -q "Username"; then
                      echo "✅ Authentification Docker Hub réussie"
                  else
                      echo "❌ Échec de l'authentification Docker Hub"
                      exit 1
                  fi

            - name: Calculate requirements hash
              id: requirements_hash
              run: |
                  # Calculer un hash des fichiers requirements RL pour invalider le cache si nécessaire
                  if [ -f backend/requirements-rl.txt ] && [ -f backend/requirements.base.txt ]; then
                    REQUIREMENTS_HASH=$(sha256sum backend/requirements-rl.txt backend/requirements.base.txt 2>/dev/null | sha256sum | cut -d' ' -f1)
                    echo "requirements_hash=${REQUIREMENTS_HASH}" >> $GITHUB_OUTPUT
                    echo "📋 Hash de requirements-rl.txt + requirements.base.txt: ${REQUIREMENTS_HASH:0:12}..."
                  else
                    echo "⚠️  requirements-rl.txt ou requirements.base.txt non trouvés"
                    echo "requirements_hash=missing" >> $GITHUB_OUTPUT
                  fi

            - name: Build & push RL image
              timeout-minutes: 60
              uses: docker/build-push-action@v5
              with:
                  context: ./backend
                  file: ./backend/Dockerfile.rl
                  target: runtime
                  build-args: |
                      WITH_RL=true
                      RL_ENABLED=true
                      REQUIREMENTS_HASH=${{ steps.requirements_hash.outputs.requirements_hash }}
                  push: ${{ steps.push_flag.outputs.push == 'true' }}
                  load: ${{ steps.push_flag.outputs.push != 'true' }}
                  tags: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  no-cache: false
                  # Options pour gérer les grandes images
                  platforms: linux/amd64
                  # Pull pour s'assurer d'avoir les dernières images de base
                  pull: true

            - name: Verify image was built
              if: steps.push_flag.outputs.push != 'true'
              run: |
                  echo "🔍 Vérification que l'image a bien été construite..."
                  IMAGE_TAG="${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}"
                  if docker images | grep -q "${IMAGE_TAG}"; then
                    echo "✅ Image ${IMAGE_TAG} construite localement"
                    docker images | grep "${IMAGE_TAG}"
                  else
                    echo "⚠️  Image ${IMAGE_TAG} non trouvée localement"
                  fi

            - name: Verify image was pushed
              if: steps.push_flag.outputs.push == 'true'
              id: verify_push
              timeout-minutes: 10
              run: |
                  echo "🔍 Vérification que l'image a bien été poussée..."
                  IMAGE_TAG="${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}"
                  echo "Image attendue: ${IMAGE_TAG}"

                  # Attendre un peu pour que Docker Hub finalise le push
                  echo "⏳ Attente de 10 secondes pour que Docker Hub finalise le push..."
                  sleep 10

                  # Vérifier que l'image existe sur Docker Hub (avec retry et délais plus longs)
                  MAX_RETRIES=10
                  RETRY_DELAY=15
                  for i in $(seq 1 $MAX_RETRIES); do
                    echo "  Tentative $i/$MAX_RETRIES: Vérification de l'image sur Docker Hub..."
                    if docker manifest inspect "${IMAGE_TAG}" > /dev/null 2>&1; then
                      echo "✅ Image ${IMAGE_TAG} trouvée sur Docker Hub"
                      echo "success=true" >> $GITHUB_OUTPUT
                      exit 0
                    fi
                    if [ $i -lt $MAX_RETRIES ]; then
                      echo "  Image non trouvée, attente ${RETRY_DELAY} secondes avant nouvelle tentative..."
                      sleep $RETRY_DELAY
                    fi
                  done

                  echo "❌ Image ${IMAGE_TAG} non trouvée sur Docker Hub après $MAX_RETRIES tentatives"
                  echo "💡 Cela peut être normal si l'image est très grande (~2GB). Vérifiez manuellement sur Docker Hub."
                  echo "💡 Le push peut prendre plusieurs minutes pour finaliser."
                  echo "⚠️  Le déploiement ne s'exécutera PAS car l'image n'est pas disponible sur Docker Hub."
                  echo "success=false" >> $GITHUB_OUTPUT
                  # Ne pas faire échouer le workflow build, mais marquer le push comme échoué
                  exit 0

            - name: Show image size
              run: |
                  IMAGE_TAG="${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}"
                  echo "📦 Taille de l'image RL:"
                  docker images "${IMAGE_TAG}" --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}" || true

    deploy-rl:
        name: Deploy RL Environment
        needs: build-rl-image
        # Déployer SEULEMENT si deploy=true ET que le push a RÉUSSI
        # ⚠️ IMPORTANT: Ne pas déployer si le push a échoué (l'image n'est pas sur Docker Hub)
        if: |
            (github.event.inputs.deploy == 'true' || github.event.inputs.deploy == '') &&
            needs.build-rl-image.outputs.push_success == 'true'
        runs-on: ubuntu-latest
        env:
            DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE || 'djasiqi/atmr-backend' }}
            DOCKER_TAG: ${{ github.event.inputs.tag || 'rl-latest' }}
            SSH_HOST: ${{ secrets.SSH_HOST }}
            SSH_USER: ${{ secrets.SSH_USER }}
            SSH_PORT: ${{ secrets.SSH_PORT }}
            SSH_KEY: ${{ secrets.SSH_KEY }}
            # Secrets pour l'environnement RL (peuvent être différents de la prod)
            RL_POSTGRES_PASSWORD: ${{ secrets.RL_POSTGRES_PASSWORD || secrets.POSTGRES_PASSWORD }}
            RL_POSTGRES_USER: ${{ secrets.RL_POSTGRES_USER || secrets.POSTGRES_USER }}
            RL_POSTGRES_DB: ${{ secrets.RL_POSTGRES_DB || 'atmr_rl_db' }}
            RL_REDIS_PASSWORD: ${{ secrets.RL_REDIS_PASSWORD || secrets.REDIS_PASSWORD }}
            APP_ENCRYPTION_KEY_B64: ${{ secrets.APP_ENCRYPTION_KEY_B64 }}
            SECRET_KEY: ${{ secrets.SECRET_KEY }}
            JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Encode docker-compose.rl.yml to base64
              id: encode_compose
              run: |
                  if [ -f "docker-compose.rl.yml" ]; then
                      COMPOSE_B64=$(base64 -w 0 docker-compose.rl.yml)
                      echo "compose_b64<<EOF" >> $GITHUB_OUTPUT
                      echo "$COMPOSE_B64" >> $GITHUB_OUTPUT
                      echo "EOF" >> $GITHUB_OUTPUT
                      echo "✅ docker-compose.rl.yml encodé en base64"
                  else
                      echo "❌ docker-compose.rl.yml introuvable"
                      exit 1
                  fi

            - name: Validate required secrets
              run: |
                  REQUIRED_SECRETS=(
                      "SSH_HOST"
                      "SSH_USER"
                      "SSH_KEY"
                      "SSH_PORT"
                      "APP_ENCRYPTION_KEY_B64"
                      "SECRET_KEY"
                      "JWT_SECRET_KEY"
                  )
                  MISSING_SECRETS=()
                  for secret in "${REQUIRED_SECRETS[@]}"; do
                      if [ -z "${!secret:-}" ]; then
                          MISSING_SECRETS+=("$secret")
                      fi
                  done
                  if [ ${#MISSING_SECRETS[@]} -ne 0 ]; then
                      echo "❌ Secrets manquants: ${MISSING_SECRETS[*]}"
                      exit 1
                  fi
                  echo "✅ Tous les secrets requis sont présents"

            - name: Verify RL image exists on Docker Hub
              continue-on-error: true
              run: |
                  echo "🔍 Vérification que l'image RL existe sur Docker Hub..."
                  IMAGE_TAG="${{ needs.build-rl-image.outputs.image_tag }}"
                  echo "Image attendue: ${IMAGE_TAG}"

                  # Vérifier que l'image existe sur Docker Hub (avec retry et délais plus longs)
                  MAX_RETRIES=10
                  RETRY_DELAY=15
                  for i in $(seq 1 $MAX_RETRIES); do
                      echo "  Tentative $i/$MAX_RETRIES: Vérification de l'image sur Docker Hub..."
                      if docker manifest inspect "${IMAGE_TAG}" > /dev/null 2>&1; then
                          echo "✅ Image ${IMAGE_TAG} trouvée sur Docker Hub"
                          exit 0
                      fi
                      if [ $i -lt $MAX_RETRIES ]; then
                          echo "  Image non trouvée, attente ${RETRY_DELAY} secondes avant nouvelle tentative..."
                          sleep $RETRY_DELAY
                      fi
                  done

                  echo "⚠️  L'image ${IMAGE_TAG} n'a pas été trouvée sur Docker Hub après $MAX_RETRIES tentatives"
                  echo "💡 Cela peut arriver si le push a échoué (erreur 400)."
                  echo "💡 Le déploiement continuera, mais le pull de l'image échouera probablement."
                  echo "💡 Solutions:"
                  echo "   1. Vérifier manuellement sur Docker Hub si l'image existe"
                  echo "   2. Relancer le workflow avec push=true"
                  echo "   3. Build local puis push manuel"
                  # Ne pas faire échouer, juste avertir
                  exit 0

            - name: Prepare RL deployment directory
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ env.SSH_HOST }}
                  username: ${{ env.SSH_USER }}
                  key: ${{ env.SSH_KEY }}
                  port: ${{ env.SSH_PORT }}
                  script: |
                      # Déterminer le répertoire de déploiement
                      echo "📁 Détermination du répertoire de déploiement RL..."
                      RL_DEPLOY_DIR="/srv/atmr-rl"
                      if [ -d "${RL_DEPLOY_DIR}" ]; then
                          echo "✅ Répertoire ${RL_DEPLOY_DIR} existe déjà"
                      elif [ -w "/srv" ] 2>/dev/null && mkdir -p "${RL_DEPLOY_DIR}" 2>/dev/null; then
                          echo "✅ Répertoire ${RL_DEPLOY_DIR} créé"
                          chmod 755 "${RL_DEPLOY_DIR}"
                      else
                          echo "⚠️  /srv/atmr-rl n'est pas accessible, utilisation du répertoire home"
                          HOME_DIR=$(eval echo ~${{ env.SSH_USER }})
                          RL_DEPLOY_DIR="${HOME_DIR}/atmr-rl"
                          mkdir -p "${RL_DEPLOY_DIR}" 2>/dev/null || {
                              echo "❌ Impossible de créer le répertoire ${RL_DEPLOY_DIR}"
                              exit 1
                          }
                          chmod 755 "${RL_DEPLOY_DIR}"
                          echo "💡 Note: Le déploiement RL utilisera ${RL_DEPLOY_DIR} au lieu de /srv/atmr-rl"
                      fi
                      echo "📁 Répertoire de déploiement: ${RL_DEPLOY_DIR}"
                      echo "${RL_DEPLOY_DIR}" > /tmp/rl_deploy_dir.txt

            - name: Clean up /tmp/docker-compose.rl.yml before copy
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ env.SSH_HOST }}
                  username: ${{ env.SSH_USER }}
                  key: ${{ env.SSH_KEY }}
                  port: ${{ env.SSH_PORT }}
                  script: |
                      # Supprimer le fichier ou répertoire existant dans /tmp
                      if [ -d "/tmp/docker-compose.rl.yml" ]; then
                          echo "🗑️  Suppression du répertoire /tmp/docker-compose.rl.yml"
                          rm -rf /tmp/docker-compose.rl.yml
                      elif [ -f "/tmp/docker-compose.rl.yml" ]; then
                          echo "🗑️  Suppression du fichier /tmp/docker-compose.rl.yml"
                          rm -f /tmp/docker-compose.rl.yml
                      fi
                      echo "✅ /tmp/ nettoyé pour la copie"

            - name: Copy docker-compose.rl.yml to server
              continue-on-error: true
              id: copy_compose
              uses: appleboy/scp-action@master
              with:
                  host: ${{ env.SSH_HOST }}
                  username: ${{ env.SSH_USER }}
                  key: ${{ env.SSH_KEY }}
                  port: ${{ env.SSH_PORT }}
                  source: "docker-compose.rl.yml"
                  target: "/tmp/"
                  overwrite: true # Écraser le fichier s'il existe déjà
                  # Copier vers /tmp/ pour éviter les problèmes de permissions

            - name: Verify docker-compose.rl.yml was copied
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ env.SSH_HOST }}
                  username: ${{ env.SSH_USER }}
                  key: ${{ env.SSH_KEY }}
                  port: ${{ env.SSH_PORT }}
                  script: |
                      # Vérifier si le fichier existe dans /tmp
                      if [ -f "/tmp/docker-compose.rl.yml" ]; then
                          echo "✅ docker-compose.rl.yml trouvé dans /tmp (copié par SCP)"
                          # Afficher le port configuré pour vérification
                          if grep -q "8081:8080" /tmp/docker-compose.rl.yml; then
                              echo "✅ Port 8081 correctement configuré dans docker-compose.rl.yml"
                          else
                              echo "⚠️  Port 8081 non trouvé dans docker-compose.rl.yml"
                          fi
                      else
                          echo "⚠️  docker-compose.rl.yml non trouvé dans /tmp"
                          echo "💡 Le fichier sera copié depuis base64 dans le script de déploiement"
                      fi

            - name: Deploy RL environment via SSH
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ env.SSH_HOST }}
                  username: ${{ env.SSH_USER }}
                  key: ${{ env.SSH_KEY }}
                  port: ${{ env.SSH_PORT }}
                  envs: APP_ENCRYPTION_KEY_B64,SECRET_KEY,JWT_SECRET_KEY,RL_POSTGRES_PASSWORD,RL_POSTGRES_USER,RL_POSTGRES_DB,RL_REDIS_PASSWORD,DOCKER_IMAGE,DOCKER_TAG
                  script: |
                      # Récupérer le répertoire de déploiement depuis l'étape précédente
                      if [ -f "/tmp/rl_deploy_dir.txt" ]; then
                          RL_DEPLOY_DIR=$(cat /tmp/rl_deploy_dir.txt)
                      else
                          # Fallback: déterminer le répertoire
                          RL_DEPLOY_DIR="/srv/atmr-rl"
                          if [ ! -d "${RL_DEPLOY_DIR}" ] && [ ! -w "/srv" ] 2>/dev/null; then
                              HOME_DIR=$(eval echo ~${{ env.SSH_USER }})
                              RL_DEPLOY_DIR="${HOME_DIR}/atmr-rl"
                          fi
                      fi

                      echo "📁 Utilisation du répertoire: ${RL_DEPLOY_DIR}"
                      cd "${RL_DEPLOY_DIR}" || {
                          echo "❌ Impossible d'accéder au répertoire ${RL_DEPLOY_DIR}"
                          exit 1
                      }

                      # Copier docker-compose.rl.yml depuis /tmp si disponible, sinon depuis base64
                      # Toujours remplacer pour s'assurer d'avoir la dernière version
                      if [ -f "/tmp/docker-compose.rl.yml" ]; then
                          cp -f /tmp/docker-compose.rl.yml docker-compose.rl.yml
                          echo "✅ docker-compose.rl.yml copié depuis /tmp (remplacé)"
                          # Vérifier que le port 8081 est bien configuré
                          if grep -q "8081:8080" docker-compose.rl.yml; then
                              echo "✅ Port 8081 correctement configuré"
                          else
                              echo "⚠️  Port 8081 non trouvé, vérification du fichier..."
                              grep -n "808" docker-compose.rl.yml || true
                          fi
                      else
                          echo "⚠️  docker-compose.rl.yml non trouvé dans /tmp, copie depuis base64..."
                          # Décoder le fichier depuis base64
                          COMPOSE_B64="${{ steps.encode_compose.outputs.compose_b64 }}"
                          if [ -n "${COMPOSE_B64}" ]; then
                              echo "${COMPOSE_B64}" | base64 -d > docker-compose.rl.yml
                              echo "✅ docker-compose.rl.yml créé depuis base64"
                          else
                              if [ -f "docker-compose.rl.yml" ]; then
                                  echo "⚠️  Utilisation du fichier existant (base64 non disponible)"
                              else
                                  echo "❌ Impossible de copier docker-compose.rl.yml"
                                  echo "💡 Vérifiez que l'étape 'Copy docker-compose.rl.yml to server' a réussi"
                                  exit 1
                              fi
                          fi
                      fi

                      set -o errexit -o nounset -o pipefail

                      # Fonction de rollback en cas d'erreur
                      rollback() {
                          echo "🔄 Rollback en cours..."
                          docker compose -f docker-compose.rl.yml down --remove-orphans || true
                          echo "❌ Déploiement RL échoué, rollback effectué"
                          exit 1
                      }
                      trap rollback ERR

                      # Export des variables d'environnement
                      export APP_ENCRYPTION_KEY_B64="${{ secrets.APP_ENCRYPTION_KEY_B64 }}"
                      export SECRET_KEY="${{ secrets.SECRET_KEY }}"
                      export JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}"
                      export RL_POSTGRES_PASSWORD="${{ env.RL_POSTGRES_PASSWORD }}"
                      export RL_POSTGRES_USER="${{ env.RL_POSTGRES_USER }}"
                      export RL_POSTGRES_DB="${{ env.RL_POSTGRES_DB }}"
                      export RL_REDIS_PASSWORD="${{ env.RL_REDIS_PASSWORD }}"
                      export DOCKER_IMAGE="${{ env.DOCKER_IMAGE }}"
                      export DOCKER_TAG="${{ env.DOCKER_TAG }}"

                      # Validation des secrets critiques
                      echo "🔍 Validation des secrets critiques..."
                      MISSING_SECRETS=()
                      if [ -z "${APP_ENCRYPTION_KEY_B64:-}" ]; then MISSING_SECRETS+=("APP_ENCRYPTION_KEY_B64"); fi
                      if [ -z "${SECRET_KEY:-}" ]; then MISSING_SECRETS+=("SECRET_KEY"); fi
                      if [ -z "${JWT_SECRET_KEY:-}" ]; then MISSING_SECRETS+=("JWT_SECRET_KEY"); fi
                      if [ -z "${RL_POSTGRES_PASSWORD:-}" ]; then MISSING_SECRETS+=("RL_POSTGRES_PASSWORD"); fi
                      if [ -z "${RL_POSTGRES_USER:-}" ]; then MISSING_SECRETS+=("RL_POSTGRES_USER"); fi
                      if [ -z "${RL_POSTGRES_DB:-}" ]; then MISSING_SECRETS+=("RL_POSTGRES_DB"); fi
                      if [ -z "${DOCKER_IMAGE:-}" ]; then MISSING_SECRETS+=("DOCKER_IMAGE"); fi
                      if [ -z "${DOCKER_TAG:-}" ]; then MISSING_SECRETS+=("DOCKER_TAG"); fi

                      if [ ${#MISSING_SECRETS[@]} -ne 0 ]; then
                          echo "❌ Secrets manquants: ${MISSING_SECRETS[*]}"
                          exit 1
                      fi
                      echo "✅ Tous les secrets critiques sont présents"

                      # Créer le fichier .env.rl pour docker-compose
                      echo "📝 Création du fichier .env.rl..."
                      {
                          echo "RL_POSTGRES_USER=${RL_POSTGRES_USER}"
                          echo "RL_POSTGRES_PASSWORD=${RL_POSTGRES_PASSWORD}"
                          echo "RL_POSTGRES_DB=${RL_POSTGRES_DB}"
                          echo "RL_REDIS_PASSWORD=${RL_REDIS_PASSWORD}"
                          echo "SECRET_KEY=${SECRET_KEY}"
                          echo "JWT_SECRET_KEY=${JWT_SECRET_KEY}"
                          echo "APP_ENCRYPTION_KEY_B64=${APP_ENCRYPTION_KEY_B64}"
                          echo "DOCKER_IMAGE=${DOCKER_IMAGE}"
                          echo "DOCKER_TAG=${DOCKER_TAG}"
                      } > .env.rl
                      chmod 600 .env.rl
                      echo "✅ Fichier .env.rl créé"

                      # Créer les répertoires nécessaires pour les données RL
                      echo "📁 Création des répertoires de données RL..."
                      mkdir -p data/rl/shadow_mode data/ml data/rl || true
                      chmod -R 755 data 2>/dev/null || true
                      chown -R 1000:1000 data 2>/dev/null || true
                      echo "✅ Répertoires de données RL créés"

                      # Vérifier la configuration Traefik sur le serveur
                      echo "🌐 Vérification de la configuration Traefik..."
                      TRAEFIK_CONTAINER=$(docker ps --filter "name=traefik" --format "{{.Names}}" 2>/dev/null | head -n1 || echo "")
                      TRAEFIK_NETWORK=""
                      
                      if [ -n "${TRAEFIK_CONTAINER}" ]; then
                          echo "✅ Conteneur Traefik trouvé: ${TRAEFIK_CONTAINER}"
                          # Détecter le réseau utilisé par Traefik
                          TRAEFIK_NETWORK=$(docker inspect "${TRAEFIK_CONTAINER}" --format '{{range $net, $conf := .NetworkSettings.Networks}}{{$net}}{{end}}' 2>/dev/null | head -n1 || echo "")
                          if [ -n "${TRAEFIK_NETWORK}" ]; then
                              echo "✅ Réseau Traefik détecté: ${TRAEFIK_NETWORK}"
                          else
                              echo "⚠️  Impossible de détecter le réseau Traefik"
                          fi
                      else
                          echo "⚠️  Aucun conteneur Traefik trouvé"
                      fi
                      
                      # Vérifier les réseaux possibles pour Traefik
                      POSSIBLE_TRAEFIK_NETWORKS=("traefik_default" "atmr_default" "traefik-network" "traefik")
                      FOUND_TRAEFIK_NETWORK=""
                      
                      for net in "${POSSIBLE_TRAEFIK_NETWORKS[@]}"; do
                          if docker network ls --format '{{.Name}}' | grep -q "^${net}$"; then
                              FOUND_TRAEFIK_NETWORK="${net}"
                              echo "✅ Réseau ${net} existe"
                              break
                          fi
                      done
                      
                      # Utiliser le réseau détecté ou celui trouvé
                      if [ -n "${TRAEFIK_NETWORK}" ]; then
                          FINAL_TRAEFIK_NETWORK="${TRAEFIK_NETWORK}"
                      elif [ -n "${FOUND_TRAEFIK_NETWORK}" ]; then
                          FINAL_TRAEFIK_NETWORK="${FOUND_TRAEFIK_NETWORK}"
                      else
                          FINAL_TRAEFIK_NETWORK=""
                      fi
                      
                      # Mettre à jour docker-compose.rl.yml avec le bon réseau ou le supprimer si Traefik n'est pas installé
                      if [ -n "${FINAL_TRAEFIK_NETWORK}" ]; then
                          echo "✅ Utilisation du réseau Traefik: ${FINAL_TRAEFIK_NETWORK}"
                          # Mettre à jour le nom du réseau dans docker-compose.rl.yml
                          if command -v python3 >/dev/null 2>&1; then
                              FINAL_TRAEFIK_NETWORK="${FINAL_TRAEFIK_NETWORK}" python3 <<'PYEOF'
import os
import re
traefik_network = os.environ.get('FINAL_TRAEFIK_NETWORK', 'traefik_default')
with open('docker-compose.rl.yml', 'r') as f:
    content = f.read()
# Remplacer le nom du réseau Traefik
content = re.sub(r'name: traefik_default', f'name: {traefik_network}', content)
with open('docker-compose.rl.yml', 'w') as f:
    f.write(content)
PYEOF
                              echo "✅ docker-compose.rl.yml mis à jour avec le réseau ${FINAL_TRAEFIK_NETWORK}"
                          else
                              # Fallback avec sed
                              sed -i "s/name: traefik_default/name: ${FINAL_TRAEFIK_NETWORK}/" docker-compose.rl.yml 2>/dev/null || true
                              echo "✅ docker-compose.rl.yml mis à jour avec le réseau ${FINAL_TRAEFIK_NETWORK}"
                          fi
                      else
                          echo "⚠️  Aucun réseau Traefik trouvé"
                          echo "💡 Le service optuna-dashboard utilisera uniquement le réseau atmr-rl-network"
                          echo "💡 Suppression du réseau Traefik de docker-compose.rl.yml..."
                          # Supprimer la référence au réseau Traefik dans docker-compose.rl.yml avec Python
                          if command -v python3 >/dev/null 2>&1; then
                              python3 <<EOF
with open('docker-compose.rl.yml', 'r') as f:
    lines = f.readlines()
# Supprimer la ligne "- traefik-network" des networks
new_lines = []
skip_traefik_network = False
skip_traefik_def = False
for i, line in enumerate(lines):
    if '- traefik-network' in line:
        continue  # Supprimer cette ligne
    if 'traefik-network:' in line and 'external:' not in line:
        skip_traefik_def = True
        continue
    if skip_traefik_def:
        if line.strip().startswith('#') or line.strip() == '':
            continue
        if 'external:' in line or 'name:' in line:
            continue
        if line.strip() and not line.startswith(' '):
            skip_traefik_def = False
    if not skip_traefik_def:
        new_lines.append(line)
with open('docker-compose.rl.yml', 'w') as f:
    f.writelines(new_lines)
EOF
                              echo "✅ Réseau Traefik supprimé de docker-compose.rl.yml"
                          else
                              # Fallback avec sed (moins robuste)
                              sed -i '/- traefik-network/d' docker-compose.rl.yml 2>/dev/null || true
                              sed -i '/traefik-network:/,/name: traefik_default/d' docker-compose.rl.yml 2>/dev/null || true
                              echo "✅ Réseau Traefik supprimé de docker-compose.rl.yml (fallback sed)"
                          fi
                      fi

                      # Ouvrir le port 8081 dans le pare-feu si nécessaire
                      echo "🔥 Configuration du pare-feu pour le port 8081..."
                      if command -v ufw >/dev/null 2>&1; then
                          # Ubuntu/Debian avec ufw
                          if ufw status | grep -q "8081" 2>/dev/null; then
                              echo "✅ Port 8081 déjà ouvert dans ufw"
                          else
                              echo "🔓 Ouverture du port 8081 dans ufw..."
                              ufw allow 8081/tcp 2>/dev/null || echo "⚠️  Impossible d'ouvrir le port 8081 (peut nécessiter sudo)"
                          fi
                      elif command -v firewall-cmd >/dev/null 2>&1; then
                          # CentOS/RHEL avec firewalld
                          if firewall-cmd --list-ports 2>/dev/null | grep -q "8081"; then
                              echo "✅ Port 8081 déjà ouvert dans firewalld"
                          else
                              echo "🔓 Ouverture du port 8081 dans firewalld..."
                              firewall-cmd --permanent --add-port=8081/tcp 2>/dev/null || echo "⚠️  Impossible d'ouvrir le port 8081"
                              firewall-cmd --reload 2>/dev/null || true
                          fi
                      else
                          echo "⚠️  Aucun gestionnaire de pare-feu détecté (ufw/firewalld)"
                          echo "💡 Vérifiez manuellement que le port 8081 est ouvert"
                      fi

                      # Pull de l'image RL depuis Docker Hub
                      echo "🔄 Pull de l'image RL depuis Docker Hub..."
                      IMAGE_TAG="${DOCKER_IMAGE}:${DOCKER_TAG}"
                      if docker pull "${IMAGE_TAG}"; then
                          echo "✅ Image RL pullée avec succès"
                      else
                          echo "❌ Échec du pull de l'image RL ${IMAGE_TAG}"
                          echo "💡 Cela peut arriver si le push a échoué précédemment (erreur 400)."
                          echo "💡 Vérifiez que l'image existe sur Docker Hub:"
                          echo "   docker manifest inspect ${IMAGE_TAG}"
                          echo "💡 Solutions:"
                          echo "   1. Relancer le workflow avec push=true"
                          echo "   2. Build local puis push manuel:"
                          echo "      docker build -f backend/Dockerfile.rl -t ${IMAGE_TAG} backend/"
                          echo "      docker push ${IMAGE_TAG}"
                          exit 1
                      fi

                      # Arrêter les conteneurs existants
                      echo "🔄 Arrêt des conteneurs RL existants..."
                      docker compose -f docker-compose.rl.yml down --remove-orphans || true

                      # Mettre à jour l'image dans docker-compose.rl.yml si nécessaire
                      # (l'image est déjà définie dans le fichier, mais on s'assure qu'elle utilise le bon tag)
                      echo "🔄 Démarrage de l'environnement RL..."
                      docker compose -f docker-compose.rl.yml up -d

                      # Attendre que PostgreSQL RL soit prêt
                      echo "⏳ Attente que PostgreSQL RL soit prêt..."
                      POSTGRES_READY=false
                      for i in $(seq 1 60); do
                          POSTGRES_STATUS=$(docker compose -f docker-compose.rl.yml ps rl-postgres --format json 2>/dev/null | grep -o '"State":"[^"]*"' | cut -d'"' -f4 || echo "unknown")
                          if [ "$POSTGRES_STATUS" = "running" ]; then
                              HEALTH=$(docker inspect --format='{{.State.Health.Status}}' atmr-rl-postgres 2>/dev/null || echo "none")
                              if [ "$HEALTH" = "healthy" ]; then
                                  if docker compose -f docker-compose.rl.yml exec -T rl-postgres pg_isready -U "${RL_POSTGRES_USER}" -d "${RL_POSTGRES_DB}" > /dev/null 2>&1; then
                                      echo "✅ PostgreSQL RL est prêt et healthy"
                                      POSTGRES_READY=true
                                      break
                                  fi
                              fi
                          fi
                          echo "  Tentative $i/60 (État: ${POSTGRES_STATUS:-unknown}, Health: ${HEALTH:-none})..."
                          sleep 2
                      done

                      if [ "$POSTGRES_READY" = "false" ]; then
                          echo "❌ Timeout: PostgreSQL RL n'est pas prêt après 120 secondes"
                          docker compose -f docker-compose.rl.yml logs rl-postgres | tail -50
                          exit 1
                      fi

                      # Désactiver le trap de rollback après succès
                      trap - ERR

                      echo "✅ Déploiement de l'environnement RL terminé avec succès"
                      echo "📊 État des conteneurs RL:"
                      docker compose -f docker-compose.rl.yml ps
