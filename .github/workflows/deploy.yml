# yaml-language-server: disable
name: Build & Deploy

# ⏸️ Workflow suspendu temporairement - focus sur lint
on:
  workflow_dispatch: # Seulement déclenchement manuel autorisé
    inputs:
      tag:
        description: "Tag de l'image (ex: latest, v1.0.0). Laissez vide pour utiliser DOCKER_TAG du secret"
        required: false
        default: ""
      skip_deploy:
        description: "Ne pas déployer sur le serveur (seulement build + push)"
        type: boolean
        required: false
        default: false
  # push:
  #   branches: [main]
  #   paths:
  #     - "backend/**"
  #     - "docker-compose.yml"
  #     - "docker-compose.production.yml"
  #     - "pyrightconfig.json"
  #     - "package.json"
  #     - "package-lock.json"
  #     - "prometheus/**"
  #     - "vault/**"

permissions:
  actions: write
  contents: read
  security-events: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE }}
      # Utiliser l'input tag si fourni, sinon utiliser le secret DOCKER_TAG
      DOCKER_TAG: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || secrets.DOCKER_TAG }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      APP_ENCRYPTION_KEY_B64: ${{ secrets.APP_ENCRYPTION_KEY_B64 }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          REQUIRED_SECRETS=(
            "DOCKER_IMAGE"
            "DOCKER_TAG"
            "SSH_HOST"
            "SSH_USER"
            "SSH_KEY"
            "SSH_PORT"
            "APP_ENCRYPTION_KEY_B64"
            "SECRET_KEY"
            "JWT_SECRET_KEY"
            "POSTGRES_PASSWORD"
            "POSTGRES_USER"
            "POSTGRES_DB"
            "REDIS_PASSWORD"
            "MAIL_PASSWORD"
            "SENTRY_DSN"
            "DOCKERHUB_USERNAME"
            "DOCKERHUB_TOKEN"
          )
          MISSING_SECRETS=()
          for secret in "${REQUIRED_SECRETS[@]}"; do
            if [ -z "${!secret:-}" ]; then
              MISSING_SECRETS+=("$secret")
            fi
          done
          if [ ${#MISSING_SECRETS[@]} -ne 0 ]; then
            echo "❌ Secrets manquants: ${MISSING_SECRETS[*]}"
            exit 1
          fi
          echo "✅ Tous les secrets requis sont présents (${#REQUIRED_SECRETS[@]} secrets validés)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        continue-on-error: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Clean up disk space
        run: |
          echo "🧹 Nettoyage de l'espace disque avant le build..."
          # Nettoyer les images Docker inutilisées
          docker system prune -af --volumes || true
          # Nettoyer les caches pip
          rm -rf ~/.cache/pip || true
          # Afficher l'espace disque disponible
          df -h

      - name: Generate SBOM with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          version: v0.67.2
          scan-type: "fs"
          scan-ref: "./backend"
          format: "cyclonedx"
          output: "sbom-cyclonedx.json"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Calculate requirements hash
        id: requirements_hash
        run: |
          # Calculer un hash des fichiers requirements pour invalider le cache si nécessaire
          # Utiliser requirements.prod.txt (qui inclut requirements.base.txt)
          if [ -f backend/requirements.prod.txt ]; then
            REQUIREMENTS_HASH=$(sha256sum backend/requirements.prod.txt backend/requirements.base.txt 2>/dev/null | sha256sum | cut -d' ' -f1)
            echo "requirements_hash=${REQUIREMENTS_HASH}" >> $GITHUB_OUTPUT
            echo "📋 Hash de requirements.prod.txt + requirements.base.txt: ${REQUIREMENTS_HASH:0:12}..."
          elif [ -f backend/requirements.txt ]; then
            # Fallback pour compatibilité
            REQUIREMENTS_HASH=$(sha256sum backend/requirements.txt | cut -d' ' -f1)
            echo "requirements_hash=${REQUIREMENTS_HASH}" >> $GITHUB_OUTPUT
            echo "📋 Hash de requirements.txt (fallback): ${REQUIREMENTS_HASH:0:12}..."
          else
            echo "⚠️  requirements.prod.txt et requirements.txt non trouvés"
            echo "requirements_hash=missing" >> $GITHUB_OUTPUT
          fi

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.production
          target: runtime
          build-args: |
            WITH_RL=false
            RL_ENABLED=false
            REQUIREMENTS_HASH=${{ steps.requirements_hash.outputs.requirements_hash }}
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Invalider le cache si requirements.txt a changé
          no-cache: false

      - name: Verify image was pushed
        run: |
          echo "🔍 Vérification que l'image a bien été poussée..."
          IMAGE_TAG="${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}"
          echo "Image attendue: ${IMAGE_TAG}"

          # Vérifier que l'image existe sur Docker Hub (avec retry)
          for i in {1..5}; do
            if docker manifest inspect "${IMAGE_TAG}" > /dev/null 2>&1; then
              echo "✅ Image ${IMAGE_TAG} trouvée sur Docker Hub"
              exit 0
            fi
            echo "  Tentative $i/5: Image non trouvée, attente 5 secondes..."
            sleep 5
          done

          echo "❌ L'image ${IMAGE_TAG} n'a pas été trouvée sur Docker Hub après 5 tentatives"
          if [ "${{ github.event.inputs.skip_deploy }}" != "true" ]; then
            echo "⚠️  Le déploiement va échouer car l'image n'existe pas"
            exit 1
          else
            echo "ℹ️  Déploiement ignoré (skip_deploy=true), mais l'image n'a pas été trouvée"
          fi

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          version: v0.67.2
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Upload Trivy results to GitHub Security
        if: false
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Copy compose files to server
        if: github.event.inputs.skip_deploy != 'true'
        uses: appleboy/scp-action@master
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          source: "docker-compose.production.yml"
          target: "/srv/atmr"

      - name: Copy smoke tests script to server
        if: github.event.inputs.skip_deploy != 'true'
        uses: appleboy/scp-action@master
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          source: "scripts/smoke_tests.sh"
          target: "/srv/atmr/scripts/"

      - name: Deploy via SSH
        if: github.event.inputs.skip_deploy != 'true'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          envs: APP_ENCRYPTION_KEY_B64,SECRET_KEY,JWT_SECRET_KEY,POSTGRES_PASSWORD,POSTGRES_USER,POSTGRES_DB,REDIS_PASSWORD,REDIS_URL,MAIL_PASSWORD,SENTRY_DSN,DOCKER_IMAGE,DOCKER_TAG,DATABASE_URL,SQLALCHEMY_DATABASE_URI
          script: |
            cd /srv/atmr
            set -o errexit -o nounset -o pipefail

            # Fonction de rollback en cas d'erreur
            rollback() {
              echo "🔄 Rollback en cours..."
              docker compose -f docker-compose.production.yml down --remove-orphans || true
              echo "❌ Déploiement échoué, rollback effectué"
              exit 1
            }
            trap rollback ERR

            # Export des variables d'environnement depuis les secrets GitHub
            export APP_ENCRYPTION_KEY_B64="${{ secrets.APP_ENCRYPTION_KEY_B64 }}"
            export SECRET_KEY="${{ secrets.SECRET_KEY }}"
            export JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}"
            export POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
            export POSTGRES_USER="${{ secrets.POSTGRES_USER }}"
            export POSTGRES_DB="${{ secrets.POSTGRES_DB }}"
            export REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}"
            export MAIL_PASSWORD="${{ secrets.MAIL_PASSWORD }}"
            export SENTRY_DSN="${{ secrets.SENTRY_DSN }}"
            export DOCKER_IMAGE="${{ secrets.DOCKER_IMAGE }}"
            export DOCKER_TAG="${{ secrets.DOCKER_TAG }}"

            # Validation des secrets critiques après export
            echo "🔍 Validation des secrets critiques..."
            MISSING_SECRETS=()
            if [ -z "${APP_ENCRYPTION_KEY_B64:-}" ]; then MISSING_SECRETS+=("APP_ENCRYPTION_KEY_B64"); fi
            if [ -z "${SECRET_KEY:-}" ]; then MISSING_SECRETS+=("SECRET_KEY"); fi
            if [ -z "${JWT_SECRET_KEY:-}" ]; then MISSING_SECRETS+=("JWT_SECRET_KEY"); fi
            if [ -z "${POSTGRES_PASSWORD:-}" ]; then MISSING_SECRETS+=("POSTGRES_PASSWORD"); fi
            if [ -z "${POSTGRES_USER:-}" ]; then MISSING_SECRETS+=("POSTGRES_USER"); fi
            if [ -z "${POSTGRES_DB:-}" ]; then MISSING_SECRETS+=("POSTGRES_DB"); fi
            if [ -z "${REDIS_PASSWORD:-}" ]; then MISSING_SECRETS+=("REDIS_PASSWORD"); fi
            if [ -z "${DOCKER_IMAGE:-}" ]; then MISSING_SECRETS+=("DOCKER_IMAGE"); fi
            if [ -z "${DOCKER_TAG:-}" ]; then MISSING_SECRETS+=("DOCKER_TAG"); fi

            if [ ${#MISSING_SECRETS[@]} -ne 0 ]; then
              echo "❌ Secrets manquants: ${MISSING_SECRETS[*]}"
              echo "⚠️  Veuillez configurer ces secrets dans GitHub Actions (Settings → Secrets and variables → Actions)"
              exit 1
            fi
            echo "✅ Tous les secrets critiques sont présents"

            # Construire DATABASE_URL et SQLALCHEMY_DATABASE_URI avec échappement URL du mot de passe
            # Le code Flask peut aussi le construire depuis POSTGRES_*, mais on le passe explicitement pour être sûr
            # Échapper le mot de passe pour éviter les problèmes avec les caractères spéciaux (!, @, #, etc.)
            ESCAPED_PASSWORD=$(python3 -c "from urllib.parse import quote_plus; import sys; print(quote_plus(sys.argv[1]))" "${POSTGRES_PASSWORD}")
            export DATABASE_URL="postgresql+psycopg2://${POSTGRES_USER}:${ESCAPED_PASSWORD}@postgres:5432/${POSTGRES_DB}"
            export SQLALCHEMY_DATABASE_URI="${DATABASE_URL}"

            # Construire REDIS_URL avec échappement URL du mot de passe Redis
            # Le code Python (celery_app.py) peut aussi le construire depuis REDIS_PASSWORD, mais on le passe explicitement
            # pour que validate_required_env_vars soit satisfait
            ESCAPED_REDIS_PASSWORD=$(python3 -c "from urllib.parse import quote_plus; import sys; print(quote_plus(sys.argv[1]))" "${REDIS_PASSWORD}")
            export REDIS_URL="redis://:${ESCAPED_REDIS_PASSWORD}@redis:6379/0"

            # Note: MAIL_PASSWORD et SENTRY_DSN sont optionnels mais recommandés
            if [ -z "${MAIL_PASSWORD:-}" ]; then
              echo "⚠️  MAIL_PASSWORD non défini (optionnel mais recommandé)"
            fi
            if [ -z "${SENTRY_DSN:-}" ]; then
              echo "⚠️  SENTRY_DSN non défini (optionnel mais recommandé)"
            fi

            # Fonction pour pull avec retry et timeout
            pull_with_retry() {
              local max_attempts=3
              local attempt=1
              local timeout=600  # 10 minutes
              
              while [ $attempt -le $max_attempts ]; do
                echo "🔄 Pull de l'image Docker (tentative $attempt/$max_attempts)..."
                if timeout $timeout docker compose -f docker-compose.production.yml pull; then
                  echo "✅ Pull réussi"
                  return 0
                else
                  local exit_code=$?
                  if [ $attempt -lt $max_attempts ]; then
                    echo "⚠️  Pull échoué (code: $exit_code), nouvelle tentative dans 10 secondes..."
                    sleep 10
                    attempt=$((attempt + 1))
                  else
                    echo "❌ Pull échoué après $max_attempts tentatives"
                    return $exit_code
                  fi
                fi
              done
            }

            # Vérifier si timeout est disponible, sinon utiliser une alternative
            if command -v timeout >/dev/null 2>&1; then
              pull_with_retry
            else
              echo "🔄 Pull de l'image Docker..."
              docker compose -f docker-compose.production.yml pull || {
                echo "❌ Échec du pull Docker"
                exit 1
              }
            fi
            echo "🔄 Arrêt des conteneurs existants..."
            docker compose -f docker-compose.production.yml down --remove-orphans || true

            # Vérifier que les variables sont disponibles pour docker-compose
            echo "🔍 Vérification des variables pour docker-compose..."
            if [ -z "${POSTGRES_USER:-}" ] || [ -z "${POSTGRES_PASSWORD:-}" ] || [ -z "${POSTGRES_DB:-}" ]; then
              echo "❌ Variables POSTGRES_* manquantes pour docker-compose"
              exit 1
            fi
            echo "✅ Variables POSTGRES_* disponibles pour docker-compose"

            # Créer un fichier .env.production avec DATABASE_URL pour docker-compose
            echo "📝 Création du fichier .env.production avec DATABASE_URL..."
            {
              echo "DATABASE_URL=${DATABASE_URL}"
              echo "SQLALCHEMY_DATABASE_URI=${SQLALCHEMY_DATABASE_URI}"
              echo "POSTGRES_USER=${POSTGRES_USER}"
              echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
              echo "POSTGRES_DB=${POSTGRES_DB}"
              echo "REDIS_PASSWORD=${REDIS_PASSWORD}"
              echo "REDIS_URL=${REDIS_URL}"
              echo "SECRET_KEY=${SECRET_KEY}"
              echo "JWT_SECRET_KEY=${JWT_SECRET_KEY}"
              echo "APP_ENCRYPTION_KEY_B64=${APP_ENCRYPTION_KEY_B64}"
              echo "DOCKER_IMAGE=${DOCKER_IMAGE}"
              echo "DOCKER_TAG=${DOCKER_TAG}"
              echo "MAIL_PASSWORD=${MAIL_PASSWORD:-}"
              echo "SENTRY_DSN=${SENTRY_DSN:-}"
            } > .env.production
            chmod 600 .env.production
            echo "✅ Fichier .env.production créé"

            # ⚠️ IMPORTANT: Docker Compose charge automatiquement .env (pas .env.production)
            # Créer un fichier .env pour que docker-compose puisse charger les variables
            # pour le remplacement ${VAR} dans docker-compose.production.yml
            # Les variables sont déjà exportées dans le shell, mais docker-compose a besoin du fichier .env
            cp .env.production .env
            chmod 600 .env
            echo "✅ Fichier .env créé (nécessaire pour docker-compose pour remplacer \${VAR} dans le YAML)"

            # Créer les répertoires nécessaires pour les données (si volumes locaux)
            echo "📁 Création des répertoires de données..."
            mkdir -p data/rl/shadow_mode data/ml data/rl || true
            chmod -R 755 data 2>/dev/null || true
            # 🔐 S'assurer que le user du container backend a les droits sur les modèles ML
            # Le backend tourne généralement avec UID 1000 dans l'image Docker
            chown -R 1000:1000 data 2>/dev/null || true
            echo "✅ Répertoires de données créés"

            echo "🔄 Démarrage des services..."
            # Docker Compose chargera automatiquement .env pour remplacer ${VAR} dans le YAML
            # Les variables sont aussi exportées dans le shell pour les commandes exec
            docker compose -f docker-compose.production.yml up -d

            echo "⏳ Attente que PostgreSQL soit prêt..."
            echo "📊 Vérification de l'état du conteneur PostgreSQL..."
            POSTGRES_READY=false
            HEALTH="none"
            for i in $(seq 1 60); do
              # Vérifier l'état du conteneur
              POSTGRES_STATUS=$(docker compose -f docker-compose.production.yml ps postgres --format json 2>/dev/null | grep -o '"State":"[^"]*"' | cut -d'"' -f4 || echo "unknown")
              if [ "$POSTGRES_STATUS" = "running" ]; then
                # Vérifier le healthcheck
                HEALTH=$(docker inspect --format='{{.State.Health.Status}}' atmr-postgres 2>/dev/null || echo "none")
                if [ "$HEALTH" = "healthy" ]; then
                  # Vérifier avec pg_isready
                  if docker compose -f docker-compose.production.yml exec -T postgres pg_isready -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" > /dev/null 2>&1; then
                    echo "✅ PostgreSQL est prêt et healthy"
                    POSTGRES_READY=true
                    break
                  fi
                elif [ "$HEALTH" = "unhealthy" ]; then
                  echo "⚠️  PostgreSQL est unhealthy, affichage des logs..."
                  docker compose -f docker-compose.production.yml logs postgres | tail -50
                fi
              elif [ "$POSTGRES_STATUS" = "exited" ] || [ "$POSTGRES_STATUS" = "dead" ]; then
                echo "❌ Le conteneur PostgreSQL a échoué, affichage des logs..."
                docker compose -f docker-compose.production.yml logs postgres | tail -50
                exit 1
              fi
              echo "  Tentative $i/60 (État: ${POSTGRES_STATUS:-unknown}, Health: ${HEALTH:-none})..."
              sleep 2
            done

            # Vérifier si PostgreSQL est prêt après la boucle
            if [ "$POSTGRES_READY" = "false" ]; then
              echo "❌ Timeout: PostgreSQL n'est pas prêt après 120 secondes"
              echo "---- État du conteneur ----"
              docker compose -f docker-compose.production.yml ps postgres
              echo "---- Logs PostgreSQL (dernières 100 lignes) ----"
              docker compose -f docker-compose.production.yml logs postgres | tail -100
              exit 1
            fi
            echo "🔄 Exécution des migrations de base de données..."

            # S'assurer que l'app Flask voit bien DATABASE_URL (utilisé en priorité dans la config)
            export DATABASE_URL="${SQLALCHEMY_DATABASE_URI}"

            # Vérifier l'état des migrations avant upgrade
            echo "📋 État des migrations avant upgrade:"
            docker compose -f docker-compose.production.yml exec -T \
              -e SQLALCHEMY_DATABASE_URI="${SQLALCHEMY_DATABASE_URI}" \
              -e DATABASE_URL="${DATABASE_URL}" \
              -e POSTGRES_USER="${POSTGRES_USER}" \
              -e POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
              -e POSTGRES_DB="${POSTGRES_DB}" \
              -e POSTGRES_HOST="postgres" \
              -e POSTGRES_PORT="5432" \
              -e REDIS_URL="${REDIS_URL}" \
              -e REDIS_PASSWORD="${REDIS_PASSWORD}" \
              -e MAIL_PASSWORD="${MAIL_PASSWORD}" \
              backend flask db current || true
            docker compose -f docker-compose.production.yml exec -T \
              -e SQLALCHEMY_DATABASE_URI="${SQLALCHEMY_DATABASE_URI}" \
              -e DATABASE_URL="${DATABASE_URL}" \
              -e POSTGRES_USER="${POSTGRES_USER}" \
              -e POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
              -e POSTGRES_DB="${POSTGRES_DB}" \
              -e POSTGRES_HOST="postgres" \
              -e POSTGRES_PORT="5432" \
              -e REDIS_URL="${REDIS_URL}" \
              -e REDIS_PASSWORD="${REDIS_PASSWORD}" \
              -e MAIL_PASSWORD="${MAIL_PASSWORD}" \
              backend flask db heads || true

            # Passer toutes les variables nécessaires pour que Flask puisse construire SQLALCHEMY_DATABASE_URI
            # Le code Flask essaie d'abord DATABASE_URL, puis SQLALCHEMY_DATABASE_URI, puis construit depuis POSTGRES_*
            # REDIS_URL est également nécessaire pour validate_required_env_vars en production

            # ✅ CORRECTION: Gérer le cas où une seule branche est appliquée
            # Si plusieurs heads existent (branches divergentes), utiliser 'upgrade heads' pour appliquer toutes les branches
            # Sinon, utiliser 'upgrade' normal pour appliquer jusqu'au head unique
            echo "🔍 Vérification de l'état des migrations..."
            HEADS_OUTPUT=$(docker compose -f docker-compose.production.yml exec -T \
              -e SQLALCHEMY_DATABASE_URI="${SQLALCHEMY_DATABASE_URI}" \
              -e DATABASE_URL="${DATABASE_URL}" \
              -e POSTGRES_USER="${POSTGRES_USER}" \
              -e POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
              -e POSTGRES_DB="${POSTGRES_DB}" \
              -e POSTGRES_HOST="postgres" \
              -e POSTGRES_PORT="5432" \
              -e REDIS_URL="${REDIS_URL}" \
              -e REDIS_PASSWORD="${REDIS_PASSWORD}" \
              -e MAIL_PASSWORD="${MAIL_PASSWORD}" \
              backend flask db heads 2>&1 || echo "")

            # Compter le nombre de heads (lignes qui commencent par un hash de révision)
            HEAD_COUNT=$(echo "$HEADS_OUTPUT" | grep -cE "^[a-f0-9]{12}" || echo "0")

            if [ "$HEAD_COUNT" -gt 1 ]; then
              echo "⚠️  Plusieurs heads détectés ($HEAD_COUNT), application de toutes les branches avec 'upgrade heads'..."
              # Appliquer toutes les branches jusqu'à leurs heads respectifs
              docker compose -f docker-compose.production.yml exec -T \
                -e SQLALCHEMY_DATABASE_URI="${SQLALCHEMY_DATABASE_URI}" \
                -e DATABASE_URL="${DATABASE_URL}" \
                -e POSTGRES_USER="${POSTGRES_USER}" \
                -e POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
                -e POSTGRES_DB="${POSTGRES_DB}" \
                -e POSTGRES_HOST="postgres" \
                -e POSTGRES_PORT="5432" \
                -e REDIS_URL="${REDIS_URL}" \
                -e REDIS_PASSWORD="${REDIS_PASSWORD}" \
                -e MAIL_PASSWORD="${MAIL_PASSWORD}" \
                backend flask db upgrade heads || {
                echo "❌ Erreur lors de l'application des branches avec 'upgrade heads'"
                exit 1
              }
              echo "✅ Toutes les branches appliquées, application du merge..."
            else
              echo "ℹ️  Head unique détecté, application normale des migrations..."
            fi

            # Maintenant appliquer jusqu'au head unique (merge ou head unique)
            echo "🔄 Application des migrations jusqu'au head unique..."
            docker compose -f docker-compose.production.yml exec -T \
              -e SQLALCHEMY_DATABASE_URI="${SQLALCHEMY_DATABASE_URI}" \
              -e DATABASE_URL="${DATABASE_URL}" \
              -e POSTGRES_USER="${POSTGRES_USER}" \
              -e POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
              -e POSTGRES_DB="${POSTGRES_DB}" \
              -e POSTGRES_HOST="postgres" \
              -e POSTGRES_PORT="5432" \
              -e REDIS_URL="${REDIS_URL}" \
              -e REDIS_PASSWORD="${REDIS_PASSWORD}" \
              -e MAIL_PASSWORD="${MAIL_PASSWORD}" \
              backend flask db upgrade || {
              echo "❌ Erreur lors de l'exécution des migrations"
              echo "---- Diagnostics (migration failed) ----"
              echo "Variables d'environnement utilisées:"
              echo "  POSTGRES_USER=${POSTGRES_USER}"
              echo "  POSTGRES_DB=${POSTGRES_DB}"
              echo "  SQLALCHEMY_DATABASE_URI=${SQLALCHEMY_DATABASE_URI}"
              echo "  DATABASE_URL=${DATABASE_URL}"
                docker compose -f docker-compose.production.yml exec -T \
                  -e SQLALCHEMY_DATABASE_URI="${SQLALCHEMY_DATABASE_URI}" \
                  -e DATABASE_URL="${DATABASE_URL}" \
                  -e POSTGRES_USER="${POSTGRES_USER}" \
                  -e POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
                  -e POSTGRES_DB="${POSTGRES_DB}" \
                  -e POSTGRES_HOST="postgres" \
                  -e POSTGRES_PORT="5432" \
                  -e REDIS_URL="${REDIS_URL}" \
                  -e REDIS_PASSWORD="${REDIS_PASSWORD}" \
                  -e MAIL_PASSWORD="${MAIL_PASSWORD}" \
                  backend flask db current || true
                docker compose -f docker-compose.production.yml exec -T \
                  -e SQLALCHEMY_DATABASE_URI="${SQLALCHEMY_DATABASE_URI}" \
                  -e DATABASE_URL="${DATABASE_URL}" \
                  -e POSTGRES_USER="${POSTGRES_USER}" \
                  -e POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
                  -e POSTGRES_DB="${POSTGRES_DB}" \
