# yaml-language-server: disable
name: Build & Deploy

# ⏸️ Workflow suspendu temporairement - focus sur lint
on:
  workflow_dispatch: # Seulement déclenchement manuel autorisé
    inputs:
      tag:
        description: "Tag de l'image (ex: latest, v1.0.0). Laissez vide pour utiliser DOCKER_TAG du secret"
        required: false
        default: ""
      skip_deploy:
        description: "Ne pas déployer sur le serveur (seulement build + push)"
        type: boolean
        required: false
        default: false
  # push:
  #   branches: [main]
  #   paths:
  #     - "backend/**"
  #     - "docker-compose.yml"
  #     - "docker-compose.production.yml"
  #     - "pyrightconfig.json"
  #     - "package.json"
  #     - "package-lock.json"
  #     - "prometheus/**"
  #     - "vault/**"

permissions:
  actions: write
  contents: read
  security-events: write

jobs:
  build-and-push:
    name: Build & Push Production Image
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE }}
      # Utiliser l'input tag si fourni, sinon utiliser le secret DOCKER_TAG
      DOCKER_TAG: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || secrets.DOCKER_TAG }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    outputs:
      push_success: ${{ steps.verify_push.outputs.success }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          echo "🔍 Validation des secrets requis..."
          MISSING_SECRETS=()

          # Vérifier DOCKER_IMAGE
          if [ -z "${{ secrets.DOCKER_IMAGE }}" ]; then
            MISSING_SECRETS+=("DOCKER_IMAGE")
          else
            echo "✅ DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE }}"
          fi

          # Vérifier DOCKER_TAG (peut être remplacé par l'input tag)
          DOCKER_TAG_VALUE="${{ github.event.inputs.tag != '' && github.event.inputs.tag || secrets.DOCKER_TAG }}"
          if [ -z "${DOCKER_TAG_VALUE}" ]; then
            MISSING_SECRETS+=("DOCKER_TAG")
          else
            echo "✅ DOCKER_TAG: ${DOCKER_TAG_VALUE}"
          fi

          # Vérifier DOCKERHUB_USERNAME
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            MISSING_SECRETS+=("DOCKERHUB_USERNAME")
          else
            echo "✅ DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}"
          fi

          # Vérifier DOCKERHUB_TOKEN
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            MISSING_SECRETS+=("DOCKERHUB_TOKEN")
          else
            echo "✅ DOCKERHUB_TOKEN: [masqué]"
          fi

          if [ ${#MISSING_SECRETS[@]} -ne 0 ]; then
            echo ""
            echo "❌ Secrets manquants ou vides: ${MISSING_SECRETS[*]}"
            echo ""
            echo "💡 Pour résoudre ce problème:"
            echo "   1. Allez dans Settings > Secrets and variables > Actions"
            echo "   2. Ajoutez ou vérifiez les secrets suivants:"
            for secret in "${MISSING_SECRETS[@]}"; do
              echo "      - ${secret}"
            done
            echo ""
            echo "   Exemple de valeurs:"
            echo "   - DOCKER_IMAGE: djasiqi/atmr-backend"
            echo "   - DOCKER_TAG: latest"
            echo "   - DOCKERHUB_USERNAME: votre-username"
            echo "   - DOCKERHUB_TOKEN: votre-token-docker-hub"
            exit 1
          fi

          echo ""
          echo "✅ Tous les secrets requis sont présents et non vides"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        continue-on-error: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Clean up disk space
        run: |
          echo "🧹 Nettoyage de l'espace disque avant le build..."
          # Nettoyer les images Docker inutilisées
          docker system prune -af --volumes || true
          # Nettoyer les caches pip
          rm -rf ~/.cache/pip || true
          # Afficher l'espace disque disponible
          df -h

      - name: Generate SBOM with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          version: v0.67.2
          scan-type: "fs"
          scan-ref: "./backend"
          format: "cyclonedx"
          output: "sbom-cyclonedx.json"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Calculate requirements hash
        id: requirements_hash
        run: |
          # Calculer un hash des fichiers requirements pour invalider le cache si nécessaire
          # Utiliser requirements.prod.txt (qui inclut requirements.base.txt)
          if [ -f backend/requirements.prod.txt ]; then
            REQUIREMENTS_HASH=$(sha256sum backend/requirements.prod.txt backend/requirements.base.txt 2>/dev/null | sha256sum | cut -d' ' -f1)
            echo "requirements_hash=${REQUIREMENTS_HASH}" >> $GITHUB_OUTPUT
            echo "📋 Hash de requirements.prod.txt + requirements.base.txt: ${REQUIREMENTS_HASH:0:12}..."
          elif [ -f backend/requirements.txt ]; then
            # Fallback pour compatibilité
            REQUIREMENTS_HASH=$(sha256sum backend/requirements.txt | cut -d' ' -f1)
            echo "requirements_hash=${REQUIREMENTS_HASH}" >> $GITHUB_OUTPUT
            echo "📋 Hash de requirements.txt (fallback): ${REQUIREMENTS_HASH:0:12}..."
          else
            echo "⚠️  requirements.prod.txt et requirements.txt non trouvés"
            echo "requirements_hash=missing" >> $GITHUB_OUTPUT
          fi

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.production
          target: runtime
          build-args: |
            WITH_RL=false
            RL_ENABLED=false
            REQUIREMENTS_HASH=${{ steps.requirements_hash.outputs.requirements_hash }}
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Invalider le cache si requirements.txt a changé
          no-cache: false

      - name: Verify image was pushed
        id: verify_push
        run: |
          echo "🔍 Vérification que l'image a bien été poussée..."
          IMAGE_TAG="${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}"
          echo "Image attendue: ${IMAGE_TAG}"

          # Vérifier que l'image existe sur Docker Hub (avec retry)
          for i in {1..5}; do
            if docker manifest inspect "${IMAGE_TAG}" > /dev/null 2>&1; then
              echo "✅ Image ${IMAGE_TAG} trouvée sur Docker Hub"
              echo "success=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "  Tentative $i/5: Image non trouvée, attente 5 secondes..."
            sleep 5
          done

          echo "❌ L'image ${IMAGE_TAG} n'a pas été trouvée sur Docker Hub après 5 tentatives"
          echo "success=false" >> $GITHUB_OUTPUT
          if [ "${{ github.event.inputs.skip_deploy }}" != "true" ]; then
            echo "⚠️  Le déploiement ne s'exécutera pas car l'image n'existe pas"
            exit 1
          else
            echo "ℹ️  Déploiement ignoré (skip_deploy=true), mais l'image n'a pas été trouvée"
          fi

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          version: v0.67.2
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Upload Trivy results to GitHub Security
        if: false
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  deploy:
    name: Deploy Production Environment
    needs: build-and-push
    # Déployer SEULEMENT si skip_deploy=false ET que le push a RÉUSSI
    # ⚠️ IMPORTANT: Ne pas déployer si le push a échoué (l'image n'est pas sur Docker Hub)
    if: |
      github.event.inputs.skip_deploy != 'true' &&
      needs.build-and-push.outputs.push_success == 'true'
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE }}
      # Utiliser l'input tag si fourni, sinon utiliser le secret DOCKER_TAG
      DOCKER_TAG: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || secrets.DOCKER_TAG }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      APP_ENCRYPTION_KEY_B64: ${{ secrets.APP_ENCRYPTION_KEY_B64 }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      PDF_BASE_URL: ${{ secrets.PDF_BASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          REQUIRED_SECRETS=(
            "SSH_HOST"
            "SSH_USER"
            "SSH_KEY"
            "SSH_PORT"
            "APP_ENCRYPTION_KEY_B64"
            "SECRET_KEY"
            "JWT_SECRET_KEY"
            "POSTGRES_PASSWORD"
            "POSTGRES_USER"
            "POSTGRES_DB"
            "REDIS_PASSWORD"
            "DOCKER_IMAGE"
            "DOCKER_TAG"
          )
          MISSING_SECRETS=()
          for secret in "${REQUIRED_SECRETS[@]}"; do
            if [ -z "${!secret:-}" ]; then
              MISSING_SECRETS+=("$secret")
            fi
          done
          if [ ${#MISSING_SECRETS[@]} -ne 0 ]; then
            echo "❌ Secrets manquants: ${MISSING_SECRETS[*]}"
            exit 1
          fi
          echo "✅ Tous les secrets requis sont présents"

      - name: Verify image exists on Docker Hub
        run: |
          echo "🔍 Vérification que l'image existe sur Docker Hub..."

          # Construire IMAGE_TAG à partir des variables d'environnement
          # (évite le warning GitHub Actions sur les outputs contenant des secrets)
          IMAGE_TAG="${DOCKER_IMAGE}:${DOCKER_TAG}"

          # Valider que DOCKER_IMAGE et DOCKER_TAG ne sont pas vides
          if [ -z "${DOCKER_IMAGE}" ]; then
            echo "❌ Erreur: DOCKER_IMAGE est vide"
            echo "💡 Vérifiez que le secret DOCKER_IMAGE est défini dans GitHub Secrets"
            exit 1
          fi

          if [ -z "${DOCKER_TAG}" ]; then
            echo "❌ Erreur: DOCKER_TAG est vide"
            echo "💡 Vérifiez que le secret DOCKER_TAG est défini dans GitHub Secrets"
            echo "💡 Ou fournissez un tag via l'input 'tag' lors du déclenchement manuel"
            exit 1
          fi

          # Valider que image_tag n'est pas vide ou invalide
          if [ -z "${IMAGE_TAG}" ] || [ "${IMAGE_TAG}" = ":" ]; then
            echo "❌ Erreur: image_tag est vide ou invalide (${IMAGE_TAG})"
            echo "💡 DOCKER_IMAGE: ${DOCKER_IMAGE}"
            echo "💡 DOCKER_TAG: ${DOCKER_TAG}"
            exit 1
          fi

          echo "Image attendue: ${IMAGE_TAG}"

          # Vérifier que l'image existe sur Docker Hub (avec retry)
          for i in {1..5}; do
            if docker manifest inspect "${IMAGE_TAG}" > /dev/null 2>&1; then
              echo "✅ Image ${IMAGE_TAG} trouvée sur Docker Hub"
              exit 0
            fi
            echo "  Tentative $i/5: Image non trouvée, attente 5 secondes..."
            sleep 5
          done

          echo "❌ L'image ${IMAGE_TAG} n'a pas été trouvée sur Docker Hub"
          exit 1

      - name: Copy compose files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          source: "docker-compose.production.yml"
          target: "/srv/atmr"

      - name: Copy smoke tests script to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          source: "scripts/smoke_tests.sh"
          target: "/srv/atmr/scripts/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          envs: APP_ENCRYPTION_KEY_B64,SECRET_KEY,JWT_SECRET_KEY,POSTGRES_PASSWORD,POSTGRES_USER,POSTGRES_DB,REDIS_PASSWORD,REDIS_URL,MAIL_PASSWORD,SENTRY_DSN,PDF_BASE_URL,DOCKER_IMAGE,DOCKER_TAG,DATABASE_URL,SQLALCHEMY_DATABASE_URI
          script: |
            cd /srv/atmr
            set -o errexit -o nounset -o pipefail

            # Fonction helper pour docker compose exec avec toutes les variables d'environnement
            docker_exec() {
              docker compose -f docker-compose.production.yml exec -T \
                -e SQLALCHEMY_DATABASE_URI="${SQLALCHEMY_DATABASE_URI}" \
                -e DATABASE_URL="${DATABASE_URL}" \
                -e POSTGRES_USER="${POSTGRES_USER}" \
                -e POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
                -e POSTGRES_DB="${POSTGRES_DB}" \
                -e POSTGRES_HOST="postgres" \
                -e POSTGRES_PORT="5432" \
                -e REDIS_URL="${REDIS_URL}" \
                -e REDIS_PASSWORD="${REDIS_PASSWORD}" \
                -e MAIL_PASSWORD="${MAIL_PASSWORD}" \
                backend "$@"
            }

            # Fonction de rollback en cas d'erreur
            rollback() {
              echo "🔄 Rollback en cours..."
              docker compose -f docker-compose.production.yml down --remove-orphans || true
              echo "❌ Déploiement échoué, rollback effectué"
              exit 1
            }
            trap rollback ERR

            # Export des variables d'environnement depuis les secrets GitHub
            export APP_ENCRYPTION_KEY_B64="${{ secrets.APP_ENCRYPTION_KEY_B64 }}"
            export SECRET_KEY="${{ secrets.SECRET_KEY }}"
            export JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}"
            export POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
            export POSTGRES_USER="${{ secrets.POSTGRES_USER }}"
            export POSTGRES_DB="${{ secrets.POSTGRES_DB }}"
            export REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}"
            export MAIL_PASSWORD="${{ secrets.MAIL_PASSWORD }}"
            export SENTRY_DSN="${{ secrets.SENTRY_DSN }}"
            export PDF_BASE_URL="${{ secrets.PDF_BASE_URL }}"
            export DOCKER_IMAGE="${DOCKER_IMAGE}"
            export DOCKER_TAG="${DOCKER_TAG}"

            MISSING_SECRETS=()
            [ -z "${APP_ENCRYPTION_KEY_B64:-}" ] && MISSING_SECRETS+=("APP_ENCRYPTION_KEY_B64")
            [ -z "${SECRET_KEY:-}" ] && MISSING_SECRETS+=("SECRET_KEY")
            [ -z "${JWT_SECRET_KEY:-}" ] && MISSING_SECRETS+=("JWT_SECRET_KEY")
            [ -z "${POSTGRES_PASSWORD:-}" ] && MISSING_SECRETS+=("POSTGRES_PASSWORD")
            [ -z "${POSTGRES_USER:-}" ] && MISSING_SECRETS+=("POSTGRES_USER")
            [ -z "${POSTGRES_DB:-}" ] && MISSING_SECRETS+=("POSTGRES_DB")
            [ -z "${REDIS_PASSWORD:-}" ] && MISSING_SECRETS+=("REDIS_PASSWORD")
            [ -z "${DOCKER_IMAGE:-}" ] && MISSING_SECRETS+=("DOCKER_IMAGE")
            [ -z "${DOCKER_TAG:-}" ] && MISSING_SECRETS+=("DOCKER_TAG")
            [ ${#MISSING_SECRETS[@]} -ne 0 ] && { echo "❌ Secrets manquants: ${MISSING_SECRETS[*]}"; exit 1; }

            ESCAPED_PASSWORD=$(python3 -c "from urllib.parse import quote_plus; import sys; print(quote_plus(sys.argv[1]))" "${POSTGRES_PASSWORD}")
            export DATABASE_URL="postgresql+psycopg2://${POSTGRES_USER}:${ESCAPED_PASSWORD}@postgres:5432/${POSTGRES_DB}"
            export SQLALCHEMY_DATABASE_URI="${DATABASE_URL}"
            ESCAPED_REDIS_PASSWORD=$(python3 -c "from urllib.parse import quote_plus; import sys; print(quote_plus(sys.argv[1]))" "${REDIS_PASSWORD}")
            export REDIS_URL="redis://:${ESCAPED_REDIS_PASSWORD}@redis:6379/0"

            pull_with_retry() {
              local max_attempts=3 attempt=1 timeout=600
              while [ $attempt -le $max_attempts ]; do
                echo "🔄 Pull Docker ($attempt/$max_attempts)..."
                if command -v timeout >/dev/null 2>&1 && timeout $timeout docker compose -f docker-compose.production.yml pull || ! command -v timeout >/dev/null 2>&1 && docker compose -f docker-compose.production.yml pull; then
                  echo "✅ Pull réussi"
                  return 0
                elif [ $attempt -lt $max_attempts ]; then
                  sleep 10
                  attempt=$((attempt + 1))
                else
                  echo "❌ Pull échoué"
                  exit 1
                fi
              done
            }
            pull_with_retry
            docker compose -f docker-compose.production.yml down --remove-orphans || true
            [ -z "${POSTGRES_USER:-}" ] || [ -z "${POSTGRES_PASSWORD:-}" ] || [ -z "${POSTGRES_DB:-}" ] && { echo "❌ Variables POSTGRES_* manquantes"; exit 1; }
            {
              echo "DATABASE_URL=${DATABASE_URL}"
              echo "SQLALCHEMY_DATABASE_URI=${SQLALCHEMY_DATABASE_URI}"
              echo "POSTGRES_USER=${POSTGRES_USER}"
              echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
              echo "POSTGRES_DB=${POSTGRES_DB}"
              echo "REDIS_PASSWORD=${REDIS_PASSWORD}"
              echo "REDIS_URL=${REDIS_URL}"
              echo "SECRET_KEY=${SECRET_KEY}"
              echo "JWT_SECRET_KEY=${JWT_SECRET_KEY}"
              echo "APP_ENCRYPTION_KEY_B64=${APP_ENCRYPTION_KEY_B64}"
              echo "DOCKER_IMAGE=${DOCKER_IMAGE}"
              echo "DOCKER_TAG=${DOCKER_TAG}"
              echo "MAIL_PASSWORD=${MAIL_PASSWORD:-}"
              echo "SENTRY_DSN=${SENTRY_DSN:-}"
              echo "PDF_BASE_URL=${PDF_BASE_URL:-}"
            } > .env.production && chmod 600 .env.production
            cp .env.production .env && chmod 600 .env
            mkdir -p data/rl/shadow_mode data/ml data/rl data/ml/models && chmod -R 755 data && chown -R 999:999 data 2>/dev/null || true
            docker compose -f docker-compose.production.yml up -d
            echo "⏳ Attente du démarrage du backend..."
            for i in $(seq 1 30); do
              BACKEND_STATUS=$(docker compose -f docker-compose.production.yml ps backend --format json 2>/dev/null | grep -o '"State":"[^"]*"' | cut -d'"' -f4 || echo "unknown")
              [ "$BACKEND_STATUS" = "running" ] && echo "✅ Backend démarré" && break
              sleep 1
            done
            echo "🔐 Correction des permissions ML (dans le volume Docker)..."
            docker compose -f docker-compose.production.yml exec -T --user root backend bash -c "mkdir -p /app/data /app/data/ml /app/data/ml/models && chmod -R 755 /app/data && chown -R 999:999 /app/data && [ -f /app/data/ml/models/delay_predictor.pkl ] && chmod 644 /app/data/ml/models/delay_predictor.pkl && chown 999:999 /app/data/ml/models/delay_predictor.pkl || true; ls -la /app/data/ml/models/ 2>/dev/null || true" || true
            echo "🔄 Redémarrage du backend pour appliquer les permissions..."
            docker compose -f docker-compose.production.yml restart backend || true
            sleep 5

            POSTGRES_READY=false
            for i in $(seq 1 60); do
              POSTGRES_STATUS=$(docker compose -f docker-compose.production.yml ps postgres --format json 2>/dev/null | grep -o '"State":"[^"]*"' | cut -d'"' -f4 || echo "unknown")
              if [ "$POSTGRES_STATUS" = "running" ]; then
                HEALTH=$(docker inspect --format='{{.State.Health.Status}}' atmr-postgres 2>/dev/null || echo "none")
                if [ "$HEALTH" = "healthy" ] && docker compose -f docker-compose.production.yml exec -T postgres pg_isready -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" > /dev/null 2>&1; then
                  echo "✅ PostgreSQL prêt"
                  POSTGRES_READY=true
                  break
                fi
              elif [ "$POSTGRES_STATUS" = "exited" ] || [ "$POSTGRES_STATUS" = "dead" ]; then
                docker compose -f docker-compose.production.yml logs postgres | tail -50
                exit 1
              fi
              sleep 2
            done
            [ "$POSTGRES_READY" = "false" ] && { docker compose -f docker-compose.production.yml logs postgres | tail -100; exit 1; }
            export DATABASE_URL="${SQLALCHEMY_DATABASE_URI}"
            echo "📋 État des migrations avant upgrade:"
            docker_exec flask db current || true
            docker_exec flask db heads || true
            echo "🔄 Upgrade des migrations vers le head..."
            # Utiliser 'upgrade heads' pour gérer les merge migrations avec plusieurs heads
            UPGRADE_OUTPUT=$(docker_exec flask db upgrade heads 2>&1) || {
              UPGRADE_EXIT_CODE=$?
              echo "$UPGRADE_OUTPUT"
              echo "⚠️  Première tentative échouée (code: $UPGRADE_EXIT_CODE), vérification de l'état..."
              CURRENT_OUTPUT=$(docker_exec flask db current 2>&1 || echo "")
              echo "$CURRENT_OUTPUT"
              # Si erreur "overlaps" et base à 68116559b15d mais pas à 24bbcb82c891, marquer 24bbcb82c891 comme appliquée
              if echo "$UPGRADE_OUTPUT" | grep -q "overlaps" && echo "$CURRENT_OUTPUT" | grep -q "68116559b15d" && ! echo "$CURRENT_OUTPUT" | grep -q "24bbcb82c891"; then
                echo "🔄 Marquage de la révision 24bbcb82c891 comme appliquée (nécessaire pour la merge migration)..."
                docker_exec flask db stamp 24bbcb82c891 || {
                  echo "❌ Échec du marquage de la révision 24bbcb82c891"
                  docker_exec flask db current || true
                  docker_exec flask db heads || true
                  exit 1
                }
                echo "✅ Révision 24bbcb82c891 marquée, nouvelle tentative d'upgrade..."
                docker_exec flask db upgrade heads || {
                  echo "❌ Erreur lors de l'exécution des migrations après stamp"
                  docker_exec flask db current || true
                  docker_exec flask db heads || true
                  docker compose -f docker-compose.production.yml logs backend | tail -100 || true
                  exit 1
                }
              else
                echo "❌ Erreur lors de l'exécution des migrations"
                echo "💡 Si l'erreur est 'overlaps', vérifiez que les deux révisions parentes sont appliquées"
                docker_exec flask db current || true
                docker_exec flask db heads || true
                docker compose -f docker-compose.production.yml logs backend | tail -100 || true
                exit 1
              fi
            }
            echo "✅ Migrations appliquées avec succès"
            docker compose -f docker-compose.production.yml exec -T --user root backend bash -c "mkdir -p /app/data /app/data/ml /app/data/ml/models && chmod -R 755 /app/data && chown -R 999:999 /app/data 2>/dev/null || true; [ -f /app/data/ml/models/delay_predictor.pkl ] && chmod 644 /app/data/ml/models/delay_predictor.pkl && chown 999:999 /app/data/ml/models/delay_predictor.pkl 2>/dev/null || true" || true

            if [ -f "/srv/atmr/scripts/smoke_tests.sh" ]; then
              export BACKEND_URL="http://localhost:5000"
              bash /srv/atmr/scripts/smoke_tests.sh || rollback
            fi
            trap - ERR
            echo "✅ Déploiement terminé"
