# yaml-language-server: disable
name: Build & Deploy

# ⚠️ Workflow automatique DÉSACTIVÉ - Déclenchement manuel uniquement
on:
  workflow_dispatch: # Déclenchement manuel uniquement
    inputs:
      tag:
        description: "Tag de l'image (ex: latest, v1.0.0). Laissez vide pour utiliser DOCKER_TAG du secret"
        required: false
        default: ""
      skip_deploy:
        description: "Ne pas déployer sur le serveur (seulement build + push)"
        type: boolean
        required: false
        default: false
      no_cache:
        description: "Build sans cache (pour corriger flask_limiter.storage, etc.)"
        type: boolean
        required: false
        default: false
  # DÉPLOIEMENT AUTOMATIQUE DÉSACTIVÉ - Décommenter pour réactiver
  # push:
  #   branches: [main]
  #   paths:
  #     - "backend/**"
  #     - "docker-compose.yml"
  #     - "docker-compose.production.yml"
  #     - "docker-compose.monitoring.yml"
  #     - "monitoring/**"
  #     - "pyrightconfig.json"
  #     - "package.json"
  #     - "package-lock.json"
  #     - "vault/**"
  #     - "scripts/deploy-production.sh"
  #     - ".github/workflows/deploy.yml"

permissions:
  actions: write
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-push:
    name: Build & Push Production Image
    runs-on: ubuntu-latest
    env:
      # Opt-in explicite Node 24 pour les actions JS (docker/*, cache GHA) — évite l’avertissement dépréciation Node 20
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE }}
      # TEMPORARY: Force tag v5 with Flask-Limiter 3.x correct API (pass URI directly)
      DOCKER_TAG: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || 'v5' }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    outputs:
      push_success: ${{ steps.verify_push.outputs.success }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate required secrets
        run: |
          echo "🔍 Validation des secrets requis..."
          MISSING_SECRETS=()

          # Vérifier DOCKER_IMAGE
          if [ -z "${{ secrets.DOCKER_IMAGE }}" ]; then
            MISSING_SECRETS+=("DOCKER_IMAGE")
          else
            echo "✅ DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE }}"
          fi

          # Vérifier DOCKER_TAG (peut être remplacé par l'input tag)
          DOCKER_TAG_VALUE="${{ github.event.inputs.tag != '' && github.event.inputs.tag || secrets.DOCKER_TAG }}"
          if [ -z "${DOCKER_TAG_VALUE}" ]; then
            MISSING_SECRETS+=("DOCKER_TAG")
          else
            echo "✅ DOCKER_TAG: ${DOCKER_TAG_VALUE}"
          fi

          # Vérifier DOCKERHUB_USERNAME
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            MISSING_SECRETS+=("DOCKERHUB_USERNAME")
          else
            echo "✅ DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}"
          fi

          # Vérifier DOCKERHUB_TOKEN
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            MISSING_SECRETS+=("DOCKERHUB_TOKEN")
          else
            echo "✅ DOCKERHUB_TOKEN: [masqué]"
          fi

          if [ ${#MISSING_SECRETS[@]} -ne 0 ]; then
            echo ""
            echo "❌ Secrets manquants ou vides: ${MISSING_SECRETS[*]}"
            echo ""
            echo "💡 Pour résoudre ce problème:"
            echo "   1. Allez dans Settings > Secrets and variables > Actions"
            echo "   2. Ajoutez ou vérifiez les secrets suivants:"
            for secret in "${MISSING_SECRETS[@]}"; do
              echo "      - ${secret}"
            done
            echo ""
            echo "   Exemple de valeurs:"
            echo "   - DOCKER_IMAGE: djasiqi/atmr-backend"
            echo "   - DOCKER_TAG: latest"
            echo "   - DOCKERHUB_USERNAME: votre-username"
            echo "   - DOCKERHUB_TOKEN: votre-token-docker-hub"
            exit 1
          fi

          echo ""
          echo "✅ Tous les secrets requis sont présents et non vides"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        continue-on-error: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Clean up disk space
        run: |
          echo "🧹 Nettoyage de l'espace disque avant le build..."
          # Nettoyer les images Docker inutilisées
          docker system prune -af --volumes || true
          # Nettoyer les caches pip
          rm -rf ~/.cache/pip || true
          # Afficher l'espace disque disponible
          df -h

      - name: Generate SBOM with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        continue-on-error: true
        with:
          scan-type: "fs"
          scan-ref: "./backend"
          format: "cyclonedx"
          output: "sbom-cyclonedx.json"
          exit-code: "0"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Calculate requirements hash
        id: requirements_hash
        run: |
          # Calculer un hash des fichiers requirements pour invalider le cache si nécessaire
          # Utiliser requirements.prod.txt (qui inclut requirements.base.txt)
          if [ -f backend/requirements.prod.txt ]; then
            REQUIREMENTS_HASH=$(sha256sum backend/requirements.prod.txt backend/requirements.base.txt 2>/dev/null | sha256sum | cut -d' ' -f1)
            echo "requirements_hash=${REQUIREMENTS_HASH}" >> $GITHUB_OUTPUT
            echo "📋 Hash de requirements.prod.txt + requirements.base.txt: ${REQUIREMENTS_HASH:0:12}..."
          elif [ -f backend/requirements.txt ]; then
            # Fallback pour compatibilité
            REQUIREMENTS_HASH=$(sha256sum backend/requirements.txt | cut -d' ' -f1)
            echo "requirements_hash=${REQUIREMENTS_HASH}" >> $GITHUB_OUTPUT
            echo "📋 Hash de requirements.txt (fallback): ${REQUIREMENTS_HASH:0:12}..."
          else
            echo "⚠️  requirements.prod.txt et requirements.txt non trouvés"
            echo "requirements_hash=missing" >> $GITHUB_OUTPUT
          fi

      - name: Build & push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile.production
          target: runtime
          build-args: |
            WITH_RL=false
            RL_ENABLED=false
            REQUIREMENTS_HASH=${{ steps.requirements_hash.outputs.requirements_hash }}
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: ${{ github.event.inputs.no_cache == 'true' }}

      - name: Derive ws-service Docker image name
        id: ws_service_image
        env:
          DOCKER_IMAGE_REF: ${{ secrets.DOCKER_IMAGE }}
        run: |
          DI="${DOCKER_IMAGE_REF}"
          case "$DI" in
            *atmr-backend) WS="${DI/%atmr-backend/atmr-ws-service}" ;;
            *) WS="docker.io/djasiqi/atmr-ws-service" ;;
          esac
          echo "name=${WS}" >> "$GITHUB_OUTPUT"
          echo "📦 WS_SERVICE_IMAGE dérivé pour push CI"

      - name: Build & push ws-service image
        uses: docker/build-push-action@v7
        with:
          context: ./services/ws-service
          file: ./services/ws-service/Dockerfile
          push: true
          tags: ${{ steps.ws_service_image.outputs.name }}:${{ env.DOCKER_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: ${{ github.event.inputs.no_cache == 'true' }}

      - name: Verify ws-service image was pushed
        run: |
          WS_TAG="${{ steps.ws_service_image.outputs.name }}:${{ env.DOCKER_TAG }}"
          for i in {1..5}; do
            if docker manifest inspect "${WS_TAG}" > /dev/null 2>&1; then
              echo "✅ Image ws-service ${WS_TAG} trouvée sur Docker Hub"
              exit 0
            fi
            echo "  Tentative $i/5: ws-service non visible, attente 5s..."
            sleep 5
          done
          echo "❌ Image ws-service ${WS_TAG} introuvable sur Docker Hub"
          exit 1

      - name: Verify image was pushed
        id: verify_push
        run: |
          echo "🔍 Vérification que l'image a bien été poussée..."
          IMAGE_TAG="${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}"
          echo "Image attendue: ${IMAGE_TAG}"

          # Vérifier que l'image existe sur Docker Hub (avec retry)
          for i in {1..5}; do
            if docker manifest inspect "${IMAGE_TAG}" > /dev/null 2>&1; then
              echo "✅ Image ${IMAGE_TAG} trouvée sur Docker Hub"
              echo "success=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "  Tentative $i/5: Image non trouvée, attente 5 secondes..."
            sleep 5
          done

          echo "❌ L'image ${IMAGE_TAG} n'a pas été trouvée sur Docker Hub après 5 tentatives"
          echo "success=false" >> $GITHUB_OUTPUT
          if [ "${{ github.event.inputs.skip_deploy }}" != "true" ]; then
            echo "⚠️  Le déploiement ne s'exécutera pas car l'image n'existe pas"
            exit 1
          else
            echo "ℹ️  Déploiement ignoré (skip_deploy=true), mais l'image n'a pas été trouvée"
          fi

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        continue-on-error: true  # INTERNAL_ERROR intermittent sur certaines couches Docker
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln  # Désactiver secret scan (évite INTERNAL_ERROR sur extraction couches)

      - name: Upload Trivy results to GitHub Security
        if: false
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  deploy:
    name: Deploy Production Environment
    needs: build-and-push
    # Déployer SEULEMENT si skip_deploy=false ET que le push a RÉUSSI
    # ⚠️ IMPORTANT: Ne pas déployer si le push a échoué (l'image n'est pas sur Docker Hub)
    if: |
      github.event.inputs.skip_deploy != 'true' &&
      needs.build-and-push.outputs.push_success == 'true'
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE }}
      # TEMPORARY: Force tag v5 to match build job
      DOCKER_TAG: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || 'v5' }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      APP_ENCRYPTION_KEY_B64: ${{ secrets.APP_ENCRYPTION_KEY_B64 }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      PDF_BASE_URL: ${{ secrets.PDF_BASE_URL }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      # ✅ D2: Clé d'encryption maître pour chiffrement IBAN et données sensibles
      MASTER_ENCRYPTION_KEY: ${{ secrets.MASTER_ENCRYPTION_KEY }}
      # ✅ Secrets Monitoring (Grafana + Alertmanager)
      GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
      GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
      GRAFANA_ROOT_URL: ${{ secrets.GRAFANA_ROOT_URL }}
      # ✅ OAuth Google - DÉSACTIVÉ pour le moment (utilisateur unique)
      # Pour activer plus tard, décommenter et ajouter les secrets GitHub :
      # GRAFANA_OAUTH_GOOGLE_ENABLED: ${{ secrets.GRAFANA_OAUTH_GOOGLE_ENABLED }}
      # GRAFANA_OAUTH_GOOGLE_CLIENT_ID: ${{ secrets.GRAFANA_OAUTH_GOOGLE_CLIENT_ID }}
      # GRAFANA_OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.GRAFANA_OAUTH_GOOGLE_CLIENT_SECRET }}
      # GRAFANA_OAUTH_GOOGLE_ALLOWED_DOMAINS: ${{ secrets.GRAFANA_OAUTH_GOOGLE_ALLOWED_DOMAINS }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERTMANAGER_FROM_EMAIL: ${{ secrets.ALERTMANAGER_FROM_EMAIL }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      # ✅ S1: CORS - Origines autorisées pour production (requis)
      SOCKETIO_CORS_ORIGINS: ${{ secrets.SOCKETIO_CORS_ORIGINS }}
      # ✅ Email Brevo - Clé API pour envoi d'emails transactionnels
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      # SMS activation (Twilio) — optionnel ; surcharge possible via .env.production.local sur le serveur
      SMS_NOTIFICATIONS_ENABLED: ${{ secrets.SMS_NOTIFICATIONS_ENABLED }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
      # ✅ Configuration environnement
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      FLASK_ENV: ${{ secrets.FLASK_ENV }}
      FLASK_CONFIG: ${{ secrets.FLASK_CONFIG }}
      ENVIRONMENT: ${{ secrets.ENVIRONMENT }}
      # Firebase Cloud Messaging
      FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
      # F-01 : token interne ws-service → backend (ingestion GPS)
      INTERNAL_SERVICE_TOKEN: ${{ secrets.INTERNAL_SERVICE_TOKEN }}
      INTERNAL_SERVICE_TOKEN_NEXT: ${{ secrets.INTERNAL_SERVICE_TOKEN_NEXT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate required secrets
        run: |
          REQUIRED_SECRETS=(
            "SSH_HOST"
            "SSH_USER"
            "SSH_KEY"
            "SSH_PORT"
            "APP_ENCRYPTION_KEY_B64"
            "SECRET_KEY"
            "JWT_SECRET_KEY"
            "POSTGRES_PASSWORD"
            "POSTGRES_USER"
            "POSTGRES_DB"
            "REDIS_PASSWORD"
            "DOCKER_IMAGE"
            "DOCKER_TAG"
            "SOCKETIO_CORS_ORIGINS"
            "BREVO_API_KEY"
            "POSTGRES_HOST"
            "FLASK_ENV"
            "FLASK_CONFIG"
            "ENVIRONMENT"
            "INTERNAL_SERVICE_TOKEN"
          )
          MISSING_SECRETS=()
          for secret in "${REQUIRED_SECRETS[@]}"; do
            if [ -z "${!secret:-}" ]; then
              MISSING_SECRETS+=("$secret")
            fi
          done
          if [ ${#MISSING_SECRETS[@]} -ne 0 ]; then
            echo "❌ Secrets manquants: ${MISSING_SECRETS[*]}"
            exit 1
          fi
          if [ "${#INTERNAL_SERVICE_TOKEN}" -lt 32 ]; then
            echo "❌ INTERNAL_SERVICE_TOKEN trop court (min 32 caractères, F-01)"
            exit 1
          fi
          echo "✅ Tous les secrets requis sont présents"

      - name: Verify image exists on Docker Hub
        run: |
          echo "🔍 Vérification que l'image existe sur Docker Hub..."

          # Construire IMAGE_TAG à partir des variables d'environnement
          # (évite le warning GitHub Actions sur les outputs contenant des secrets)
          IMAGE_TAG="${DOCKER_IMAGE}:${DOCKER_TAG}"

          # Valider que DOCKER_IMAGE et DOCKER_TAG ne sont pas vides
          if [ -z "${DOCKER_IMAGE}" ]; then
            echo "❌ Erreur: DOCKER_IMAGE est vide"
            echo "💡 Vérifiez que le secret DOCKER_IMAGE est défini dans GitHub Secrets"
            exit 1
          fi

          if [ -z "${DOCKER_TAG}" ]; then
            echo "❌ Erreur: DOCKER_TAG est vide"
            echo "💡 Vérifiez que le secret DOCKER_TAG est défini dans GitHub Secrets"
            echo "💡 Ou fournissez un tag via l'input 'tag' lors du déclenchement manuel"
            exit 1
          fi

          # Valider que image_tag n'est pas vide ou invalide
          if [ -z "${IMAGE_TAG}" ] || [ "${IMAGE_TAG}" = ":" ]; then
            echo "❌ Erreur: image_tag est vide ou invalide (${IMAGE_TAG})"
            echo "💡 DOCKER_IMAGE: ${DOCKER_IMAGE}"
            echo "💡 DOCKER_TAG: ${DOCKER_TAG}"
            exit 1
          fi

          echo "Image attendue: ${IMAGE_TAG}"

          # Vérifier que l'image existe sur Docker Hub (avec retry)
          for i in {1..5}; do
            if docker manifest inspect "${IMAGE_TAG}" > /dev/null 2>&1; then
              echo "✅ Image ${IMAGE_TAG} trouvée sur Docker Hub"
              exit 0
            fi
            echo "  Tentative $i/5: Image non trouvée, attente 5 secondes..."
            sleep 5
          done

          echo "❌ L'image ${IMAGE_TAG} n'a pas été trouvée sur Docker Hub"
          exit 1

      - name: Copy compose files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          source: "docker-compose.production.yml,docker-compose.monitoring.yml,docker-compose.kafka.yml,docker-compose.kafka.atmr-network.yml"
          target: "/srv/atmr"

      - name: Copy monitoring directory to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          source: "monitoring/"
          target: "/srv/atmr/"
          strip_components: 0

      - name: Copy deployment scripts to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          source: "scripts/smoke_tests.sh,scripts/deploy-production.sh,scripts/env.production.defaults.fragment,scripts/lib/kafka_checks.sh,scripts/lib/kafka_topics_init.sh,scripts/deploy-kafka-production.sh,scripts/kafka-init-topics.sh,scripts/ops/validate-prod-correction.sh,scripts/ops/apply-redis-sysctl.sh"
          target: "/srv/atmr/"

      - name: Decode Firebase service account locally
        if: env.FIREBASE_SERVICE_ACCOUNT_B64 != ''
        run: |
          set -e
          echo "${FIREBASE_SERVICE_ACCOUNT_B64}" | base64 -d > firebase-service-account.json
          if ! python3 -c "import json; json.load(open('firebase-service-account.json'))"; then
            echo "❌ Firebase service account JSON is invalid after decoding"
            rm -f firebase-service-account.json
            exit 1
          fi
          echo "✅ Firebase service account decoded ($(wc -c < firebase-service-account.json) bytes)"

      - name: Copy Firebase service account to server
        if: env.FIREBASE_SERVICE_ACCOUNT_B64 != ''
        uses: appleboy/scp-action@master
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          source: "firebase-service-account.json"
          target: "/srv/atmr"

      - name: Set Firebase file permissions
        if: env.FIREBASE_SERVICE_ACCOUNT_B64 != ''
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            # Le backend tourne avec un user non-root dans le conteneur:
            # le fichier doit être lisible via bind mount.
            chmod 644 /srv/atmr/firebase-service-account.json
            echo "✅ Firebase service account permissions set"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            chmod +x /srv/atmr/scripts/deploy-production.sh
            chmod +x /srv/atmr/scripts/smoke_tests.sh
            /srv/atmr/scripts/deploy-production.sh \
              "${{ secrets.APP_ENCRYPTION_KEY_B64 }}" \
              "${{ secrets.SECRET_KEY }}" \
              "${{ secrets.JWT_SECRET_KEY }}" \
              "${{ secrets.POSTGRES_PASSWORD }}" \
              "${{ secrets.POSTGRES_USER }}" \
              "${{ secrets.POSTGRES_DB }}" \
              "${{ secrets.REDIS_PASSWORD }}" \
              "${{ secrets.MAIL_PASSWORD }}" \
              "${{ secrets.SENTRY_DSN }}" \
              "${{ secrets.PDF_BASE_URL }}" \
              "${{ secrets.GOOGLE_MAPS_API_KEY }}" \
              "${{ secrets.MASTER_ENCRYPTION_KEY }}" \
              "${{ env.DOCKER_IMAGE }}" \
              "${{ env.DOCKER_TAG }}" \
              "${{ secrets.GRAFANA_ADMIN_USER }}" \
              "${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
              "${{ secrets.GRAFANA_ROOT_URL }}" \
              "${{ secrets.SMTP_HOST }}" \
              "${{ secrets.SMTP_PORT }}" \
              "${{ secrets.SMTP_USERNAME }}" \
              "${{ secrets.SMTP_PASSWORD }}" \
              "${{ secrets.ALERTMANAGER_FROM_EMAIL }}" \
              "${{ secrets.ALERT_EMAIL_TO }}" \
              "${{ secrets.SOCKETIO_CORS_ORIGINS }}" \
              "${{ secrets.BREVO_API_KEY }}" \
              "${{ secrets.POSTGRES_HOST }}" \
              "${{ secrets.FLASK_ENV }}" \
              "${{ secrets.FLASK_CONFIG }}" \
              "${{ secrets.ENVIRONMENT }}" \
              "${{ vars.PLATFORM_API_URL_PROD }}" \
              "${{ vars.PLATFORM_LINK_PROMETHEUS }}" \
              "${{ vars.PLATFORM_LINK_ALERTMANAGER }}" \
              "${{ vars.PLATFORM_API_URL_DEMO }}" \
              "${{ secrets.SAFERPAY_CUSTOMER_ID }}" \
              "${{ secrets.SAFERPAY_TERMINAL_ID }}" \
              "${{ secrets.SAFERPAY_API_USERNAME }}" \
              "${{ secrets.SAFERPAY_API_PASSWORD }}" \
              "${{ secrets.SMS_NOTIFICATIONS_ENABLED }}" \
              "${{ secrets.TWILIO_ACCOUNT_SID }}" \
              "${{ secrets.TWILIO_AUTH_TOKEN }}" \
              "${{ secrets.TWILIO_PHONE_NUMBER }}" \
              "${{ secrets.INTERNAL_SERVICE_TOKEN }}" \
              "${{ secrets.INTERNAL_SERVICE_TOKEN_NEXT }}"
