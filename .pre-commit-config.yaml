# Configuration pre-commit hooks pour ATMR
# Installation: pip install pre-commit && pre-commit install
# Usage: pre-commit run --all-files (pour tester tous les fichiers)

repos:
  # Ruff: Linting et formatage (remplace black, isort, autoflake)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.8
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # Basedpyright: Type checking (utilise pyrightconfig.json à la racine)
  - repo: https://github.com/RobertCraigie/pyright-python-precommit
    rev: v1.1.350
    hooks:
      - id: pyright
        files: ^backend/
        # pyrightconfig.json est automatiquement détecté à la racine

  # Hooks génériques
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        files: ^backend/
      - id: end-of-file-fixer
        files: ^backend/
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]

