# Configuration PostgreSQL pour monitoring des performances
# Ce fichier est monté dans le conteneur PostgreSQL via docker-compose

# ============================================
# LOGGING DES REQUÊTES LENTES
# ============================================

# Activer le logging des requêtes lentes (seuil: 1000ms = 1 seconde)
# Les requêtes prenant plus de 1 seconde seront loggées dans les logs PostgreSQL
log_min_duration_statement = 1000

# Format des logs (optionnel, pour plus de détails)
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on

# ============================================
# EXTENSION pg_stat_statements
# ============================================

# Note: L'extension pg_stat_statements doit être activée via SQL
# Voir backend/config/postgres/init-postgres-monitoring.sql

# ============================================
# OPTIMISATIONS PERFORMANCE
# ============================================

# Augmenter shared_buffers pour meilleures performances (25% de RAM recommandé)
# Pour conteneur avec 1GB RAM: ~256MB
shared_buffers = 256MB

# Configuration effective_cache_size (50-75% de RAM totale)
effective_cache_size = 768MB

# Configuration work_mem pour requêtes complexes
work_mem = 16MB

# Maintenance_work_mem pour opérations de maintenance
maintenance_work_mem = 128MB

# ============================================
# CONFIGURATION GÉNÉRALE
# ============================================


# ✅ RÉSEAU : Écouter sur toutes les interfaces pour accepter les connexions Docker
# Par défaut, PostgreSQL écoute uniquement sur localhost, ce qui empêche
# les autres conteneurs Docker de se connecter. Cette configuration permet
# les connexions depuis le réseau Docker (172.18.0.0/16).
listen_addresses = '*'

# Timezone
timezone = 'Europe/Zurich'

# Locale
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'

# Encoding
default_text_search_config = 'pg_catalog.english'

