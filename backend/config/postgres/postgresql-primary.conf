# postgresql-primary.conf
# Paramètres PostgreSQL 15 pour le nœud primary Phase 4.
#
# Ce fichier surcharge postgresql.conf pour activer la réplication streaming.
# Monter ce fichier en lecture seule dans le conteneur primary :
#   - ./backend/config/postgres/postgresql-primary.conf:/etc/postgresql/postgresql.conf:ro
#
# IMPORTANT: Modifier max_connections selon la taille du pool PgBouncer :
#   PgBouncer DEFAULT_POOL_SIZE=200 → max_connections >= 250 (headroom 25%)

# ── Réplication streaming ──────────────────────────────────────────────────
wal_level = replica               # Minimum pour streaming replication
max_wal_senders = 5               # Max replicas + tools (pg_basebackup, barman)
wal_keep_size = 256MB             # Garde 256 MB de WAL pour les replicas lents
hot_standby = on                  # Permet les queries en lecture sur les replicas
synchronous_commit = local        # Writes confirmés localement (async replica)
                                  # Passer à "on" pour synchronous replication (safer, slower)

# ── Connexions ────────────────────────────────────────────────────────────
max_connections = 300             # PgBouncer pool_size=200 + headroom

# ── Mémoire ──────────────────────────────────────────────────────────────
shared_buffers = 256MB            # ~25% RAM disponible pour le conteneur (1GB limit)
effective_cache_size = 768MB      # ~75% RAM
work_mem = 4MB                    # Par connexion × sort/hash ops
maintenance_work_mem = 64MB       # Pour VACUUM, CREATE INDEX, etc.

# ── Checkpoints ──────────────────────────────────────────────────────────
checkpoint_completion_target = 0.9
wal_buffers = 16MB
default_statistics_target = 100

# ── Logging ──────────────────────────────────────────────────────────────
log_min_duration_statement = 500  # Log queries > 500ms
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 250ms

# ── TimescaleDB ──────────────────────────────────────────────────────────
# Nécessaire si TimescaleDB est installé (shared_preload_libraries)
# Décommenter si l'image contient TimescaleDB (timescale/timescaledb-ha)
# shared_preload_libraries = 'timescaledb'
# timescaledb.max_background_workers = 8

# ── pg_hba.conf override ─────────────────────────────────────────────────
# L'accès replication est contrôlé dans pg_hba.conf, pas ici.
# Le replica doit être dans le même réseau Docker (atmr-network).
