# À appliquer sur l'hôte Linux qui exécute Docker (pas dans le conteneur Redis).
# Recommandé par Redis pour réduire les risques lors de fork / BGSAVE / AOF sous pression mémoire.
#
# Installation persistante :
#   sudo cp scripts/sysctl.d/99-atmr-redis.conf /etc/sysctl.d/99-atmr-redis.conf
#   sudo sysctl --system
#
vm.overcommit_memory = 1
