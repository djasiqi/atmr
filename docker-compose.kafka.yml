# docker-compose.kafka.yml
# Infrastructure Kafka pour notifications haute performance
# En local (1 broker, moins de RAM) : préférer docker-compose.kafka.dev.yml
#   docker compose -f docker-compose.yml -f docker-compose.kafka.dev.yml up -d
# Stack complète 3 ZK + 3 brokers (merge avec le compose principal) :
#   docker compose -f docker-compose.yml -f docker-compose.kafka.yml up -d
#
# Réplication : par défaut RF=2 (topics + __consumer_offsets) pour éviter l’échec si
# moins de 3 brokers visibles. Pour 3+ brokers stables, exporter par ex. :
#   KAFKA_BROKER_REPLICATION_FACTOR=3 KAFKA_TOPIC_REPLICATION_FACTOR=3

services:
  # Zookeeper (requis par Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: atmr-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_SERVERS: zookeeper:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx256m"
    mem_limit: 512m
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - default
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper-2:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper-2
    container_name: atmr-zookeeper-2
    ports:
      - "2182:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVER_ID: 2
      ZOOKEEPER_SERVERS: zookeeper:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx256m"
    mem_limit: 512m
    volumes:
      - zookeeper2-data:/var/lib/zookeeper/data
      - zookeeper2-logs:/var/lib/zookeeper/log
    networks:
      - default
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper-3:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper-3
    container_name: atmr-zookeeper-3
    ports:
      - "2183:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_SERVERS: zookeeper:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx256m"
    mem_limit: 512m
    volumes:
      - zookeeper3-data:/var/lib/zookeeper/data
      - zookeeper3-logs:/var/lib/zookeeper/log
    networks:
      - default
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka Broker 1
  kafka-broker-1:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka-broker-1
    container_name: atmr-kafka-broker-1
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181,zookeeper-2:2181,zookeeper-3:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker-1:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_DEFAULT_REPLICATION_FACTOR: ${KAFKA_BROKER_REPLICATION_FACTOR:-2}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_BROKER_REPLICATION_FACTOR:-2}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_BROKER_REPLICATION_FACTOR:-2}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_BROKER_TXN_MIN_ISR:-1}
      KAFKA_MIN_INSYNC_REPLICAS: ${KAFKA_BROKER_MIN_INSYNC_REPLICAS:-1}
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CONFLUENT_METRICS_ENABLE: "false"
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_HEAP_OPTS: "-Xms1G -Xmx1G"
      KAFKA_NUM_NETWORK_THREADS: 3
      KAFKA_NUM_IO_THREADS: 3
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 102400
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 102400
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
      KAFKA_NUM_PARTITIONS: ${KAFKA_DEFAULT_PARTITIONS:-6}
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_LOG_RETENTION_BYTES: 10737418240
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_COMPRESSION_TYPE: snappy
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data-1:/var/lib/kafka/data
    mem_limit: 2g
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - default
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 15

  # Kafka Broker 2
  kafka-broker-2:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka-broker-2
    container_name: atmr-kafka-broker-2
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9093:9093"
      - "9102:9102"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181,zookeeper-2:2181,zookeeper-3:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker-2:29092,PLAINTEXT_HOST://localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_DEFAULT_REPLICATION_FACTOR: ${KAFKA_BROKER_REPLICATION_FACTOR:-2}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_BROKER_REPLICATION_FACTOR:-2}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_BROKER_REPLICATION_FACTOR:-2}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_BROKER_TXN_MIN_ISR:-1}
      KAFKA_MIN_INSYNC_REPLICAS: ${KAFKA_BROKER_MIN_INSYNC_REPLICAS:-1}
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CONFLUENT_METRICS_ENABLE: "false"
      KAFKA_JMX_PORT: 9102
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_HEAP_OPTS: "-Xms1G -Xmx1G"
      KAFKA_NUM_NETWORK_THREADS: 3
      KAFKA_NUM_IO_THREADS: 3
      KAFKA_NUM_PARTITIONS: ${KAFKA_DEFAULT_PARTITIONS:-6}
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_LOG_RETENTION_BYTES: 10737418240
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_COMPRESSION_TYPE: snappy
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data-2:/var/lib/kafka/data
    mem_limit: 2g
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - default
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9093"]
      interval: 10s
      timeout: 5s
      retries: 15

  # Kafka Broker 3
  kafka-broker-3:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka-broker-3
    container_name: atmr-kafka-broker-3
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9094:9094"
      - "9103:9103"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181,zookeeper-2:2181,zookeeper-3:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker-3:29092,PLAINTEXT_HOST://localhost:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_DEFAULT_REPLICATION_FACTOR: ${KAFKA_BROKER_REPLICATION_FACTOR:-2}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_BROKER_REPLICATION_FACTOR:-2}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_BROKER_REPLICATION_FACTOR:-2}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_BROKER_TXN_MIN_ISR:-1}
      KAFKA_MIN_INSYNC_REPLICAS: ${KAFKA_BROKER_MIN_INSYNC_REPLICAS:-1}
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CONFLUENT_METRICS_ENABLE: "false"
      KAFKA_JMX_PORT: 9103
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_HEAP_OPTS: "-Xms1G -Xmx1G"
      KAFKA_NUM_NETWORK_THREADS: 3
      KAFKA_NUM_IO_THREADS: 3
      KAFKA_NUM_PARTITIONS: ${KAFKA_DEFAULT_PARTITIONS:-6}
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_LOG_RETENTION_BYTES: 10737418240
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_COMPRESSION_TYPE: snappy
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data-3:/var/lib/kafka/data
    mem_limit: 2g
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - default
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9094"]
      interval: 10s
      timeout: 5s
      retries: 15

  # Création idempotente des topics (AUTO_CREATE est désactivé côté brokers). Doit s’exécuter
  # avant les consumers tracking / DLQ (depends_on: service_completed_successfully).
  kafka-topics-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: atmr-kafka-topics-init
    environment:
      BOOTSTRAP_SERVERS: kafka-broker-1:29092
      KAFKA_TOPIC_REPLICATION_FACTOR: ${KAFKA_TOPIC_REPLICATION_FACTOR:-2}
      KAFKA_DEFAULT_PARTITIONS: ${KAFKA_DEFAULT_PARTITIONS:-6}
      KAFKA_DLQ_PARTITIONS: ${KAFKA_DLQ_PARTITIONS:-3}
      KAFKA_CREATE_INACTIVE_TOPICS: ${KAFKA_CREATE_INACTIVE_TOPICS:-false}
      KAFKA_TOPIC_DRIVER_LOCATION_RAW: ${KAFKA_TOPIC_DRIVER_LOCATION_RAW:-driver.location.raw}
      KAFKA_TOPIC_DRIVER_LOCATION_PROCESSED: ${KAFKA_TOPIC_DRIVER_LOCATION_PROCESSED:-driver.location.processed}
      KAFKA_TOPIC_DRIVER_LOCATION_DLQ: ${KAFKA_TOPIC_DRIVER_LOCATION_DLQ:-driver.location.dlq}
      KAFKA_TOPIC_NOTIFICATIONS_DLQ: ${KAFKA_TOPIC_NOTIFICATIONS_DLQ:-notifications.dlq}
    depends_on:
      kafka-broker-1:
        condition: service_healthy
      kafka-broker-2:
        condition: service_healthy
      kafka-broker-3:
        condition: service_healthy
    networks:
      - default
    volumes:
      - ./scripts:/kafka-scripts:ro
    entrypoint: ["/bin/bash", "/kafka-scripts/kafka-init-topics.sh"]
    restart: "no"

  # Kafka UI — profile kafka-ui (optionnel, libère ~200 Mo RAM si non démarré)
  kafka-ui:
    profiles: ["kafka-ui"]
    image: provectuslabs/kafka-ui:latest
    container_name: atmr-kafka-ui
    depends_on:
      - kafka-broker-1
      - kafka-broker-2
      - kafka-broker-3
    ports:
      - "8090:8080"
    mem_limit: 256m
    environment:
      KAFKA_CLUSTERS_0_NAME: atmr-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker-1:29092,kafka-broker-2:29092,kafka-broker-3:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      KAFKA_CLUSTERS_0_METRICS_PORT: 9101
    networks:
      - default
    restart: unless-stopped

  # Kafka Consumer (Worker pour traiter les notifications)
  kafka-consumer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      kafka-broker-1:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
    command: python -m services.notifications.kafka_consumer
    environment:
      # Database (aligné sur l’API : PgBouncer, identifiants depuis POSTGRES_* du compose principal)
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-atmr}:${POSTGRES_PASSWORD:-atmr}@pgbouncer:6432/${POSTGRES_DB:-atmr}
      # Kafka
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker-1:29092,kafka-broker-2:29092,kafka-broker-3:29092
      KAFKA_CONSUMER_GROUP: notifications-consumer-group
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      KAFKA_SSL_CAFILE: ${KAFKA_SSL_CAFILE:-}
      KAFKA_SSL_CERTFILE: ${KAFKA_SSL_CERTFILE:-}
      KAFKA_SSL_KEYFILE: ${KAFKA_SSL_KEYFILE:-}
      TRACKING_INGEST_ASYNC_ENABLED: "true"
      # Redis
      REDIS_URL: redis://redis:6379/0
      # Notifications
      SMS_NOTIFICATIONS_ENABLED: "${SMS_NOTIFICATIONS_ENABLED:-false}"
      EMAIL_NOTIFICATIONS_ENABLED: "${EMAIL_NOTIFICATIONS_ENABLED:-false}"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN}"
      TWILIO_PHONE_NUMBER: "${TWILIO_PHONE_NUMBER}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
    networks:
      - default
    restart: unless-stopped
    profiles: ["kafka-notifications"]
    deploy:
      replicas: 3 # 3 consumers pour scaling
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  # Redis secondaire (failover region)
  redis-failover:
    image: redis:7-alpine
    container_name: atmr-redis-failover
    # Port non publie sur l'hote (acces interne Docker uniquement via redis-failover:6379)
    expose:
      - "6379"
    command: >
      redis-server 
      --appendonly yes
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-failover-data:/data
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  tracking-kafka-consumer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      kafka-topics-init:
        condition: service_completed_successfully
    command: python -m services.tracking.ingest_consumer
    environment:
      # DSN construit côté Python (quote_plus) — ne pas interpoler le mot de passe ici
      POSTGRES_USER: ${POSTGRES_USER:-atmr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: "6432"
      POSTGRES_DB: ${POSTGRES_DB:-atmr}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      DATABASE_URL: ""
      SQLALCHEMY_DATABASE_URI: ""
      PRIMARY_DATABASE_URL: ""
      REPLICA_DATABASE_URL: ""
      REPLICA_DATABASE_URLS: ""
      KAFKA_ENABLED: "true"
      TRACKING_INGEST_ASYNC_ENABLED: "true"
      TRACKING_INGEST_PERSIST_ENABLED: ${TRACKING_INGEST_PERSIST_ENABLED:-true}
      TRACKING_PERSIST_WITH_OUTBOX: ${TRACKING_PERSIST_WITH_OUTBOX:-false}
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker-1:29092,kafka-broker-2:29092,kafka-broker-3:29092
      KAFKA_MAX_BLOCK_MS: "20000"
      KAFKA_PUBLISH_ACK_TIMEOUT_S: "10"
      KAFKA_TRACKING_CONSUMER_GROUP: tracking-ingest-consumer-group
      KAFKA_TOPIC_DRIVER_LOCATION_RAW: ${KAFKA_TOPIC_DRIVER_LOCATION_RAW:-driver.location.raw}
      KAFKA_TOPIC_DRIVER_LOCATION_PROCESSED: ${KAFKA_TOPIC_DRIVER_LOCATION_PROCESSED:-driver.location.processed}
      KAFKA_TOPIC_DRIVER_LOCATION_VALIDATED: ${KAFKA_TOPIC_DRIVER_LOCATION_PROCESSED:-driver.location.processed}
      KAFKA_TOPIC_DRIVER_LOCATION_DLQ: ${KAFKA_TOPIC_DRIVER_LOCATION_DLQ:-driver.location.dlq}
      KAFKA_TOPIC_MISSION_EVENTS: mission.events
      KAFKA_TOPIC_NOTIFICATION_EVENTS: notification.events
      KAFKA_TOPIC_DISPATCH_EVENTS: dispatch.events
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      KAFKA_SSL_CAFILE: ${KAFKA_SSL_CAFILE:-}
      KAFKA_SSL_CERTFILE: ${KAFKA_SSL_CERTFILE:-}
      KAFKA_SSL_KEYFILE: ${KAFKA_SSL_KEYFILE:-}
    networks:
      - default
    restart: unless-stopped
    # Note: `deploy.replicas` s’applique en mode Swarm uniquement.
    # Avec le compose principal + ce fichier, utiliser p.ex. le script
    #   scripts/run-tracking-consumers.sh
    # ou: docker compose -f docker-compose.yml -f docker-compose.kafka.yml up -d --scale tracking-kafka-consumer=3 tracking-kafka-consumer
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import pathlib,sys; cmd=pathlib.Path('/proc/1/cmdline').read_text(); sys.exit(0 if 'ingest_consumer' in cmd else 1)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Fanout Socket.IO entreprise (Flask) depuis Kafka processed — même contrat que HTTP sync (PR-4).
  tracking-processed-fanout:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      kafka-topics-init:
        condition: service_completed_successfully
    command: python -m services.tracking.processed_fanout_consumer
    environment:
      # DSN construit côté Python (quote_plus) — ne pas interpoler le mot de passe ici
      POSTGRES_USER: ${POSTGRES_USER:-atmr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: "6432"
      POSTGRES_DB: ${POSTGRES_DB:-atmr}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      DATABASE_URL: ""
      SQLALCHEMY_DATABASE_URI: ""
      PRIMARY_DATABASE_URL: ""
      REPLICA_DATABASE_URL: ""
      REPLICA_DATABASE_URLS: ""
      REDIS_URL: redis://redis:6379/0
      KAFKA_ENABLED: "true"
      TRACKING_INGEST_ASYNC_ENABLED: "true"
      TRACKING_PROCESSED_FANOUT_ENABLED: ${TRACKING_PROCESSED_FANOUT_ENABLED:-false}
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker-1:29092,kafka-broker-2:29092,kafka-broker-3:29092
      KAFKA_PROCESSED_FANOUT_GROUP: tracking-processed-fanout-group
      KAFKA_TOPIC_DRIVER_LOCATION_PROCESSED: ${KAFKA_TOPIC_DRIVER_LOCATION_PROCESSED:-driver.location.processed}
      KAFKA_PROCESSED_FANOUT_OFFSET_RESET: latest
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      KAFKA_SSL_CAFILE: ${KAFKA_SSL_CAFILE:-}
      KAFKA_SSL_CERTFILE: ${KAFKA_SSL_CERTFILE:-}
      KAFKA_SSL_KEYFILE: ${KAFKA_SSL_KEYFILE:-}
    networks:
      - default
    restart: unless-stopped
    # Consumer Kafka pur : pas d’HTTP — même schéma que ingest/DLQ (cmdline PID 1), remplace
    # un éventuel HEALTHCHECK HTTP hérité de l’image (faux unhealthy).
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import pathlib,sys; cmd=pathlib.Path('/proc/1/cmdline').read_text(); sys.exit(0 if 'processed_fanout_consumer' in cmd else 1)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  kafka-dlq-consumer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      kafka-topics-init:
        condition: service_completed_successfully
    command: python -m services.kafka.dlq_consumer
    environment:
      # DSN construit côté Python (quote_plus) — ne pas interpoler le mot de passe ici
      POSTGRES_USER: ${POSTGRES_USER:-atmr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: "6432"
      POSTGRES_DB: ${POSTGRES_DB:-atmr}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      DATABASE_URL: ""
      SQLALCHEMY_DATABASE_URI: ""
      PRIMARY_DATABASE_URL: ""
      REPLICA_DATABASE_URL: ""
      REPLICA_DATABASE_URLS: ""
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker-1:29092,kafka-broker-2:29092,kafka-broker-3:29092
      KAFKA_DLQ_CONSUMER_GROUP: kafka-dlq-consumer-group
      KAFKA_TOPIC_NOTIFICATIONS_DLQ: notifications.dlq
      KAFKA_TOPIC_DRIVER_LOCATION_DLQ: ${KAFKA_TOPIC_DRIVER_LOCATION_DLQ:-driver.location.dlq}
      KAFKA_DLQ_STORAGE_PATH: /app/data/kafka_dlq_events.jsonl
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      KAFKA_SSL_CAFILE: ${KAFKA_SSL_CAFILE:-}
      KAFKA_SSL_CERTFILE: ${KAFKA_SSL_CERTFILE:-}
      KAFKA_SSL_KEYFILE: ${KAFKA_SSL_KEYFILE:-}
    volumes:
      - ./data/kafka-dlq:/app/data
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import pathlib,sys; cmd=pathlib.Path('/proc/1/cmdline').read_text(); sys.exit(0 if 'dlq_consumer' in cmd else 1)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

volumes:
  zookeeper-data:
  zookeeper-logs:
  zookeeper2-data:
  zookeeper2-logs:
  zookeeper3-data:
  zookeeper3-logs:
  kafka-data-1:
  kafka-data-2:
  kafka-data-3:
  redis-failover-data:

networks:
  # Même clé `default` que docker-compose.yml pour éviter deux définitions nommées (labels Compose) pour un seul bridge `atmr-stack`.
  default:
    name: atmr-stack
