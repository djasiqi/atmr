# docker-compose.rl.yml
# Configuration Docker Compose pour l'environnement Reinforcement Learning / ML
#
# Usage:
#   docker compose -f docker-compose.rl.yml up -d
#   docker compose -f docker-compose.rl.yml logs -f rl-worker
#
# Cette stack est séparée de la production et peut être déployée sur un serveur différent
# (ou le même serveur mais dans un contexte isolé)

services:
  # Worker RL pour training et expériences
  rl-worker:
    # Utiliser l'image depuis Docker Hub (construite par workflow GitHub Actions)
    # Pour build local, décommenter la section build ci-dessus et commenter image
    image: ${DOCKER_IMAGE:-docker.io/djasiqi/atmr-backend}:${DOCKER_TAG:-rl-latest}
    # build:
    #   context: ./backend
    #   dockerfile: Dockerfile.rl
    container_name: atmr-rl-worker
    restart: unless-stopped
    env_file:
      - .env.rl
    environment:
      # Configuration RL
      - RL_ENABLED=true
      - WITH_RL=true
      - APP_ENV=rl

      # Configuration Flask
      - FLASK_ENV=production
      - FLASK_CONFIG=production
      - FLASK_APP=app.py

      # Base de données PostgreSQL RL
      # ⚠️ IMPORTANT: Les variables individuelles sont fournies, le code Python construira DATABASE_URL automatiquement
      - POSTGRES_USER=${RL_POSTGRES_USER:-atmr_rl_user}
      - POSTGRES_PASSWORD=${RL_POSTGRES_PASSWORD:-atmr_rl_password}
      - POSTGRES_HOST=rl-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${RL_POSTGRES_DB:-atmr_rl_db}
      # DATABASE_URL peut être fourni directement via .env.rl si nécessaire, sinon construit par config.py
      - DATABASE_URL=${RL_DATABASE_URL:-}
      - SQLALCHEMY_DATABASE_URI=${RL_DATABASE_URL:-}

      # Redis RL (IMPORTANT: utiliser rl-redis, pas redis)
      # ⚠️ IMPORTANT: Le code Python (celery_app.py) construira automatiquement les URLs Redis
      # avec échappement correct depuis REDIS_PASSWORD si nécessaire
      - REDIS_HOST=rl-redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=${RL_REDIS_PASSWORD:-atmr_rl_redis_password}
      # REDIS_URL peut être fourni directement via .env.rl si nécessaire
      - REDIS_URL=${RL_REDIS_URL:-}
      # CELERY_BROKER_URL et CELERY_RESULT_BACKEND seront construits par celery_app.py

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

      # ML/RL Models paths
      - ML_MODELS_PATH=/app/data/ml
      - RL_MODELS_PATH=/app/data/rl
    volumes:
      - ./data/rl:/app/data/rl
      - ./data/ml:/app/data/ml
      - ./data/rl/shadow_mode:/app/data/rl/shadow_mode
    networks:
      - atmr-rl-network
    depends_on:
      rl-postgres:
        condition: service_healthy
      rl-redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "4.0"
        reservations:
          memory: 2G
          cpus: "2.0"
    # Exemple de commande pour training
    # command: python -m atmr.rl.train
    # Ou pour un worker Celery RL
    # command: celery -A atmr.celery_app worker -l info -Q rl_queue

  # Base de données PostgreSQL pour les expériences RL
  # Peut être une DB séparée ou utiliser des snapshots de la prod
  rl-postgres:
    image: postgres:15-alpine
    container_name: atmr-rl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RL_POSTGRES_DB:-atmr_rl_db}
      POSTGRES_USER: ${RL_POSTGRES_USER:-atmr_rl_user}
      POSTGRES_PASSWORD: ${RL_POSTGRES_PASSWORD:-atmr_rl_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - rl_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # Port différent pour éviter conflit avec prod
    networks:
      - atmr-rl-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -c 'SELECT 1' > /dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 1G
          cpus: "0.5"

  # Redis pour les tâches RL (optionnel, peut partager avec prod)
  rl-redis:
    image: redis:7-alpine
    container_name: atmr-rl-redis
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        redis-server \
          --requirepass "${RL_REDIS_PASSWORD:-atmr_rl_redis_password}" \
          --appendonly yes \
          --maxmemory 512mb \
          --maxmemory-policy allkeys-lru \
          --bind 0.0.0.0 \
          --protected-mode yes
    volumes:
      - rl_redis_data:/data
    ports:
      - "6380:6379" # Port différent pour éviter conflit avec prod
    networks:
      - atmr-rl-network
    healthcheck:
      # ⚠️ NOTE: Le healthcheck ne peut pas accéder aux variables d'environnement directement
      # Si l'authentification est requise, utiliser redis-cli avec le mot de passe
      # ou désactiver temporairement l'authentification pour le healthcheck
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"

  # Optuna Dashboard pour visualiser les expériences (optionnel)
  optuna-dashboard:
    # Utiliser l'image depuis Docker Hub (construite par workflow GitHub Actions)
    # Pour build local, décommenter la section build ci-dessus et commenter image
    image: ${DOCKER_IMAGE:-docker.io/djasiqi/atmr-backend}:${DOCKER_TAG:-rl-latest}
    # build:
    #   context: ./backend
    #   dockerfile: Dockerfile.rl
    container_name: atmr-optuna-dashboard
    restart: unless-stopped
    env_file:
      - .env.rl
    environment:
      - RL_ENABLED=true
      - WITH_RL=true
      - RL_POSTGRES_USER=${RL_POSTGRES_USER:-atmr_rl_user}
      - RL_POSTGRES_PASSWORD=${RL_POSTGRES_PASSWORD:-atmr_rl_password}
      - RL_POSTGRES_DB=${RL_POSTGRES_DB:-atmr_rl_db}
      - RL_POSTGRES_HOST=rl-postgres
      - RL_POSTGRES_PORT=5432
    # Utiliser le script wrapper qui lit les variables d'environnement de manière sécurisée
    # Le script encode automatiquement le mot de passe pour l'URL PostgreSQL
    command: /app/scripts/optuna-dashboard-wrapper.sh
    volumes:
      - ./data/rl:/app/data/rl
    ports:
      - "8081:8080" # Port externe 8081 pour éviter conflit avec d'autres services (conservé pour accès direct)
    networks:
      - atmr-rl-network
      - traefik-network # Réseau Traefik pour le routage automatique
    depends_on:
      - rl-postgres
    # Labels Traefik pour le routage automatique avec HTTPS
    labels:
      # Activer Traefik pour ce conteneur
      - "traefik.enable=true"
      # Router HTTP (port 80) vers optuna.lirie.ch
      - "traefik.http.routers.optuna.rule=Host(`optuna.lirie.ch`)"
      - "traefik.http.routers.optuna.entrypoints=web"
      # Router HTTPS (port 443) vers optuna.lirie.ch avec certificat SSL automatique
      - "traefik.http.routers.optuna-secure.rule=Host(`optuna.lirie.ch`)"
      - "traefik.http.routers.optuna-secure.entrypoints=websecure"
      - "traefik.http.routers.optuna-secure.tls.certresolver=letsencrypt"
      # Redirection HTTP vers HTTPS
      - "traefik.http.middlewares.optuna-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.optuna-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.optuna.middlewares=optuna-redirect"
      # Authentification HTTP Basic
      # Option 1: Utiliser un fichier htpasswd (nécessite que le fichier soit monté dans Traefik)
      # Pour utiliser cette option, montez le fichier dans Traefik: -v /srv/traefik/htpasswd:/srv/traefik/htpasswd:ro
      # - "traefik.http.middlewares.optuna-auth.basicauth.usersfile=/srv/traefik/htpasswd"
      # Option 2: Utiliser un hash inline (plus simple, pas besoin de monter de fichier)
      # Le hash est injecté depuis la variable d'environnement OPTUNA_AUTH_HASH lors du déploiement
      # Format attendu dans le secret GitHub Actions: $apr1$... (sans le nom d'utilisateur)
      # Extraire avec: cat /srv/traefik/htpasswd | cut -d: -f2
      # Le hash sera remplacé par le script de déploiement
      - "traefik.http.middlewares.optuna-auth.basicauth.users=optuna:PLACEHOLDER_OPTUNA_AUTH_HASH"
      # Service backend (port interne du conteneur)
      - "traefik.http.services.optuna.loadbalancer.server.port=8080"
      # Headers pour proxy
      - "traefik.http.middlewares.optuna-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      # Appliquer l'authentification et les headers au router HTTPS
      - "traefik.http.routers.optuna-secure.middlewares=optuna-auth,optuna-headers"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

networks:
  atmr-rl-network:
    driver: bridge
    name: atmr-rl-network
  # Réseau externe Traefik (doit exister sur le serveur)
  traefik-network:
    external: true
    name: traefik_default # Nom par défaut du réseau Traefik, ajustez si nécessaire

volumes:
  rl_postgres_data:
    name: atmr-rl-postgres-data
  rl_redis_data:
    name: atmr-rl-redis-data
