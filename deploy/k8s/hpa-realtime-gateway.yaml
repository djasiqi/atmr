apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: realtime-gateway-hpa
  namespace: atmr
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: realtime-gateway
  minReplicas: 3
  maxReplicas: 40
  metrics:
    - type: Pods
      pods:
        metric:
          name: realtime_active_connections_per_pod
        target:
          type: AverageValue
          averageValue: "1500"
    - type: Pods
      pods:
        metric:
          name: realtime_event_fanout_per_second
        target:
          type: AverageValue
          averageValue: "300"
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
