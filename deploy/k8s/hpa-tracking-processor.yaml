apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tracking-processor-hpa
  namespace: atmr
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tracking-processor
  minReplicas: 4
  maxReplicas: 60
  metrics:
    - type: Pods
      pods:
        metric:
          name: kafka_consumer_lag_driver_location_validated
        target:
          type: AverageValue
          averageValue: "2000"
    - type: Pods
      pods:
        metric:
          name: tracking_persist_batch_latency_ms
        target:
          type: AverageValue
          averageValue: "100"
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
