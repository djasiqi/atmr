# docker-compose.monitoring.yml
# Stack complète de monitoring production pour ATMR
# Prometheus + Grafana + Alertmanager + Exporters

services:
  # ==================== Prometheus ====================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: atmr-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.wal-compression"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    # ⚠️ SÉCURITÉ: Ne pas exposer le port publiquement en production
    # Prometheus doit être accessible uniquement via réseau Docker interne
    # Pour accès externe, utiliser Grafana ou un reverse proxy interne
    # Pour développement local uniquement, décommenter la ligne suivante:
    # ports:
    #   - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks:
      - monitoring
      - atmr-network
      - internal
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9090/-/healthy",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G

  # ==================== Grafana ====================
  grafana:
    image: grafana/grafana:10.2.0
    container_name: atmr-grafana
    restart: unless-stopped
    # Charger les variables depuis .env.production (créé par le workflow GitHub Actions)
    env_file:
      - .env.production
    # ⚠️ SÉCURITÉ: Ne pas exposer le port publiquement en production
    # Utiliser Traefik ou Nginx comme reverse proxy avec HTTPS
    # Pour développement local uniquement, décommenter la ligne suivante:
    # ports:
    #   - "3001:3000"
    environment:
      # ⚠️ SÉCURITÉ: Variables OBLIGATOIRES - pas de fallback admin/admin
      # Définir GRAFANA_ADMIN_USER et GRAFANA_ADMIN_PASSWORD dans .env.production
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      # ⚠️ SÉCURITÉ: Root URL doit pointer vers l'URL publique (ex: https://grafana.lirie.ch)
      # Définir GRAFANA_ROOT_URL dans .env.production
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL}
      - GF_SERVER_PROTOCOL=https
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_COOKIE_SAMESITE=strict
      - GF_INSTALL_PLUGINS=
      - GF_ALERTING_ENABLED=true
      - GF_ALERTING_EXECUTION_TIMEOUT_SECONDS=30
      - GF_ALERTING_EVALUATION_TIMEOUT_SECONDS=30
      - GF_LOG_LEVEL=info
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      # ✅ OAuth Google - DÉSACTIVÉ pour le moment (utilisateur unique)
      # Pour activer OAuth plus tard, décommenter et configurer les secrets GitHub :
      # - GF_AUTH_GOOGLE_ENABLED=${GRAFANA_OAUTH_GOOGLE_ENABLED:-false}
      # - GF_AUTH_GOOGLE_CLIENT_ID=${GRAFANA_OAUTH_GOOGLE_CLIENT_ID:-}
      # - GF_AUTH_GOOGLE_CLIENT_SECRET=${GRAFANA_OAUTH_GOOGLE_CLIENT_SECRET:-}
      # - GF_AUTH_GOOGLE_SCOPES=openid email profile
      # - GF_AUTH_GOOGLE_ALLOWED_DOMAINS=${GRAFANA_OAUTH_GOOGLE_ALLOWED_DOMAINS:-}
      # - GF_AUTH_GOOGLE_ALLOW_SIGN_UP=false
      # Voir docs/MONITORING_GRAFANA_OAUTH.md pour la configuration complète
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring
      - internal
      # ✅ Réseau Traefik pour accès via reverse proxy (si Traefik est utilisé)
      # Décommenter si Traefik est configuré:
      # - traefik-network
    # ✅ Labels Traefik pour routage automatique (si Traefik est utilisé)
    # Décommenter et adapter si Traefik est configuré:
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.grafana.rule=Host(`grafana.lirie.ch`)"
    #   - "traefik.http.routers.grafana.entrypoints=websecure"
    #   - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    depends_on:
      - prometheus
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  # ==================== Alertmanager ====================
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: atmr-alertmanager
    restart: unless-stopped
    # Charger les variables depuis .env.production (créé par le workflow GitHub Actions)
    env_file:
      - .env.production
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.external-url=${ALERTMANAGER_EXTERNAL_URL:-http://localhost:9093}"
    # ⚠️ SÉCURITÉ: Ne pas exposer le port publiquement en production
    # Alertmanager doit être accessible uniquement via réseau Docker interne
    # Pour accès externe, utiliser un reverse proxy interne
    # Pour développement local uniquement, décommenter la ligne suivante:
    # ports:
    #   - "9093:9093"
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    networks:
      - monitoring
      - internal
    depends_on:
      - prometheus
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9093/-/healthy",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M

  # ==================== Node Exporter ====================
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: atmr-node-exporter
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring
      - internal
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9100/metrics",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 128M

  # ==================== cAdvisor ====================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: atmr-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      - monitoring
      - internal
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8080/healthz",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ==================== PostgreSQL Exporter ====================
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: atmr-postgres-exporter
    restart: unless-stopped
    # Charger les variables depuis .env.production (créé par le workflow GitHub Actions)
    env_file:
      - .env.production
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-atmr_user}:${POSTGRES_PASSWORD:-atmr_password}@postgres:5432/${POSTGRES_DB:-atmr_db}?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - monitoring
      - atmr-network
    # Note: postgres est dans docker-compose.production.yml (conteneur atmr-postgres)
    # La communication se fait via le réseau externe atmr-network
    # depends_on supprimé car le service n'est pas dans ce fichier
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9187/metrics",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 128M

  # ==================== Redis Exporter ====================
  redis-exporter:
    image: oliver006/redis_exporter:v1.55.0
    container_name: atmr-redis-exporter
    restart: unless-stopped
    # Charger les variables depuis .env.production (créé par le workflow GitHub Actions)
    env_file:
      - .env.production
    environment:
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    ports:
      - "9121:9121"
    networks:
      - monitoring
      - atmr-network
    # Note: redis est dans docker-compose.production.yml (conteneur atmr-redis)
    # La communication se fait via le réseau externe atmr-network
    # depends_on supprimé car le service n'est pas dans ce fichier
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9121/metrics",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 128M

# ==================== Volumes ====================
volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  alertmanager-data:
    driver: local

# ==================== Networks ====================
networks:
  monitoring:
    driver: bridge
    name: atmr-monitoring
  internal:
    driver: bridge
    name: atmr-internal
    internal: true # Réseau interne pour communication entre services monitoring
  atmr-network:
    external: true
    name: atmr-network # Réseau principal ATMR (défini dans docker-compose.production.yml)

