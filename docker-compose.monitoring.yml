# docker-compose.monitoring.yml
# Stack complète de monitoring production pour ATMR
# Prometheus + Grafana + Alertmanager + Exporters

services:
  # ==================== Prometheus ====================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: atmr-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.wal-compression"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    # ⚠️ SÉCURITÉ: Ne pas exposer le port publiquement en production
    # Prometheus doit être accessible uniquement via réseau Docker interne
    # Pour accès externe, utiliser Grafana ou un reverse proxy interne
    # Pour développement local uniquement, décommenter la ligne suivante:
    # ports:
    #   - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks:
      - monitoring
      - atmr-network
      - internal
      - traefik-network
    # ✅ Labels Traefik pour routage automatique
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.lirie.ch`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      # BasicAuth (hash dans .env.production MONITORING_BASIC_AUTH_USERS)
      # IP allowlist : middleware monitoring-ipallow dans traefik/dynamic.yml (virgules interdites dans labels Docker)
      - "traefik.http.middlewares.prometheus-auth.basicauth.users=${MONITORING_BASIC_AUTH_USERS:?MONITORING_BASIC_AUTH_USERS is required}"
      - "traefik.http.routers.prometheus.middlewares=prometheus-auth,monitoring-ipallow@file"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9090/-/healthy",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G

  # ==================== Grafana ====================
  grafana:
    image: grafana/grafana:10.2.0
    container_name: atmr-grafana
    restart: unless-stopped
    # Charger les variables depuis .env.production (créé par le workflow GitHub Actions)
    env_file:
      - .env.production
    # ⚠️ SÉCURITÉ: Ne pas exposer le port publiquement en production
    # Utiliser Traefik ou Nginx comme reverse proxy avec HTTPS
    # Pour développement local uniquement, décommenter la ligne suivante:
    # ports:
    #   - "3001:3000"
    environment:
      # ⚠️ SÉCURITÉ: Variables OBLIGATOIRES - pas de fallback admin/admin
      # Définir GRAFANA_ADMIN_USER et GRAFANA_ADMIN_PASSWORD dans .env.production
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      # ⚠️ SÉCURITÉ: Root URL doit pointer vers l'URL publique (ex: https://grafana.lirie.ch)
      # Définir GRAFANA_ROOT_URL dans .env.production
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
      # ⚠️ IMPORTANT: Utiliser HTTP en interne car Traefik gère HTTPS
      # Traefik fait le reverse proxy et gère les certificats SSL
      - GF_SERVER_PROTOCOL=http
      # Les cookies sécurisés sont gérés par Traefik (HTTPS)
      - GF_SECURITY_COOKIE_SECURE=false
      - GF_SECURITY_COOKIE_SAMESITE=lax
      - GF_INSTALL_PLUGINS=
      - GF_ALERTING_ENABLED=true
      - GF_ALERTING_EXECUTION_TIMEOUT_SECONDS=30
      - GF_ALERTING_EVALUATION_TIMEOUT_SECONDS=30
      - GF_LOG_LEVEL=info
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      # ✅ OAuth Google - DÉSACTIVÉ pour le moment (utilisateur unique)
      # Pour activer OAuth plus tard, décommenter et configurer les secrets GitHub :
      # - GF_AUTH_GOOGLE_ENABLED=${GRAFANA_OAUTH_GOOGLE_ENABLED:-false}
      # - GF_AUTH_GOOGLE_CLIENT_ID=${GRAFANA_OAUTH_GOOGLE_CLIENT_ID:-}
      # - GF_AUTH_GOOGLE_CLIENT_SECRET=${GRAFANA_OAUTH_GOOGLE_CLIENT_SECRET:-}
      # - GF_AUTH_GOOGLE_SCOPES=openid email profile
      # - GF_AUTH_GOOGLE_ALLOWED_DOMAINS=${GRAFANA_OAUTH_GOOGLE_ALLOWED_DOMAINS:-}
      # - GF_AUTH_GOOGLE_ALLOW_SIGN_UP=false
      # Voir docs/MONITORING_GRAFANA_OAUTH.md pour la configuration complète
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring
      - internal
      # ✅ Réseau Traefik pour accès via reverse proxy
      - traefik-network
    # ✅ Labels Traefik pour routage automatique
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.lirie.ch`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    depends_on:
      - prometheus
    healthcheck:
      # 127.0.0.1 (pas localhost) : évite les aléas IPv4/IPv6. curl -f : échoue si HTTP ≥ 400.
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          # Grafana 10.x charge plugins/provisioning : 512M provoque souvent OOM (redémarrages, « unhealthy »)
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M

  # ==================== Alertmanager ====================
  alertmanager:
    build:
      context: ./monitoring/alertmanager
      dockerfile: Dockerfile
    container_name: atmr-alertmanager
    restart: unless-stopped
    # Charger les variables depuis .env.production (créé par le workflow GitHub Actions)
    env_file:
      - .env.production
    # La commande est gérée par l'entrypoint qui fait la substitution de variables
    # L'entrypoint utilisera --config.file=/tmp/alertmanager.yml (fichier généré)
    # ⚠️ SÉCURITÉ: Ne pas exposer le port publiquement en production
    # Alertmanager doit être accessible uniquement via réseau Docker interne
    # Pour accès externe, utiliser un reverse proxy interne
    # Pour développement local uniquement, décommenter la ligne suivante:
    # ports:
    #   - "9093:9093"
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    networks:
      - monitoring
      - internal
      - traefik-network
    depends_on:
      - prometheus
    # ✅ Labels Traefik pour routage automatique
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alertmanager.rule=Host(`alertmanager.lirie.ch`)"
      - "traefik.http.routers.alertmanager.entrypoints=websecure"
      - "traefik.http.routers.alertmanager.tls.certresolver=letsencrypt"
      - "traefik.http.services.alertmanager.loadbalancer.server.port=9093"
      # BasicAuth + IP allowlist (fichier traefik/dynamic.yml : monitoring-ipallow)
      - "traefik.http.middlewares.alertmanager-auth.basicauth.users=${MONITORING_BASIC_AUTH_USERS:?MONITORING_BASIC_AUTH_USERS is required}"
      - "traefik.http.routers.alertmanager.middlewares=alertmanager-auth,monitoring-ipallow@file"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9093/-/healthy",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M

  # ==================== Node Exporter ====================
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: atmr-node-exporter
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring
      - internal
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9100/metrics",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 128M

  # ==================== cAdvisor ====================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: atmr-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8082:8080" # Port changé car 8080 est utilisé par Traefik
    networks:
      - monitoring
      - internal
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8080/healthz",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ==================== PostgreSQL Exporter ====================
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: atmr-postgres-exporter
    restart: unless-stopped
    # Charger les variables depuis .env.production (créé par le workflow GitHub Actions)
    env_file:
      - .env.production
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-atmr_user}:${POSTGRES_PASSWORD:-atmr_password}@postgres:5432/${POSTGRES_DB:-atmr_db}?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - monitoring
      - atmr-network
    # Note: postgres est dans docker-compose.production.yml (conteneur atmr-postgres)
    # La communication se fait via le réseau externe atmr-network
    # depends_on supprimé car le service n'est pas dans ce fichier
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9187/metrics",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 128M

  # ==================== Blackbox Exporter (readiness / 502) ====================
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.24.0
    container_name: atmr-blackbox-exporter
    restart: unless-stopped
    command:
      - "--config.file=/etc/blackbox/blackbox.yml"
    volumes:
      - ./monitoring/prometheus/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - monitoring
      - atmr-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9115/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M

  # ==================== Redis Exporter ====================
  redis-exporter:
    image: oliver006/redis_exporter:v1.55.0
    container_name: atmr-redis-exporter
    restart: unless-stopped
    # Charger les variables depuis .env.production (créé par le workflow GitHub Actions)
    env_file:
      - .env.production
    environment:
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    ports:
      - "9121:9121"
    networks:
      - monitoring
      - atmr-network
    # Note: redis est dans docker-compose.production.yml (conteneur atmr-redis)
    # La communication se fait via le réseau externe atmr-network
    # depends_on supprimé car le service n'est pas dans ce fichier
    # Pas de healthcheck Docker : l'image oliver006/redis_exporter est distroless
    # (aucun wget/curl/shell). L'ancien test wget provoquait un état unhealthy permanent.
    # La disponibilité se vérifie via le scrape Prometheus sur :9121/metrics.
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 128M

# ==================== Volumes ====================
volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  alertmanager-data:
    driver: local

# ==================== Networks ====================
networks:
  monitoring:
    driver: bridge
    name: atmr-monitoring
  internal:
    driver: bridge
    name: atmr-internal
    internal: true # Réseau interne pour communication entre services monitoring
  atmr-network:
    external: true
    name: atmr-network # Réseau principal ATMR (défini dans docker-compose.production.yml)
  traefik-network:
    external: true
    name: traefik_proxy # Réseau Traefik (doit exister sur le serveur)

