# atmr_alerts.yml
# Règles d'alertes spécifiques ATMR (WebSocket, ETA, OSRM, Dispatch)

groups:
  # ==================== WebSocket Alerts ====================
  - name: websocket
    interval: 30s
    rules:
      - alert: WebSocketHighDisconnections
        expr: |
          rate(socketio_disconnections_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          component: websocket
        annotations:
          summary: "Trop de déconnexions WebSocket"
          description: "{{ $value }} déconnexions/seconde sur les 5 dernières minutes"

      - alert: WebSocketNoHeartbeat
        expr: |
          time() - socketio_heartbeat_latency_ms{quantile="0.5"} > 60
        for: 1m
        labels:
          severity: critical
          component: websocket
        annotations:
          summary: "Absence heartbeat WebSocket > 1 min"
          description: "Aucun heartbeat reçu depuis plus de 1 minute"

      - alert: WebSocketHighEventsDropped
        expr: |
          (
            rate(socketio_events_total[5m]) - rate(socketio_events_total[5m] offset 5m)
          ) / rate(socketio_events_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          component: websocket
        annotations:
          summary: "Taux d'événements WebSocket droppés > 5%"
          description: "{{ $value | humanizePercentage }} des événements sont droppés"

      - alert: WebSocketHighReconnections
        expr: |
          rate(socketio_reconnections_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
          component: websocket
        annotations:
          summary: "Taux de reconnexions WebSocket élevé"
          description: "{{ $value }} reconnexions/seconde sur les 5 dernières minutes"

      - alert: WebSocketHighRateLimitHits
        expr: |
          rate(socketio_rate_limit_hits_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          component: websocket
        annotations:
          summary: "Trop de hits de rate limiting WebSocket"
          description: "{{ $value }} hits/seconde de rate limiting"

  # ==================== OSRM Alerts ====================
  - name: osrm
    interval: 30s
    rules:
      - alert: OSRMHighLatency
        expr: |
          histogram_quantile(0.95, rate(osrm_cache_hits_total[5m])) > 1.5
          OR
          histogram_quantile(0.95, rate(osrm_cache_misses_total[5m])) > 1.5
        for: 5m
        labels:
          severity: warning
          component: osrm
        annotations:
          summary: "Latence OSRM élevée (p95 > 1.5s)"
          description: "Latence p95 OSRM: {{ $value }}s"

      - alert: OSRMHighFailureRate
        expr: |
          (
            rate(eta_errors_total{error_type="osrm_timeout"}[5m]) +
            rate(eta_errors_total{error_type="osrm_error"}[5m])
          ) / rate(eta_calculations_total[5m]) > 0.10
        for: 5m
        labels:
          severity: critical
          component: osrm
        annotations:
          summary: "Taux d'échec OSRM > 10%"
          description: "{{ $value | humanizePercentage }} des requêtes OSRM échouent"

      - alert: OSRMLowCacheHitRate
        expr: |
          osrm_cache_hit_rate < 0.70
          AND
          (osrm_cache_hits_total + osrm_cache_misses_total) > 100
        for: 10m
        labels:
          severity: warning
          component: osrm
        annotations:
          summary: "Cache hit rate OSRM < 70%"
          description: "Hit rate actuel: {{ $value | humanizePercentage }} ({{ $labels.instance }})"
          action: "Vérifier si le cache Redis OSRM fonctionne correctement et si les requêtes sont fréquentes"

      - alert: OSRMCacheBypassHigh
        expr: |
          rate(osrm_cache_bypass_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
          component: osrm
        annotations:
          summary: "Trop de bypass cache OSRM (Redis HS?)"
          description: "{{ $value }} bypass/seconde - Redis peut être indisponible"

  # ==================== ETA Alerts ====================
  - name: eta
    interval: 1m
    rules:
      - alert: ETALowAccuracy
        expr: |
          avg_over_time(eta_accuracy_rate[1h]) < 0.80
        for: 1h
        labels:
          severity: warning
          component: eta
        annotations:
          summary: "Précision ETA < 80% (rolling window 1h)"
          description: "Précision moyenne: {{ $value | humanizePercentage }}"

      - alert: ETAHighErrorRate
        expr: |
          rate(eta_errors_total[5m]) / rate(eta_calculations_total[5m]) > 0.10
        for: 10m
        labels:
          severity: warning
          component: eta
        annotations:
          summary: "Taux d'erreur ETA > 10%"
          description: "{{ $value | humanizePercentage }} des calculs ETA échouent"

      - alert: ETAHighLatency
        expr: |
          histogram_quantile(0.95, rate(eta_calculation_latency_seconds_bucket[5m])) > 2.0
        for: 5m
        labels:
          severity: warning
          component: eta
        annotations:
          summary: "Latence calcul ETA élevée (p95 > 2s)"
          description: "Latence p95: {{ $value }}s"

  # ==================== Dispatch Alerts ====================
  - name: dispatch
    interval: 1m
    rules:
      - alert: DispatchEngineStuck
        expr: |
          dispatch_resolution_time_seconds > 600
        for: 10m
        labels:
          severity: critical
          component: dispatch
        annotations:
          summary: "Moteur dispatch bloqué (> 10 min)"
          description: "Temps de résolution: {{ $value }}s"

      - alert: DispatchHighDelayRate
        expr: |
          dispatch_delay_rate > 0.20
        for: 30m
        labels:
          severity: warning
          component: dispatch
        annotations:
          summary: "Taux de retard dispatch > 20%"
          description: "Taux actuel: {{ $value | humanizePercentage }}"

      - alert: DispatchHighCriticalDelays
        expr: |
          rate(dispatch_delays_total{severity="critical"}[5m]) > 5
        for: 10m
        labels:
          severity: critical
          component: dispatch
        annotations:
          summary: "Trop de retards critiques détectés"
          description: "{{ $value }} retards critiques/seconde"

      - alert: DispatchNoAssignments
        expr: |
          rate(dispatch_assignments_total[10m]) == 0
          AND
          rate(dispatch_assignments_total[10m] offset 10m) > 0
        for: 10m
        labels:
          severity: warning
          component: dispatch
        annotations:
          summary: "Aucune assignation créée depuis 10 min"
          description: "Le dispatch semble bloqué"

  # ==================== Location Alerts ====================
  # Métriques alignées sur services/monitoring/driver_location_metrics.py (PR1) et
  # websocket_metrics.driver_location_latency_seconds — pas location_positions_total
  # (jamais incrémenté dans le code).
  - name: location
    interval: 1m
    rules:
      - alert: LocationLowUpdateRate
        expr: |
          sum(rate(driver_location_processed_total[5m])) < 0.1
        for: 10m
        labels:
          severity: warning
          component: location
        annotations:
          summary: "Taux de mises à jour position très faible"
          description: "{{ $value }} positions traitées/s (agrégat driver_location_processed_total ; attendu: > 0.1/s si chauffeurs actifs)"

      - alert: LocationHighProcessingLatency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(driver_location_latency_seconds_bucket[5m])) by (le)
          ) > 1.0
        for: 5m
        labels:
          severity: warning
          component: location
        annotations:
          summary: "Latence traitement position élevée (p95 > 1s)"
          description: "Latence p95 socket driver_location → fanout: {{ $value }}s (driver_location_latency_seconds)"

  # ==================== Push Notifications Alerts ====================
  - name: push_notifications
    interval: 30s
    rules:
      # ✅ INSTRUMENTATION: Taux de succès < 95%
      - alert: PushNotificationLowSuccessRate
        expr: |
          (
            sum(rate(push_notifications_total{status="success"}[5m]))
            /
            sum(rate(push_notifications_total[5m]))
          ) < 0.95
        for: 5m
        labels:
          severity: warning
          component: push_notifications
        annotations:
          summary: "Taux de succès push notifications < 95%"
          description: "Taux de succès actuel: {{ $value | humanizePercentage }} (attendu: >= 95%)"
          action: "Vérifier les logs push pour identifier les causes d'échec (tokens invalides, erreurs réseau, etc.)"

      # ✅ INSTRUMENTATION: Latence P95 > 5s
      - alert: PushNotificationHighLatency
        expr: |
          histogram_quantile(0.95, rate(push_notification_latency_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
          component: push_notifications
        annotations:
          summary: "Latence P95 push notifications > 5s"
          description: "Latence P95 actuelle: {{ $value }}s (seuil: 5s)"
          action: "Vérifier la connectivité avec Expo Push API et les timeouts réseau"

      # ✅ INSTRUMENTATION: Circuit Breaker Ouvert
      # Note: Cette alerte nécessite un exporter Redis ou une métrique custom
      # Pour l'instant, on utilise une métrique indirecte via le taux d'échec
      - alert: PushNotificationCircuitBreakerOpen
        expr: |
          (
            sum(rate(push_notifications_total{status="failed"}[1m]))
            /
            sum(rate(push_notifications_total[1m]))
          ) > 0.50
          AND
          sum(rate(push_notifications_total[1m])) > 10
        for: 1m
        labels:
          severity: critical
          component: push_notifications
        annotations:
          summary: "Circuit breaker push notifications probablement ouvert"
          description: "Taux d'échec > 50% sur 1 minute avec {{ $value | humanizePercentage }} d'échecs. Le circuit breaker peut être ouvert."
          action: "Vérifier Redis key 'push:circuit_breaker:expo' et les logs push pour confirmer"

      # ✅ INSTRUMENTATION: Tokens Invalidés > 10/h
      - alert: PushNotificationHighTokenInvalidation
        expr: |
          sum(rate(push_tokens_invalidated_total[1h])) > 10
        for: 10m
        labels:
          severity: warning
          component: push_notifications
        annotations:
          summary: "Plus de 10 tokens invalidés par heure"
          description: "{{ $value }} tokens invalidés/heure (seuil: 10/h)"
          action: "Vérifier les raisons d'invalidation (reason label) et la santé des devices mobiles"

      - alert: PushDriverCoverageLowBootstrap
        expr: |
          push_operational_drivers_without_active_token_total
          / clamp_min(push_operational_drivers_total, 1) > 0.25
        for: 1h
        labels:
          severity: warning
          component: push_notifications
        annotations:
          summary: "Plus de 25% des chauffeurs opérationnels sans token push actif (bootstrap)"
          description: "{{ $value | humanizePercentage }} sans token actif"
          action: "Vérifier GET /admin/push-coverage/drivers et demander réouverture app chauffeurs concernés"

      - alert: PushTokenRegistrationFailureSpike
        expr: |
          (
            sum(increase(push_token_registration_failure_total[30m])) > 10
            or
            sum(rate(push_token_registration_failure_total[15m])) > 0.05
          )
          and
          sum(rate(push_token_registration_success_total[15m]))
          / clamp_min(sum(rate(push_token_registration_failure_total[15m])), 0.001) < 2
        for: 30m
        labels:
          severity: warning
          component: push_notifications
        annotations:
          summary: "Pic d'échecs enregistrement push token (possible régression release mobile)"
          action: "Vérifier logs [push-token], version app mobile, télémétrie push.token.register_failed"

      # Désactivé jusqu'au nettoyage flotte post-disclosure mobile (activer après plusieurs semaines)
      # - alert: PushDriverCoverageWarning
      #   expr: |
      #     push_operational_drivers_with_active_token_total
      #     / clamp_min(push_operational_drivers_total, 1) < 0.95
      #   for: 30m
      #   labels:
      #     severity: warning
      #     component: push_notifications
      #
      # - alert: PushDriverCoverageCritical
      #   expr: |
      #     push_operational_drivers_with_active_token_total
      #     / clamp_min(push_operational_drivers_total, 1) < 0.90
      #   for: 15m
      #   labels:
      #     severity: critical
      #     component: push_notifications

  # ==================== Invoice PDF Alerts ====================
  - name: invoice_pdf
    interval: 1m
    rules:
      # ✅ Alerte: Latence p95 trop élevée (> 1500ms)
      - alert: PDFGenerationP95High
        expr: |
          histogram_quantile(0.95,
            sum(rate(invoice_pdf_generation_ms_bucket[10m])) by (le, pdf_kind, billing_type)
          ) > 1500
        for: 10m
        labels:
          severity: warning
          component: invoice_pdf
        annotations:
          summary: "Latence p95 génération PDF > 1500ms"
          description: "Latence p95: {{ $value }}ms (pdf_kind={{ $labels.pdf_kind }}, billing_type={{ $labels.billing_type }})"
          action: |
            1. Vérifier les logs PDF pour identifier les factures lentes
            2. Vérifier le nombre de lignes (nb_rows) dans les logs
            3. Vérifier la charge serveur (CPU, mémoire)
            4. Consulter les métriques invoice_pdf_rows pour détecter des factures volumineuses
          runbook_url: "https://docs.atmr.ch/runbooks/pdf-slow-generation"

      # ✅ Alerte: Taux de warnings élevé (> 0.2/min)
      - alert: PDFWarningsRateHigh
        expr: |
          sum(rate(invoice_pdf_warning_total[10m])) by (pdf_kind, billing_type) > 0.0033
        for: 10m
        labels:
          severity: warning
          component: invoice_pdf
        annotations:
          summary: "Taux de warnings PDF > 0.2/min"
          description: "{{ $value }} warnings/s pour pdf_kind={{ $labels.pdf_kind }}, billing_type={{ $labels.billing_type }} (seuil rate 10m > ~0,0033/s ≈ 0,2/min)"
          action: |
            1. Vérifier les logs PDF pour identifier les factures problématiques
            2. Analyser les raisons (rows/time) via la métrique invoice_pdf_warning_total{reason=...}
            3. Vérifier si certaines factures dépassent systématiquement les seuils (40 lignes ou 1500ms)
            4. Consulter les métriques invoice_pdf_rows et invoice_pdf_generation_ms pour diagnostiquer
          runbook_url: "https://docs.atmr.ch/runbooks/pdf-warnings"

  # ==================== Notifications Push (P0 observabilité) ====================
  - name: notifications_push
    interval: 30s
    rules:
      - alert: NotificationDeliveryRateLow
        expr: |
          (
            sum(rate(notifications_delivered_total[30m]))
            / clamp_min(sum(rate(notifications_created_total[30m])), 0.001)
          ) < 0.85
        for: 15m
        labels:
          severity: warning
          component: notifications
        annotations:
          summary: "Taux délivrabilité notifications < 85% (30m)"
          description: "Seulement {{ $value | humanizePercentage }} des notifications créées sont accusées reçues côté mobile."

      - alert: NotificationFCMCircuitBreakerOpen
        expr: |
          sum(increase(circuit_breaker_opened_total{service="fcm"}[10m])) > 0
        for: 5m
        labels:
          severity: critical
          component: notifications
        annotations:
          summary: "Circuit breaker FCM ouvert"
          description: "FCM a ouvert le circuit breaker {{ $value }} fois en 10 minutes."

      - alert: NotificationE2ELatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(notification_e2e_latency_seconds_bucket[10m])) by (le)
          ) > 30
        for: 10m
        labels:
          severity: warning
          component: notifications
        annotations:
          summary: "Latence E2E notification p95 > 30s"
          description: "p95 pipeline notification = {{ $value | humanizeDuration }}."

      - alert: NotificationKafkaPublishStalled
        expr: |
          (
            sum(rate(notifications_created_total[15m])) > 0.01
          )
          and (
            sum(rate(notifications_sent_total{channel="push"}[15m])) == 0
          )
        for: 15m
        labels:
          severity: critical
          component: notifications
        annotations:
          summary: "Notifications créées mais aucun envoi push (15m)"
          description: "Pipeline bloqué entre création et envoi FCM/Kafka."

  # ==================== Tracking Health Alerts ====================
  - name: tracking_health
    interval: 30s
    rules:
      # P1-1a — garde-fou de lag AVANT activation persistance GPS (STOP GATE P0-2).
      # Seuil conservateur pour la fenêtre STOP GATE ; à durcir vers >100 for 5m (P2-1) après stabilisation.
      - alert: TrackingKafkaConsumerLagHigh
        expr: |
          max(tracking_kafka_consumer_lag{group="tracking-ingest-consumer-group"}) > 50
        for: 2m
        labels:
          severity: warning
          component: tracking
          team: backend-platform
          service: tracking
        annotations:
          summary: "Lag consumer tracking ingest > 50"
          description: "Lag Kafka ingest élevé ({{ $value }}) — surveiller avant/pendant l'activation de la persistance GPS."
          runbook_url: "https://grafana/d/driver-tracking-health"

      - alert: TrackingStaleHigh
        expr: |
          (
            sum(rate(driver_device_stale_fix_total[10m]))
            /
            clamp_min(sum(rate(driver_device_health_reports_total[10m])), 0.001)
          ) > 0.20
        for: 10m
        labels:
          severity: critical
          component: tracking
          team: mobile-platform
          service: tracking
        annotations:
          summary: ">20% heartbeats device-health avec fix stale"
          description: "Taux stale élevé sur les heartbeats device-health ({{ $value | humanizePercentage }})."
          runbook_url: "https://grafana/d/driver-tracking-health"

      - alert: TrackingOemStaleHigh
        expr: |
          (
            sum by (manufacturer) (rate(driver_device_stale_fix_total[1h]))
            /
            clamp_min(sum by (manufacturer) (rate(driver_device_health_reports_total[1h])), 0.001)
          ) > 0.40
        for: 30m
        labels:
          severity: warning
          component: tracking
          team: mobile-platform
          service: tracking
        annotations:
          summary: "Stale rate OEM > 40%"
          description: "Constructeur {{ $labels.manufacturer }} au-dessus du seuil ({{ $value | humanizePercentage }})."
          runbook_url: "https://grafana/d/driver-tracking-health"

      - alert: TrackingSilentWakeLow
        expr: |
          (
            sum(rate(silent_push_wake_total{result="acked"}[15m]))
            /
            clamp_min(sum(rate(silent_push_wake_total{result="sent"}[15m])), 0.001)
          ) < 0.80
        for: 15m
        labels:
          severity: warning
          component: tracking
          team: mobile-platform
          service: tracking
        annotations:
          summary: "Wake success rate < 80%"
          description: "Les silent push ne réveillent pas suffisamment le tracking mobile ({{ $value | humanizePercentage }} ack/sent)."
          runbook_url: "https://grafana/d/driver-tracking-health"

      - alert: TrackingDeviceHealthPipelineSilent
        expr: |
          absent_over_time(sum(rate(driver_device_health_reports_total[5m]))[10m:1m]) == 1
        for: 5m
        labels:
          severity: critical
          component: tracking
          team: mobile-platform
          service: tracking
        annotations:
          summary: "Pipeline device-health silencieux"
          description: "Aucun heartbeat device-health reçu depuis 10 minutes."
          runbook_url: "https://grafana/d/driver-tracking-health"
