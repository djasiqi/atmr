# recording_rules.yml
# Recording rules pour pré-agréger des métriques coûteuses
# Améliore les performances des requêtes PromQL et des dashboards Grafana

groups:
  # ==================== WebSocket Recording Rules ====================
  - name: websocket_recording
    interval: 30s
    rules:
      # Taux d'événements WebSocket (5m)
      - record: websocket:events_rate_5m
        expr: rate(socketio_events_total[5m])
        labels:
          metric_type: websocket

      # Taux de déconnexions WebSocket (5m)
      - record: websocket:disconnections_rate_5m
        expr: rate(socketio_disconnections_total[5m])
        labels:
          metric_type: websocket

      # Taux de reconnexions WebSocket (5m)
      - record: websocket:reconnections_rate_5m
        expr: rate(socketio_reconnections_total[5m])
        labels:
          metric_type: websocket

  # ==================== ETA Recording Rules ====================
  - name: eta_recording
    interval: 1m
    rules:
      # Taux de calculs ETA (5m)
      - record: eta:calculations_rate_5m
        expr: rate(eta_calculations_total[5m])
        labels:
          metric_type: eta

      # Taux d'erreurs ETA (5m)
      - record: eta:errors_rate_5m
        expr: rate(eta_errors_total[5m])
        labels:
          metric_type: eta

      # Latence ETA p95 (5m)
      - record: eta:latency_p95_5m
        expr: histogram_quantile(0.95, rate(eta_calculation_latency_seconds_bucket[5m]))
        labels:
          metric_type: eta
          quantile: "0.95"

  # ==================== Dispatch Recording Rules ====================
  - name: dispatch_recording
    interval: 1m
    rules:
      # Taux d'assignations dispatch (5m)
      - record: dispatch:assignments_rate_5m
        expr: rate(dispatch_assignments_total[5m])
        labels:
          metric_type: dispatch

      # Taux de retards dispatch (5m)
      - record: dispatch:delays_rate_5m
        expr: rate(dispatch_delays_total[5m])
        labels:
          metric_type: dispatch

      # Temps de résolution dispatch p95 (5m)
      - record: dispatch:resolution_time_p95_5m
        expr: histogram_quantile(0.95, rate(dispatch_resolution_time_seconds_bucket[5m]))
        labels:
          metric_type: dispatch
          quantile: "0.95"

  # ==================== OSRM Recording Rules ====================
  - name: osrm_recording
    interval: 1m
    rules:
      # Taux de cache hits OSRM (5m)
      - record: osrm:cache_hits_rate_5m
        expr: rate(osrm_cache_hits_total[5m])
        labels:
          metric_type: osrm

      # Taux de cache misses OSRM (5m)
      - record: osrm:cache_misses_rate_5m
        expr: rate(osrm_cache_misses_total[5m])
        labels:
          metric_type: osrm

      # Taux de bypass cache OSRM (5m)
      - record: osrm:cache_bypass_rate_5m
        expr: rate(osrm_cache_bypass_total[5m])
        labels:
          metric_type: osrm

  # ==================== Location Recording Rules ====================
  # Aligné PR1 : driver_location_processed_total / driver_location_latency_seconds
  - name: location_recording
    interval: 1m
    rules:
      # Taux de positions traitées (5m)
      - record: location:positions_rate_5m
        expr: sum(rate(driver_location_processed_total[5m]))
        labels:
          metric_type: location

      # Latence p95 socket driver_location → fanout (5m)
      - record: location:processing_latency_p95_5m
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(driver_location_latency_seconds_bucket[5m])) by (le)
          )
        labels:
          metric_type: location
          quantile: "0.95"

      # Part accepted_canonical sur positions traitées (5m) — runbook incident localisation
      - record: location:canonical_share_5m
        expr: |
          sum(rate(driver_location_processed_total{accept_status="accepted_canonical"}[5m]))
          /
          sum(rate(driver_location_processed_total[5m]))
        labels:
          metric_type: location

      # Skew horloge p95 (recorded_at vs réception backend)
      - record: location:clock_skew_p95_5m
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(driver_location_clock_skew_seconds_bucket[5m])) by (le)
          )
        labels:
          metric_type: location
          quantile: "0.95"

  # ==================== HTTP Recording Rules ====================
  - name: http_recording
    interval: 30s
    rules:
      # Taux de requêtes HTTP (5m)
      - record: http:requests_rate_5m
        expr: rate(http_requests_total[5m])
        labels:
          metric_type: http

      # Latence HTTP p95 (5m)
      - record: http:request_duration_p95_5m
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))
        labels:
          metric_type: http
          quantile: "0.95"

      # Latence HTTP p99 (5m)
      - record: http:request_duration_p99_5m
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m]))
        labels:
          metric_type: http
          quantile: "0.99"

      # Taux d'erreurs HTTP 5xx (5m)
      - record: http:errors_5xx_rate_5m
        expr: rate(http_requests_total{status=~"5.."}[5m])
        labels:
          metric_type: http
          error_type: "5xx"

  - name: tracking_health_recording
    interval: 1m
    rules:
      - record: tracking:silent_wake_success_rate_5m
        expr: |
          sum(rate(silent_push_wake_total{result="acked"}[5m]))
          /
          clamp_min(sum(rate(silent_push_wake_total{result="sent"}[5m])), 0.001)
        labels:
          metric_type: tracking
      - record: tracking:device_fix_age_p95_5m
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(driver_device_last_fix_age_seconds_bucket[5m])) by (le)
          )
      - record: tracking:battery_optimized_rate_5m
        expr: |
          sum(rate(driver_device_health_reports_total{battery_optimized="true"}[5m]))
          /
          clamp_min(sum(rate(driver_device_health_reports_total[5m])), 0.001)

  - name: location_batch_recording
    interval: 1m
    rules:
      - record: location:batch_latency_p95_5m
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(driver_location_batch_latency_seconds_bucket[5m])) by (le)
          )
        labels:
          metric_type: location
      - record: location:batch_rate_limit_rate_5m
        expr: sum(rate(driver_location_batch_rate_limited_total[5m]))
        labels:
          metric_type: location
      - record: location:canonical_share_by_transport_5m
        expr: |
          sum(rate(driver_location_processed_total{accept_status="accepted_canonical"}[5m])) by (transport)
          /
          clamp_min(sum(rate(driver_location_processed_total[5m])) by (transport), 1e-9)
        labels:
          metric_type: location
      - record: location:gps_accuracy_p95_by_platform_5m
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(driver_location_gps_accuracy_meters_bucket[5m])) by (le, platform)
          )
        labels:
          metric_type: location
      - record: location:tracking_id_propagation_ratio_5m
        expr: |
          sum(rate(driver_location_tracking_id_propagated_total[5m]))
          /
          clamp_min(sum(rate(driver_location_batch_points_received_total[5m])), 1e-9)
        labels:
          metric_type: location
