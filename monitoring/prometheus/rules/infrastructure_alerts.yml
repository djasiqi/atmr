# infrastructure_alerts.yml
# Règles d'alertes infrastructure (CPU, RAM, Disk, PostgreSQL, Redis)

groups:
  # ==================== Infrastructure System ====================
  - name: infrastructure
    interval: 30s
    rules:
      - alert: LowMemoryAvailable
        expr: |
          node_memory_MemAvailable_bytes < 1610612736
        for: 5m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "Mémoire disponible hôte < 1,5 Go"
          description: "MemAvailable={{ $value | humanize1024 }}B — risque OOM (voir swap + stack Kafka)."

      - alert: HighMemoryUsage
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.90
        for: 5m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "Utilisation RAM > 90%"
          description: "RAM utilisée: {{ $value | humanizePercentage }}"

      - alert: HighCPUUsage
        expr: |
          100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "Utilisation CPU > 85%"
          description: "CPU utilisé: {{ $value }}%"

      - alert: LowDiskSpace
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.20
        for: 5m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "Espace disque < 20%"
          description: "Espace disponible: {{ $value | humanizePercentage }}"

      - alert: HighDiskIO
        expr: |
          rate(node_disk_io_time_seconds_total[5m]) > 0.90
        for: 5m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "I/O disque élevé (> 90%)"
          description: "I/O disque: {{ $value | humanizePercentage }}"

      - alert: HighLoadAverage
        expr: |
          node_load1 > count(node_cpu_seconds_total{mode="idle"}) * 1.5
        for: 5m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "Load average élevé"
          description: "Load 1min: {{ $value }}"

  # ==================== PostgreSQL Alerts ====================
  - name: postgres
    interval: 30s
    rules:
      - alert: PostgreSQLDown
        expr: |
          up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "PostgreSQL est down"
          description: "Le service PostgreSQL n'est pas accessible"

      - alert: PostgreSQLSlowQueries
        expr: |
          rate(pg_stat_statements_mean_exec_time_seconds[5m]) > 1.0
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Requêtes PostgreSQL lentes (> 1s)"
          description: "Temps moyen: {{ $value }}s"

      - alert: PostgreSQLHighConnections
        expr: |
          pg_stat_database_numbackends / pg_settings_max_connections > 0.80
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Connexions PostgreSQL > 80% du max"
          description: "{{ $value | humanizePercentage }} des connexions utilisées"

      - alert: PostgreSQLHighReplicationLag
        expr: |
          pg_replication_lag > 30
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Replication lag PostgreSQL élevé"
          description: "Lag: {{ $value }}s"

      - alert: PostgreSQLHighCacheMissRate
        expr: |
          (
            pg_stat_database_blks_hit 
            / 
            (pg_stat_database_blks_hit + pg_stat_database_blks_read)
          ) < 0.90
          AND
          (pg_stat_database_blks_hit + pg_stat_database_blks_read) > 1000
        for: 10m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Cache hit rate PostgreSQL < 90%"
          description: "Hit rate: {{ $value | humanizePercentage }} pour la base {{ $labels.datname }}"
          action: "Vérifier la configuration shared_buffers et les requêtes fréquentes. Un hit rate bas indique que PostgreSQL lit trop souvent depuis le disque."

  # ==================== Redis Alerts ====================
  - name: redis
    interval: 30s
    rules:
      - alert: RedisDown
        expr: |
          up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          component: cache
        annotations:
          summary: "Redis est down"
          description: "Le service Redis n'est pas accessible"

      - alert: RedisHighMemoryUsage
        expr: |
          redis_memory_used_bytes / redis_memory_max_bytes > 0.90
        for: 5m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Utilisation mémoire Redis > 90%"
          description: "Mémoire utilisée: {{ $value | humanizePercentage }}"

      - alert: RedisHighEvictions
        expr: |
          rate(redis_evicted_keys_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Taux d'évictions Redis élevé"
          description: "{{ $value }} évictions/seconde"

      - alert: RedisHighLatency
        expr: |
          redis_commands_duration_seconds_total{command="ping"} > 0.01
        for: 5m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Latence Redis élevée (> 10ms)"
          description: "Latence ping: {{ $value }}s"

  - name: phase4_realtime_and_streaming
    interval: 30s
    rules:
      - alert: Phase4WebSocketConnectionsNearCapacity
        expr: websocket_connections_total > 90000
        for: 1m
        labels:
          severity: warning
          component: realtime
        annotations:
          summary: "WS connections proches de la capacité cible Phase 4"
          description: "Nombre de connexions websocket > 90k."

      - alert: WsServiceKafkaConsumerDown
        expr: ws_kafka_consumer_enabled == 1 and ws_kafka_consumer_running == 0
        for: 2m
        labels:
          severity: critical
          component: ws-service
        annotations:
          summary: "ws-service : consumer Kafka requis mais arrêté"
          description: "WS_KAFKA_CONSUMER_ENABLED=true mais ws_kafka_consumer_running=0 depuis 2 minutes."

      - alert: Phase4TrackingLagCritical
        expr: kafka_consumergroup_lag{topic=~"driver\\.location\\.raw.*"} > 10000
        for: 2m
        labels:
          severity: critical
          component: kafka
        annotations:
          summary: "Lag tracking critique"
          description: "Le lag tracking dépasse 10k messages sur le topic raw (incl. suffixe .v2)."

      - alert: Phase4TrackingKafkaE2eLatencyHigh
        expr: |
          histogram_quantile(0.95, sum(rate(tracking_kafka_e2e_latency_seconds_bucket[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
          component: kafka
        annotations:
          summary: "Latence GPS pipeline Kafka P95 > 2 s"
          description: "raw→processed dépasse 2 s (contrat métier carte entreprise)."

      - alert: Phase4TrackingPublishErrorsHigh
        expr: increase(tracking_kafka_publish_errors_total[5m]) > 50
        for: 5m
        labels:
          severity: warning
          component: kafka
        annotations:
          summary: "Erreurs de publish tracking élevées"
          description: "Le pipeline tracking rencontre >50 erreurs de publication Kafka en 5 minutes."

      - alert: Phase4TrackingDlqGrowthHigh
        expr: increase(tracking_kafka_dlq_messages_total[5m]) > 20
        for: 5m
        labels:
          severity: warning
          component: kafka
        annotations:
          summary: "Croissance rapide de la DLQ tracking"
          description: "Plus de 20 messages tracking vers DLQ en 5 minutes."

      - alert: Phase4RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Redis > 85% de mémoire"
          description: "Redis approche de la limite mémoire pour la couche présence/fanout."

  # ==================== Container Alerts (cAdvisor) ====================
  - name: containers
    interval: 30s
    rules:
      - alert: ContainerHighCPU
        expr: |
          rate(container_cpu_usage_seconds_total{name=~"atmr-.*"}[5m]) > 0.85
        for: 5m
        labels:
          severity: warning
          component: containers
        annotations:
          summary: "Container {{ $labels.name }} utilise > 85% CPU"
          description: "CPU: {{ $value | humanizePercentage }}"

      - alert: ContainerHighMemory
        expr: |
          (
            container_memory_usage_bytes{name=~"atmr-.*"}
            /
            container_spec_memory_limit_bytes{name=~"atmr-.*"}
          > 0.90)
          AND
          (container_spec_memory_limit_bytes{name=~"atmr-.*"} > 0)
          AND
          (container_spec_memory_limit_bytes{name=~"atmr-.*"} != +Inf)
        for: 5m
        labels:
          severity: warning
          component: containers
        annotations:
          summary: "Container {{ $labels.name }} utilise > 90% mémoire (usage/cgroup)"
          description: "Mémoire: {{ $value | humanizePercentage }}"

      - alert: ContainerHighMemoryWorkingSet
        expr: |
          (
            container_memory_working_set_bytes{name=~"atmr-.*"}
            /
            container_spec_memory_limit_bytes{name=~"atmr-.*"}
          > 0.90)
          AND
          (container_spec_memory_limit_bytes{name=~"atmr-.*"} > 0)
          AND
          (container_spec_memory_limit_bytes{name=~"atmr-.*"} != +Inf)
        for: 5m
        labels:
          severity: warning
          component: containers
        annotations:
          summary: "Container {{ $labels.name }} utilise > 90% mémoire (working set/cgroup)"
          description: "Working set: {{ $value | humanizePercentage }}"

      - alert: BackendContainerRestartSpike
        expr: |
          rate(container_start_time_seconds{
            id =~ "/docker/.*",
            name =~ ".*backend.*"
          }[10m]) > 0.05
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "Backend redémarre fréquemment"
          description: "Pic de redémarrages backend (autoheal ou crash loop)."

      - alert: BackendReadinessFailing
        expr: |
          probe_success{job="blackbox-api-ready"} == 0
        for: 2m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "Readiness API échoue (blackbox)"
          description: "GET /api/v1/ready ne renvoie pas 200 depuis 2 min (workers morts ou dépendances down)."

      - alert: TraefikBackend502Spike
        expr: |
          sum(rate(http_requests_total{status="502"}[5m])) > 0.05
          or
          probe_http_status_code{job="blackbox-api-ready"} == 502
        for: 3m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "Pic de réponses 502 sur l'API"
          description: "502 détectés via blackbox ou métriques HTTP backend (Traefik / workers Gunicorn)."

      - alert: ContainerRestartLoop
        expr: |
          rate(container_start_time_seconds{
            # ✅ Filtrer les cgroups système (user.slice, app.slice, etc.)
            id !~ "/user\\.slice.*",
            id !~ "/system\\.slice.*",
            id !~ "/init\\.scope",
            id !~ "/.*\\.socket",
            id !~ "/.*\\.service$",
            # ✅ Ne garder que les conteneurs Docker réels (commencent par /docker/)
            id =~ "/docker/.*",
            # ✅ Exclure les conteneurs système Docker (pause, etc.)
            name !~ ".*pause.*",
            name != ""
          }[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
          component: containers
        annotations:
          summary: "Container {{ $labels.name }} en boucle de redémarrage"
          description: "{{ $value }} redémarrages/seconde (container ID: {{ $labels.id }})"

