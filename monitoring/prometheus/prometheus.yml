# prometheus.yml
# Configuration Prometheus production pour ATMR
# Scraping haute fréquence pour WebSocket, fréquence normale pour le reste

global:
  scrape_interval: 15s  # Intervalle par défaut
  evaluation_interval: 15s  # Évaluation des règles d'alertes
  external_labels:
    cluster: "atmr-production"
    environment: "production"
    region: "switzerland"

# Configuration Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      timeout: 10s
      api_version: v2

# Règles d'alertes
rule_files:
  - "rules/atmr_alerts.yml"
  - "rules/infrastructure_alerts.yml"
  - "rules/recording_rules.yml"  # ✅ Recording rules pour pré-agréger métriques coûteuses

# Scrape configurations
scrape_configs:
  # ==================== Backend Flask / Socket.IO ====================
  # Cible selon le compose (un seul job : ce fichier est le stack « monitoring / prod »).
  #   - PROD (ex. docker-compose.monitoring + compose prod) : service = backend -> backend:5000
  #   - DEV (docker-compose.yml, profile monitoring) : utiliser ./prometheus/prometheus.yml du repo
  #     (cible atmr_api:5000) — le service "backend" n’existe pas sur le réseau default dev.
  - job_name: "atmr-backend"
    metrics_path: "/api/v1/prometheus/metrics"
    static_configs:
      - targets:
          - "backend:5000"
        labels:
          service: "atmr-backend"
          component: "api"
          environment: "production"
    scrape_interval: 15s  # Intervalle standard
    scrape_timeout: 10s  # ✅ Timeout < intervalle
    honor_labels: true
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "socketio_.*"
        target_label: "metric_type"
        replacement: "websocket"
      - source_labels: [__name__]
        regex: "eta_.*"
        target_label: "metric_type"
        replacement: "eta"
      - source_labels: [__name__]
        regex: "osrm_.*"
        target_label: "metric_type"
        replacement: "osrm"
      - source_labels: [__name__]
        regex: "dispatch_.*"
        target_label: "metric_type"
        replacement: "dispatch"
      - source_labels: [__name__]
        regex: "location_.*"
        target_label: "metric_type"
        replacement: "location"
      - source_labels: [__name__]
        regex: "driver_location_.*"
        target_label: "metric_type"
        replacement: "location"
      - source_labels: [__name__]
        regex: "http_.*"
        target_label: "metric_type"
        replacement: "http"

  # ==================== ws-service (Kafka consumer health) ====================
  - job_name: "atmr-ws-service"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "ws-service:8001"
        labels:
          service: "atmr-ws-service"
          component: "realtime"
          environment: "production"
    scrape_interval: 30s
    scrape_timeout: 10s

  # ==================== Celery Workers ====================
  # ⚠️ DÉSACTIVÉ: Le worker Celery n'expose pas de serveur HTTP avec métriques
  # Les métriques Celery sont disponibles via Flower (port 5555) ou via le backend
  # Pour activer le monitoring Celery:
  # 1. Utiliser Flower (déjà disponible dans docker-compose.production.yml)
  # 2. Ou exporter les métriques via le backend Flask
  # 3. Ou utiliser un exporter Celery dédié (ex: celery-exporter)
  #
  # Exemple de configuration si un exporter Celery est ajouté:
  # - job_name: "celery"
  #   static_configs:
  #     - targets:
  #         - "celery-exporter:9540"
  #       labels:
  #         service: "celery"
  #         component: "worker"
  #   scrape_interval: 15s
  #   scrape_timeout: 10s

  # ==================== Redis ====================
  - job_name: "redis"
    static_configs:
      - targets:
          - "redis-exporter:9121"
        labels:
          service: "redis"
          component: "cache"
          environment: "production"
    scrape_interval: 15s
    scrape_timeout: 10s

  # ==================== PostgreSQL ====================
  - job_name: "postgres"
    static_configs:
      - targets:
          - "postgres-exporter:9187"
        labels:
          service: "postgres"
          component: "database"
          environment: "production"
    scrape_interval: 15s
    scrape_timeout: 10s

  # ==================== Node Exporter (Système) ====================
  - job_name: "node"
    static_configs:
      - targets:
          - "node-exporter:9100"
        labels:
          service: "node"
          component: "system"
          environment: "production"
    scrape_interval: 15s
    scrape_timeout: 10s

  # ==================== cAdvisor (Conteneurs Docker) ====================
  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "cadvisor:8080"
        labels:
          service: "cadvisor"
          component: "containers"
          environment: "production"
    scrape_interval: 15s
    scrape_timeout: 10s

  # ==================== Prometheus lui-même ====================
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"
        labels:
          service: "prometheus"
          component: "monitoring"
    scrape_interval: 15s

  # ==================== Blackbox — readiness externe ====================
  - job_name: "blackbox-api-ready"
    metrics_path: /probe
    params:
      module: [http_ready_200]
    static_configs:
      - targets:
          - "http://backend:5000/api/v1/ready"
        labels:
          probe: "internal-ready"
          environment: "production"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
    scrape_interval: 30s
    scrape_timeout: 15s

  # ==================== Alertmanager ====================
  - job_name: "alertmanager"
    static_configs:
      - targets:
          - "alertmanager:9093"
        labels:
          service: "alertmanager"
          component: "monitoring"
    scrape_interval: 15s

# ==================== Remote Write (Long-term Storage) ====================
# ✅ Configuration pour envoyer les métriques vers un système de long-term storage
# Options: Thanos, Cortex, Mimir, VictoriaMetrics, ou service cloud (Grafana Cloud, etc.)
#
# Pour activer, décommenter et configurer l'URL de votre remote write endpoint:
#
# remote_write:
#   - url: "https://prometheus-remote-write.example.com/api/v1/write"
#     # Authentification (si nécessaire)
#     # basic_auth:
#     #   username: "your-username"
#     #   password: "your-password"
#     # Ou bearer token:
#     # bearer_token: "your-token"
#     queue_config:
#       max_samples_per_send: 1000
#       batch_send_deadline: 5s
#       max_retries: 3
#       min_backoff: 30ms
#       max_backoff: 100ms
#     # Filtrer les métriques à envoyer (optionnel)
#     write_relabel_configs:
#       - source_labels: [__name__]
#         regex: '.*'
#         action: keep
#
# Exemples de services:
# - Grafana Cloud: https://prometheus-prod-01-eu-west-0.grafana.net/api/prom/push
# - Thanos: http://thanos-receive:10908/api/v1/receive
# - Cortex: http://cortex-distributor:9009/api/prom/push
# - Mimir: http://mimir-distributor:8080/api/v1/push

