# alertmanager.yml
# Configuration Alertmanager production pour ATMR
# ⚠️ IMPORTANT: Les variables d'environnement doivent être définies dans .env.production
# Si SMTP_HOST est vide ou incorrect, les notifications email peuvent échouer

global:
  resolve_timeout: 5m

  # ✅ Email SMTP - Configurer les variables dans .env.production
  smtp_smarthost: '${SMTP_HOST}:${SMTP_PORT}'
  smtp_from: '${ALERTMANAGER_FROM_EMAIL}'
  smtp_auth_username: '${SMTP_USERNAME}'
  smtp_auth_password: '${SMTP_PASSWORD}'
  # STARTTLS (port 587) — aligné sur la prod
  smtp_require_tls: true

# Templates pour notifications personnalisées
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Routes d'alertes par criticité
route:
  receiver: 'default-receiver'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h

  routes:
    # Alertes critiques
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
      group_wait: 0s
      repeat_interval: 1h

    # Alertes WebSocket critiques → Notification immédiate
    - match:
        component: websocket
        severity: critical
      receiver: 'websocket-critical'
      group_wait: 0s
      repeat_interval: 30m

    # Alertes OSRM critiques → Notification immédiate
    - match:
        component: osrm
        severity: critical
      receiver: 'osrm-critical'
      group_wait: 0s
      repeat_interval: 1h

    # Alertes Dispatch critiques → Notification immédiate
    - match:
        component: dispatch
        severity: critical
      receiver: 'dispatch-critical'
      group_wait: 0s
      repeat_interval: 1h

    # Alertes infrastructure critiques → Notification immédiate
    - match:
        component: infrastructure
        severity: critical
      receiver: 'infrastructure-critical'
      group_wait: 0s
      repeat_interval: 1h

    # Alertes database critiques → Notification immédiate
    - match:
        component: database
        severity: critical
      receiver: 'database-critical'
      group_wait: 0s
      repeat_interval: 1h

    # Alertes warning
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 30s
      repeat_interval: 6h

# Inhibition rules (supprimer alertes redondantes)
inhibit_rules:
  # Si PostgreSQL est down, supprimer les alertes de requêtes lentes
  - source_match:
      alertname: PostgreSQLDown
    target_match:
      component: database
    equal: ['instance']

  # Si Redis est down, supprimer les alertes de cache
  - source_match:
      alertname: RedisDown
    target_match:
      component: cache
    equal: ['instance']

  # Si le backend est down, supprimer les alertes applicatives
  - source_match:
      alertname: BackendDown
    target_match:
      service: atmr-backend
    equal: ['instance']

# Receivers (destinations des alertes — email uniquement)
receivers:
  - name: 'default-receiver'
    email_configs:
      - to: ${ALERT_EMAIL_TO}
        headers:
          Subject: '⚠️ ATMR Alert: {{ .GroupLabels.alertname }}'
        html: '{{ range .Alerts }}<h2>{{ .Annotations.summary }}</h2><p>{{ .Annotations.description }}</p>{{ end }}'
        send_resolved: true

  - name: 'critical-alerts'
    email_configs:
      - to: ${ALERT_EMAIL_TO}
        headers:
          Subject: '🚨 ATMR Critical Alert: {{ .GroupLabels.alertname }}'
        html: |
          <h1>🚨 ATMR Critical Alert</h1>
          {{ range .Alerts }}
          <h2>{{ .Annotations.summary }}</h2>
          <p><strong>Description:</strong> {{ .Annotations.description }}</p>
          <p><strong>Labels:</strong> {{ range .Labels.SortedPairs }}{{ .Name }}={{ .Value }} {{ end }}</p>
          <hr>
          {{ end }}
        send_resolved: true

  - name: 'websocket-critical'
    email_configs:
      - to: ${ALERT_EMAIL_TO}
        headers:
          Subject: '🔌 WebSocket Critical: {{ .GroupLabels.alertname }}'
        html: '{{ range .Alerts }}<h2>{{ .Annotations.summary }}</h2><p>{{ .Annotations.description }}</p>{{ end }}'
        send_resolved: true

  - name: 'osrm-critical'
    email_configs:
      - to: ${ALERT_EMAIL_TO}
        headers:
          Subject: '🗺️ OSRM Critical: {{ .GroupLabels.alertname }}'
        html: '{{ range .Alerts }}<h2>{{ .Annotations.summary }}</h2><p>{{ .Annotations.description }}</p>{{ end }}'
        send_resolved: true

  - name: 'dispatch-critical'
    email_configs:
      - to: ${ALERT_EMAIL_TO}
        headers:
          Subject: '🚗 Dispatch Critical: {{ .GroupLabels.alertname }}'
        html: '{{ range .Alerts }}<h2>{{ .Annotations.summary }}</h2><p>{{ .Annotations.description }}</p>{{ end }}'
        send_resolved: true

  - name: 'infrastructure-critical'
    email_configs:
      - to: ${ALERT_EMAIL_TO}
        headers:
          Subject: '🖥️ Infrastructure Critical: {{ .GroupLabels.alertname }}'
        html: '{{ range .Alerts }}<h2>{{ .Annotations.summary }}</h2><p>{{ .Annotations.description }}</p>{{ end }}'
        send_resolved: true

  - name: 'database-critical'
    email_configs:
      - to: ${ALERT_EMAIL_TO}
        headers:
          Subject: '🗄️ Database Critical: {{ .GroupLabels.alertname }}'
        html: '{{ range .Alerts }}<h2>{{ .Annotations.summary }}</h2><p>{{ .Annotations.description }}</p>{{ end }}'
        send_resolved: true

  - name: 'warning-alerts'
    email_configs:
      - to: ${ALERT_EMAIL_TO}
        headers:
          Subject: '⚠️ ATMR Warning: {{ .GroupLabels.alertname }}'
        html: '{{ range .Alerts }}<h2>{{ .Annotations.summary }}</h2><p>{{ .Annotations.description }}</p>{{ end }}'
        send_resolved: true
