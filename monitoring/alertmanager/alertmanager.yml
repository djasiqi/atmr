# alertmanager.yml
# Configuration Alertmanager production pour ATMR
# ⚠️ IMPORTANT: Les variables d'environnement doivent être définies dans .env.production
# Si SMTP_HOST ou SLACK_WEBHOOK_URL sont vides, les notifications correspondantes seront désactivées

global:
  resolve_timeout: 5m
  # ✅ Slack webhook - Configurer SLACK_WEBHOOK_URL dans .env.production
  # Format: https://hooks.slack.com/services/YOUR/WEBHOOK/URL
  # Si vide, la ligne sera commentée par le script d'entrypoint
  slack_api_url: '${SLACK_WEBHOOK_URL}'
  
  # ✅ Email SMTP - Configurer les variables dans .env.production
  # Format: ${SMTP_HOST}:${SMTP_PORT}
  # Exemple Gmail: smtp.gmail.com:587
  # Exemple SendGrid: smtp.sendgrid.net:587
  # Exemple GoDaddy: smtpout.secureserver.net:465 (SSL)
  # Les valeurs par défaut sont gérées par le script d'entrypoint
  # ⚠️ Si SMTP_HOST n'est pas défini, utiliser localhost (emails ne fonctionneront pas mais Alertmanager démarrera)
  smtp_smarthost: '${SMTP_HOST}:${SMTP_PORT}'
  smtp_from: '${ALERTMANAGER_FROM_EMAIL}'
  smtp_auth_username: '${SMTP_USERNAME}'
  smtp_auth_password: '${SMTP_PASSWORD}'
  # TLS requis selon le port (géré automatiquement par le script d'entrypoint)
  # Port 465 = SSL implicite (non supporté, utiliser 587)
  # Port 587 = STARTTLS (recommandé, TLS requis)
  # Port 25 = Pas de TLS (non recommandé)
  # ⚠️ La valeur sera remplacée par le script d'entrypoint selon SMTP_PORT
  smtp_require_tls: true

# Templates pour notifications personnalisées
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Routes d'alertes par criticité
route:
  receiver: 'default-receiver'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  
  routes:
    # Alertes critiques → PagerDuty / Slack critical
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
      group_wait: 0s
      repeat_interval: 1h
    
    # Alertes WebSocket critiques → Notification immédiate
    - match:
        component: websocket
        severity: critical
      receiver: 'websocket-critical'
      group_wait: 0s
      repeat_interval: 30m
    
    # Alertes OSRM critiques → Notification immédiate
    - match:
        component: osrm
        severity: critical
      receiver: 'osrm-critical'
      group_wait: 0s
      repeat_interval: 1h
    
    # Alertes Dispatch critiques → Notification immédiate
    - match:
        component: dispatch
        severity: critical
      receiver: 'dispatch-critical'
      group_wait: 0s
      repeat_interval: 1h
    
    # Alertes infrastructure critiques → Notification immédiate
    - match:
        component: infrastructure
        severity: critical
      receiver: 'infrastructure-critical'
      group_wait: 0s
      repeat_interval: 1h
    
    # Alertes database critiques → Notification immédiate
    - match:
        component: database
        severity: critical
      receiver: 'database-critical'
      group_wait: 0s
      repeat_interval: 1h
    
    # Alertes warning → Slack warning channel
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 30s
      repeat_interval: 6h

# Inhibition rules (supprimer alertes redondantes)
inhibit_rules:
  # Si PostgreSQL est down, supprimer les alertes de requêtes lentes
  - source_match:
      alertname: PostgreSQLDown
    target_match:
      component: database
    equal: ['instance']
  
  # Si Redis est down, supprimer les alertes de cache
  - source_match:
      alertname: RedisDown
    target_match:
      component: cache
    equal: ['instance']
  
  # Si le backend est down, supprimer les alertes applicatives
  - source_match:
      alertname: BackendDown
    target_match:
      service: atmr-backend
    equal: ['instance']

# Receivers (destinations des alertes)
receivers:
  # Receiver par défaut → Slack + Email (alertes non critiques)
  # ⚠️ Si SLACK_WEBHOOK_URL est vide, slack_configs sera ignoré
  # ⚠️ Si SMTP_HOST est localhost ou ALERT_EMAIL_TO est vide, email ne fonctionnera pas
  - name: 'default-receiver'
    slack_configs:
      - channel: '#atmr-alerts'
        title: '⚠️ ATMR Alert'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        send_resolved: true
    email_configs:
      - to: ${ALERT_EMAIL_TO}
        headers:
          Subject: '⚠️ ATMR Alert: {{ .GroupLabels.alertname }}'
        html: '{{ range .Alerts }}<h2>{{ .Annotations.summary }}</h2><p>{{ .Annotations.description }}</p>{{ end }}'
        send_resolved: true

  # Alertes critiques → Slack + Email (notifications immédiates)
  - name: 'critical-alerts'
    slack_configs:
      - channel: '#atmr-alerts-critical'
        title: '🚨 ATMR Critical Alert'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Labels:* {{ range .Labels.SortedPairs }}{{ .Name }}={{ .Value }} {{ end }}
          {{ end }}
        send_resolved: true
    
    email_configs:
      - to: ${ALERT_EMAIL_TO}
        headers:
          Subject: '🚨 ATMR Critical Alert: {{ .GroupLabels.alertname }}'
        html: |
          <h1>🚨 ATMR Critical Alert</h1>
          {{ range .Alerts }}
          <h2>{{ .Annotations.summary }}</h2>
          <p><strong>Description:</strong> {{ .Annotations.description }}</p>
          <p><strong>Labels:</strong> {{ range .Labels.SortedPairs }}{{ .Name }}={{ .Value }} {{ end }}</p>
          <hr>
          {{ end }}
        send_resolved: true

  # WebSocket critiques
  - name: 'websocket-critical'
    slack_configs:
      - channel: '#atmr-websocket'
        title: '🔌 WebSocket Critical'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        send_resolved: true
    email_configs:
      - to: ${ALERT_EMAIL_TO}
        headers:
          Subject: '🔌 WebSocket Critical: {{ .GroupLabels.alertname }}'
        html: '{{ range .Alerts }}<h2>{{ .Annotations.summary }}</h2><p>{{ .Annotations.description }}</p>{{ end }}'
        send_resolved: true

  # OSRM critiques
  - name: 'osrm-critical'
    slack_configs:
      - channel: '#atmr-osrm'
        title: '🗺️ OSRM Critical'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        send_resolved: true
    email_configs:
      - to: ${ALERT_EMAIL_TO}
        headers:
          Subject: '🗺️ OSRM Critical: {{ .GroupLabels.alertname }}'
        html: '{{ range .Alerts }}<h2>{{ .Annotations.summary }}</h2><p>{{ .Annotations.description }}</p>{{ end }}'
        send_resolved: true

  # Dispatch critiques
  - name: 'dispatch-critical'
    slack_configs:
      - channel: '#atmr-dispatch'
        title: '🚗 Dispatch Critical'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        send_resolved: true
    email_configs:
      - to: ${ALERT_EMAIL_TO}
        headers:
          Subject: '🚗 Dispatch Critical: {{ .GroupLabels.alertname }}'
        html: '{{ range .Alerts }}<h2>{{ .Annotations.summary }}</h2><p>{{ .Annotations.description }}</p>{{ end }}'
        send_resolved: true

  # Infrastructure critiques
  - name: 'infrastructure-critical'
    slack_configs:
      - channel: '#atmr-infrastructure'
        title: '🖥️ Infrastructure Critical'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        send_resolved: true
    email_configs:
      - to: ${ALERT_EMAIL_TO}
        headers:
          Subject: '🖥️ Infrastructure Critical: {{ .GroupLabels.alertname }}'
        html: '{{ range .Alerts }}<h2>{{ .Annotations.summary }}</h2><p>{{ .Annotations.description }}</p>{{ end }}'
        send_resolved: true

  # Database critiques
  - name: 'database-critical'
    slack_configs:
      - channel: '#atmr-database'
        title: '🗄️ Database Critical'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        send_resolved: true
    email_configs:
      - to: ${ALERT_EMAIL_TO}
        headers:
          Subject: '🗄️ Database Critical: {{ .GroupLabels.alertname }}'
        html: '{{ range .Alerts }}<h2>{{ .Annotations.summary }}</h2><p>{{ .Annotations.description }}</p>{{ end }}'
        send_resolved: true

  # Alertes warning
  - name: 'warning-alerts'
    slack_configs:
      - channel: '#atmr-alerts-warning'
        title: '⚠️ ATMR Warning'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        send_resolved: true
    email_configs:
      - to: ${ALERT_EMAIL_TO}
        headers:
          Subject: '⚠️ ATMR Warning: {{ .GroupLabels.alertname }}'
        html: '{{ range .Alerts }}<h2>{{ .Annotations.summary }}</h2><p>{{ .Annotations.description }}</p>{{ end }}'
        send_resolved: true
