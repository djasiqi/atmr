# Prometheus staging GPS — réseau atmrstg uniquement. Jamais atmr-network / Traefik prod.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    env: staging
    app: atmrstg

scrape_configs:
  - job_name: backend
    metrics_path: /api/v1/prometheus/metrics
    static_configs:
      - targets: ["backend:5000"]
        labels:
          env: staging
          role: api

  - job_name: tracking-kafka-consumer
    metrics_path: /metrics
    static_configs:
      - targets: ["tracking-kafka-consumer:9115"]
        labels:
          env: staging
          role: kafka-consumer

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          env: staging
          role: postgres

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          env: staging
          role: redis
