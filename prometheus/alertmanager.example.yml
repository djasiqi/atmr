# yaml-language-server: disable
# Exemple de configuration Alertmanager (PagerDuty + email)
#
# Usage:
#   1. Copier ce fichier vers alertmanager.yml
#   2. Remplacer <PAGERDUTY_INTEGRATION_KEY> par votre clé d'intégration PagerDuty
#   3. Déployer Alertmanager avec docker-compose ou Kubernetes
#
# Documentation: https://prometheus.io/docs/alerting/latest/configuration/

global:
  resolve_timeout: 5m

route:
  receiver: 'default'
  group_by: ['cluster', 'alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 3h

  routes:
    - match:
        severity: critical
        notification: pagerduty
      receiver: 'pagerduty-critical'
      continue: true

    - match:
        severity: warning
        notification: pagerduty
      receiver: 'pagerduty-warning'
      continue: true

receivers:
  - name: 'default'
    email_configs:
      - to: 'alerts@example.com'
        headers:
          Subject: 'ATMR Alert: {{ .GroupLabels.alertname }}'

  - name: 'pagerduty-critical'
    pagerduty_configs:
      - service_key: '<PAGERDUTY_INTEGRATION_KEY>'
        description: '{{ .GroupLabels.alertname }}'
        severity: 'critical'
        details:
          summary: '{{ .CommonAnnotations.summary }}'
          description: '{{ .CommonAnnotations.description }}'
          runbook_url: '{{ .CommonAnnotations.runbook_url }}'
          component: '{{ .CommonLabels.component }}'
          environment: '{{ .CommonLabels.environment }}'

  - name: 'pagerduty-warning'
    pagerduty_configs:
      - service_key: '<PAGERDUTY_INTEGRATION_KEY>'
        description: '{{ .GroupLabels.alertname }}'
        severity: 'warning'
        details:
          summary: '{{ .CommonAnnotations.summary }}'
          description: '{{ .CommonAnnotations.description }}'
          runbook_url: '{{ .CommonAnnotations.runbook_url }}'

templates:
  - '/etc/alertmanager/templates/*.tmpl'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['component', 'cluster']
