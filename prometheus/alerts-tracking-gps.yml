groups:
  - name: tracking_gps
    rules:
      - alert: TrackingInvariantViolation
        expr: increase(tracking_invariant_violation_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Violation invariant GPS {{ $labels.invariant_id }}"
      - alert: TrackingFleetFrozen
        expr: increase(driver_location_received_total[10m]) == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Aucune position reçue depuis 10 min"
      - alert: TrackingProcessedFrozen
        expr: increase(driver_location_processed_total{accept_status="accepted_canonical"}[10m]) == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Aucune position canonical traitée (processed.v2) depuis 10 min"
      - alert: TrackingActiveMissionFgsDown
        expr: increase(tracking_stale_fix_watchdog_kick_total{reason="mobile_tracking_down"}[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Watchdog kicke en continu des chauffeurs en mission live au tracking éteint (FGS down)"
          description: "Le self-heal mobile cold-start ne réveille pas le runtime malgré le kick serveur ; vérifier le bridge mobile (tracking_self_heal_cold_start_enabled, force_tracking_restart)."
      - alert: TrackingActiveMissionNoCanonical
        expr: increase(tracking_stale_fix_watchdog_kick_total{reason="no_fresh_position"}[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Mission active sans position canonical fraîche — watchdog kicke en continu (FGS zombie probable)"
          description: "Des chauffeurs en mission (live ou ASSIGNED T-30) n'ont aucune position canonical fraîche (>3 min) alors que le device se déclare sain. Signal non-falsifiable : le terminal n'envoie rien malgré tracking_active=1. Si l'alerte persiste, le self-heal mobile (hard restart sur force_tracking_restart) ne rétablit pas l'envoi — investiguer device/réseau."
      - alert: TrackingStaleRateHigh
        expr: |
          sum(rate(driver_device_health_received_total{constraint_reason="fix_stale"}[5m]))
          /
          sum(rate(driver_device_health_received_total[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: ">5% drivers fix_stale"
      - alert: TrackingPipelineStageSLOBreach
        expr: |
          histogram_quantile(0.95,
            sum(rate(tracking_pipeline_stage_latency_seconds_bucket[5m])) by (le, stage)
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SLO latence dépassé pour stage {{ $labels.stage }}"
      - alert: KafkaPartitionImbalance
        expr: |
          max(kafka_consumergroup_lag) by (topic)
          /
          (avg(kafka_consumergroup_lag) by (topic) + 1) > 3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Déséquilibre partitions Kafka tracking"
